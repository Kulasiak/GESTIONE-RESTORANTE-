function printProduction(d, prodArr){
  const w = window.open("", "_blank", "width=620,height=820");
  if(!w){ toast("Consenti le finestre popup per stampare","err"); return; }
  w.document.write('<!doctype html><meta charset="utf-8"><title>Produzione ' + esc(d) + '</title>' +
    '<style>body{font-family:system-ui,sans-serif;padding:26px;color:#111}h1{font-size:21px;margin:0 0 3px}' +
    'p{color:#666;margin:0 0 20px;font-size:13px}li{font-size:17px;padding:10px 0;border-bottom:1px solid #eee;list-style:none;display:flex;gap:14px}' +
    'b{min-width:52px;font-size:20px}ul{padding:0;margin:0}</style>' +
    '<h1>Foglio di produzione colazioni</h1><p>' + esc(DB.meta.biz.name) + ' &middot; ' + esc(fmtDate(d,{weekday:"long",day:"numeric",month:"long",year:"numeric"})) + '</p><ul>' +
    prodArr.map(p=>{ const it = itemById(p.id);
      return '<li><b>' + p.q + '</b><span>' + esc(it ? L(it.name) : "?") + '</span></li>'; }).join("") +
    '</ul>');
  w.document.close(); setTimeout(()=> w.print(), 260);
}

/* ============================================================
   PARTE 24 — ASPORTO E CONSEGNE
   ============================================================ */
VIEWS.away = function(){
  const d = today();
  const takeaway = DB.orders.filter(o=> o.type === "asporto" && (o.date === d || o.status !== "chiuso"));
  const hotelAway = DB.hotelOrders.filter(o=> o.type === "asporto" && o.date === d);
  const openTk = takeaway.filter(o=> o.status !== "chiuso");

  const html =
    '<div class="grid g4">' +
      stat(T("nav_away"), takeaway.length, fmtDate(d)) +
      stat("Aperti", openTk.length, eur(sum(openTk.map(orderTotal)))) +
      stat("Consegne hotel", hotelAway.length, "oggi") +
      stat("Incasso asporto", eur(sum(takeaway.filter(o=>o.status==="chiuso").map(o=> o.total||0))), "chiusi oggi") +
    '</div>' +
    card(T("nav_away") + " " + esc("al banco"),
      takeaway.length ? '<div class="list">' + takeaway.map(o=>
        '<div class="li"><div class="ic">' + icon("bag") + '</div>' +
        '<div class="tx"><b>' + esc(o.note || ("Asporto " + o.id.slice(-4))) + '</b>' +
        '<span>' + o.lines.length + ' righe &middot; ' + esc(o.opened.slice(11,16)) + '</span></div>' +
        '<div class="end"><b class="num">' + eur(o.total != null ? o.total : orderTotal(o)) + '</b>' +
        (o.status !== "chiuso"
          ? '<button class="btn sm pri" data-ao="' + o.id + '">' + esc(T("c_open")) + '</button>' +
            '<button class="btn sm ok" data-ap="' + o.id + '">' + esc(T("o_pay")) + '</button>'
          : '<span class="badge g">' + esc(T("c_done")) + '</span>') + '</div></div>').join("") + '</div>'
        : empty("Nessun ordine da asporto oggi","bag"), '', "mt flush") +
    card("Consegne agli hotel",
      hotelAway.length ? '<div class="list">' + hotelAway.map(o=>{
        const h = hotelById(o.hotelId);
        return '<div class="li"><div class="avat" style="background:var(--blue-soft);color:var(--blue)">' + esc((o.slot||"").replace(":","")) + '</div>' +
          '<div class="tx"><b>' + esc(h ? h.name : "?") + '</b><span>' +
          (o.lines||[]).map(l=>{ const it = itemById(l.itemId); return l.qty + " " + (it ? L(it.name) : "?"); }).join(", ") + '</span>' +
          (o.note ? '<span style="color:var(--amber)">' + esc(o.note) + '</span>' : '') + '</div>' +
          '<div class="end"><b class="num">' + eur(hoTotal(o)) + '</b><span class="badge ' + (o.status==="consegnato"?"g":"b") + '">' + esc(o.status) + '</span>' +
          '<button class="btn ico sm ghost" data-addt="' + o.id + '">' + icon("print",12) + '</button>' +
          '<button class="btn ico sm ghost" data-aed="' + o.id + '">' + icon("edit",12) + '</button></div></div>';
      }).join("") + '</div>' : empty("Nessuna consegna hotel oggi","hotel"), '', "mt flush");

  return {
    title:T("nav_away"), sub:fmtDate(d,{weekday:"long",day:"numeric",month:"long"}),
    actions:'<button class="btn ghost" data-anh>' + icon("hotel",15) + esc("Consegna hotel") + '</button>' +
            '<button class="btn pri" data-ant>' + icon("plus",15) + esc(T("c_new")) + '</button>',
    html:html,
    after:()=>{
      $$("[data-ao]").forEach(b=> b.onclick = ()=> orderSheet(b.getAttribute("data-ao")));
      $$("[data-ap]").forEach(b=> b.onclick = ()=> payOrder(b.getAttribute("data-ap")));
      $$("[data-aed]").forEach(b=> b.onclick = ()=> hotelOrderSheet(b.getAttribute("data-aed")));
      $$("[data-addt]").forEach(b=> b.onclick = ()=> printDDT(byId(DB.hotelOrders, b.getAttribute("data-addt"))));
      $("[data-ant]").onclick = newAwayOrder;
      $("[data-anh]").onclick = ()=> hotelOrderSheet(null, null, d, "asporto");
    }
  };
};
</script>
<script>
/* ============================================================
   PARTE 25 — BRIEFING DEL GIORNO
   ============================================================ */
VIEWS.briefing = function(){
  const d = today();
  let br = briefingOf(d);
  const sl = todaySlogan();
  const sp = specials(), so = soldOut();
  const res = DB.reservations.filter(r=> r.date === d && r.status !== "annullata");
  const onShift = shiftsOf(d);
  const iss = DB.issues.filter(i=> i.status === "aperta");
  const low = lowStock();

  const html =
    (br ? '<div class="card" style="background:var(--green-soft);border-color:transparent;margin-bottom:14px"><div class="card-b" style="padding:12px 15px">' +
      '<b style="color:var(--green);font-size:13.5px">' + icon("check",14) + ' ' + esc("Briefing fatto") + ' ' + esc(br.at ? br.at.slice(11,16) : "") +
      ' &middot; ' + (br.attendees||[]).length + ' ' + esc("presenti") + '</b></div></div>' : '') +

    '<div class="grid g4">' +
      stat(T("c_covers") + " attesi", sum(res.map(r=>r.covers)), res.length + " " + T("nav_book").toLowerCase()) +
      stat("In turno", onShift.length, onShift.map(s=> initials(staffName(s.staffId))).join(" ")) +
      stat(T("br_specials"), sp.length, sp.map(i=> L(i.name)).join(", ").slice(0,40) || "-") +
      stat(T("br_soldout"), so.length, so.map(i=> L(i.name)).join(", ").slice(0,40) || "-") +
    '</div>' +

    '<div class="grid g2 mt">' +
      card(T("br_title") + " &middot; " + fmtDate(d,{weekday:"long",day:"numeric",month:"long"}),
        '<div class="field"><label>' + esc(T("mk_slogan")) + '</label>' +
          '<div style="padding:11px 13px;border-radius:var(--r-s);background:var(--brand-soft);color:var(--brand);font-family:var(--serif);font-size:17px;line-height:1.35">' +
          esc(sl ? L(sl.text) : "-") + '</div>' +
          '<button class="btn sm ghost mt-s" data-go="slogan">' + esc(T("mk_gen")) + '</button></div>' +
        '<div class="field"><label>' + esc(T("br_focus")) + '</label><input class="inp" name="focus" value="' + esc(br ? br.focus : "") + '" placeholder="' + esc("Es. proporre il dolce a ogni tavolo") + '"></div>' +
        '<div class="field"><label>' + esc(T("br_events")) + '</label><textarea class="inp" name="events" style="min-height:60px" placeholder="' + esc("compleanni, gruppi, allergie importanti, VIP") + '">' + esc(br ? br.events : (res.filter(r=>r.note).map(r=> r.time + " " + r.name + ": " + r.note).join("\n"))) + '</textarea></div>' +
        '<div class="field"><label>' + esc(T("c_notes")) + '</label><textarea class="inp" name="notes" style="min-height:60px">' + esc(br ? br.notes : "") + '</textarea></div>' +
        '<div class="field"><label>' + esc(T("br_attend")) + '</label><div class="row tight">' +
          DB.staff.filter(s=> s.active).map(s=>
            '<button type="button" class="btn sm ' + (br && (br.attendees||[]).includes(s.id) ? "pri" : "ghost") + '" data-at="' + s.id + '">' +
            esc(initials(s.name)) + '</button>').join("") + '</div></div>' +
        '<button class="btn pri block mt" data-brsave>' + icon("check",15) + esc(br ? T("c_save") : T("br_run")) + '</button>') +

      '<div>' +
        card("Punti da dire oggi",
          '<div class="list">' +
          [ sp.length ? {i:"menu", t:T("br_specials"), s:sp.map(x=> L(x.name) + " " + eur(x.price)).join(" &middot; ")} : null,
            so.length ? {i:"warn", t:T("br_soldout"), s:so.map(x=> L(x.name)).join(" &middot; ")} : null,
            res.length ? {i:"book", t:T("nav_book"), s:res.map(r=> r.time + " " + r.name + " (" + r.covers + ")").join(" &middot; ")} : null,
            low.length ? {i:"stock", t:T("s_reorder"), s:low.map(x=> x.name).join(" &middot; ")} : null,
            iss.length ? {i:"warn", t:T("q_openissues"), s:iss.map(x=> x.desc).join(" &middot; ")} : null,
            {i:"heart", t:T("nav_conduct"), s:L(SEED_CONDUCT[new Date().getDate() % SEED_CONDUCT.length])},
            {i:"table", t:T("t_setup"), s:L(SEED_MISE[new Date().getDate() % SEED_MISE.length])}
          ].filter(Boolean).map(x=>
            '<div class="li" style="padding-inline:0;align-items:flex-start"><div class="ic">' + icon(x.i) + '</div>' +
            '<div class="tx"><b>' + esc(x.t) + '</b><span style="white-space:normal">' + x.s + '</span></div></div>').join("") +
          '</div>', '', "flush") +
        card(T("br_prev"),
          DB.briefings.length ? '<div class="list">' + DB.briefings.slice().reverse().slice(0,6).map(b=>
            '<div class="li" style="padding-inline:0"><div class="ic">' + icon("brief") + '</div>' +
            '<div class="tx"><b>' + esc(fmtDate(b.date,{weekday:"short",day:"numeric",month:"short"})) + '</b>' +
            '<span>' + esc((b.focus || "-").slice(0,60)) + ' &middot; ' + (b.attendees||[]).length + ' ' + esc("presenti") + '</span></div></div>').join("") + '</div>'
            : empty("Nessun briefing registrato","brief"), '', "mt flush") +
      '</div>' +
    '</div>';

  return {
    title:T("nav_briefing"), sub:fmtDate(d,{weekday:"long",day:"numeric",month:"long",year:"numeric"}),
    actions:'<button class="btn ghost" data-brprint>' + icon("print",15) + esc(T("c_print")) + '</button>' +
            '<button class="btn ghost" data-go="conduct">' + icon("heart",15) + esc(T("nav_conduct")) + '</button>',
    html:html,
    after:()=>{
      const att = br ? (br.attendees || []).slice() : [];
      $$("[data-at]").forEach(b=> b.onclick = ()=>{
        const id = b.getAttribute("data-at");
        const ix = att.indexOf(id);
        if(ix >= 0) att.splice(ix,1); else att.push(id);
        b.className = "btn sm " + (att.includes(id) ? "pri" : "ghost");
      });
      $("[data-brsave]").onclick = ()=>{
        const f = readForm($("#view"));
        const rec = {id:br ? br.id : uid("br"), date:d, at:new Date().toISOString(),
          focus:f.focus||"", events:f.events||"", notes:f.notes||"", attendees:att,
          slogan:sl ? L(sl.text) : "", specials:sp.map(x=> x.id), soldOut:so.map(x=> x.id),
          covers:sum(res.map(r=>r.covers))};
        if(br) Object.assign(br, rec); else DB.briefings.push(rec);
        save(); refresh(); toast("Briefing registrato", "ok");
      };
      $("[data-brprint]").onclick = ()=> printBriefing(d, sp, so, res, sl);
    }
  };
};

function printBriefing(d, sp, so, res, sl){
  const w = window.open("", "_blank", "width=740,height=980");
  if(!w){ toast("Consenti le finestre popup per stampare","err"); return; }
  const sec = (t, body)=> '<h3>' + esc(t) + '</h3>' + body;
  w.document.write('<!doctype html><meta charset="utf-8"><title>Briefing</title>' +
    '<style>body{font-family:system-ui,sans-serif;padding:22mm;color:#111;font-size:13px;line-height:1.6}' +
    'h1{font-size:24px;margin:0 0 2px}h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#888;margin:20px 0 6px}' +
    '.sl{font-family:Georgia,serif;font-size:20px;color:#B4451F;padding:12px 0}ul{padding-inline-start:18px;margin:0}' +
    'li{padding:2px 0}.g{color:#666}@page{size:A4;margin:0}</style>' +
    '<h1>' + esc(T("br_title")) + '</h1><div class="g">' + esc(DB.meta.biz.name) + ' &middot; ' +
    esc(fmtDate(d,{weekday:"long",day:"numeric",month:"long",year:"numeric"})) + '</div>' +
    (sl ? '<div class="sl">' + esc(L(sl.text)) + '</div>' : '') +
    sec(T("br_specials"), '<ul>' + (sp.length ? sp.map(i=> '<li>' + esc(L(i.name)) + ' - ' + eur(i.price) + '</li>').join("") : '<li class="g">-</li>') + '</ul>') +
    sec(T("br_soldout"), '<ul>' + (so.length ? so.map(i=> '<li>' + esc(L(i.name)) + '</li>').join("") : '<li class="g">-</li>') + '</ul>') +
    sec(T("br_events"), '<ul>' + (res.length ? res.map(r=> '<li>' + esc(r.time) + ' - ' + esc(r.name) + ' (' + r.covers + ')' + (r.note ? ': ' + esc(r.note) : '') + '</li>').join("") : '<li class="g">-</li>') + '</ul>') +
    sec(T("nav_conduct"), '<ul><li>' + esc(L(SEED_CONDUCT[new Date().getDate() % SEED_CONDUCT.length])) + '</li>' +
      '<li>' + esc(L(SEED_SERVICE[new Date().getDate() % SEED_SERVICE.length])) + '</li></ul>') +
    sec(T("br_attend"), '<div class="g">_________________________________________________________________</div>'));
  w.document.close(); setTimeout(()=> w.print(), 300);
}
</script>
<script>
/* ============================================================
   PARTE 26 — CHECKLIST DEL GIORNO
   ============================================================ */
let CHKTAB = "open";
const CHKSETS = {open:{t:"Apertura", ic:"sun", data:()=> SEED_OPEN},
                 mise:{t:"t_setup", ic:"table", data:()=> SEED_MISE},
                 close:{t:"Chiusura", ic:"clock", data:()=> SEED_CLOSE}};

VIEWS.check = function(){
  const d = today();
  const prog = (k)=>{ const st = checklistOf(d,k); const rows = CHKSETS[k].data();
    return {done:rows.filter((_,i)=> st["i"+i] && st["i"+i].done).length, tot:rows.length}; };
  const set = CHKSETS[CHKTAB];
  const state = checklistOf(d, CHKTAB);
  const rows = set.data();
  const mepLeft = DB.tables.filter(t=> !t.setupDone && t.status !== "fuori").length;

  const html =
    '<div class="grid g4">' +
      Object.keys(CHKSETS).map(k=>{ const p = prog(k);
        return stat(CHKSETS[k].t.startsWith("t_") ? T(CHKSETS[k].t) : CHKSETS[k].t, p.done + "/" + p.tot,
          pct(p.tot ? (p.done/p.tot)*100 : 0)); }).join("") +
      stat(T("nav_tables"), (DB.tables.length - mepLeft) + "/" + DB.tables.length, "mise en place") +
    '</div>' +
    '<div class="tabs mt">' + Object.keys(CHKSETS).map(k=>
      '<button class="' + (CHKTAB===k?"on":"") + '" data-ck="' + k + '">' +
      esc(CHKSETS[k].t.startsWith("t_") ? T(CHKSETS[k].t) : CHKSETS[k].t) + '</button>').join("") + '</div>' +
    card("",
      '<div class="list">' + rows.map((r,i)=>{
        const st = state["i"+i] || {};
        return '<div class="li ' + (st.done ? "done":"") + '">' +
          '<label class="check" style="padding:0"><input type="checkbox" data-cx="' + i + '"' + (st.done ? " checked":"") + '></label>' +
          '<div class="tx"><b style="font-weight:550;white-space:normal">' + esc(L(r)) + '</b>' +
          (st.done && st.by ? '<span>' + esc(staffName(st.by)) + ' &middot; ' + esc(st.at || "") + '</span>' : '') + '</div></div>';
      }).join("") + '</div>' +
      (CHKTAB === "mise" ? '<div class="card-b" style="border-top:1px solid var(--sep)">' +
        '<button class="btn ghost block" data-cmep>' + icon("table",14) + esc(T("t_setup")) + ' &middot; ' + mepLeft + ' ' + esc("tavoli da fare") + '</button></div>' : ''),
      '', "mt flush") +
    '<div class="row mt">' +
      '<select class="inp" id="ck-by" style="width:auto">' +
        DB.staff.filter(s=>s.active).map(s=> '<option value="' + s.id + '">' + esc(s.name) + '</option>').join("") + '</select>' +
      '<button class="btn ghost sm" data-ckall>' + esc("Segna tutto") + '</button>' +
      '<div class="spacer"></div>' +
      '<button class="btn ghost sm" onclick="window.print()">' + icon("print",14) + esc(T("c_print")) + '</button>' +
    '</div>';

  return {
    title:T("nav_check"), sub:fmtDate(d,{weekday:"long",day:"numeric",month:"long"}),
    actions:'<button class="btn ghost" data-go="haccp">' + icon("haccp",15) + esc(T("nav_haccp")) + '</button>',
    html:html,
    after:()=>{
      $$("[data-ck]").forEach(b=> b.onclick = ()=>{ CHKTAB = b.getAttribute("data-ck"); refresh(); });
      $$("[data-cx]").forEach(b=> b.onchange = ()=>{
        const i = b.getAttribute("data-cx");
        state["i"+i] = b.checked ? {done:true, by:$("#ck-by").value, at:nowHM()} : {done:false};
        save(); refresh();
      });
      $("[data-ckall]").onclick = ()=>{
        const by = $("#ck-by").value;
        rows.forEach((_,i)=> state["i"+i] = {done:true, by:by, at:nowHM()});
        save(); refresh(); toast(T("c_done"),"ok");
      };
      const m = $("[data-cmep]"); if(m) m.onclick = mepSheet;
    }
  };
};

/* ============================================================
   PARTE 27 — SE QUALCOSA NON VA
   ============================================================ */
const ISS_TYPES = [["cibo","q_type_food"],["servizio","q_type_serv"],["pulizia","q_type_clean"],["guasto","q_type_tech"],["personale","q_type_staff"]];
const ISS_SEV = [["bassa","q_low","n"],["media","q_mid","a"],["alta","q_high","r"]];
let ISSFILTER = "aperta";

VIEWS.issues = function(){
  const all = DB.issues.slice().reverse();
  const list = ISSFILTER === "tutte" ? all : all.filter(i=> i.status === ISSFILTER);
  const open = all.filter(i=> i.status === "aperta");
  const month = all.filter(i=> i.date.slice(0,7) === today().slice(0,7));

  const html =
    '<div class="grid g4">' +
      stat(T("q_openissues"), open.length, open.filter(i=>i.sev==="alta").length + " " + T("q_high").toLowerCase()) +
      stat(T("c_month"), month.length, "segnalazioni") +
      stat("Chiuse", all.filter(i=>i.status==="chiusa").length, "risolte") +
      stat("Tipo più frequente", (()=>{ const c = {}; month.forEach(i=> c[i.type]=(c[i.type]||0)+1);
        const k = Object.keys(c).sort((a,b)=>c[b]-c[a])[0]; return k || "-"; })(), "questo mese") +
    '</div>' +
    '<div class="card mt" style="background:var(--amber-soft);border-color:transparent"><div class="card-b" style="padding:12px 15px">' +
      '<b style="font-size:13.5px;color:var(--amber)">' + icon("warn",14) + ' ' + esc("Come si usa") + '</b>' +
      '<p style="font-size:13.5px;color:var(--txt-2);margin-top:5px;line-height:1.6">' +
      esc("Se qualcosa non va - un piatto tornato indietro, un ospite scontento, un frigo che perde, un collega assente - si registra qui subito, prima di finire il turno. Ogni segnalazione ha un'azione correttiva e un responsabile: al briefing si leggono quelle ancora aperte.") +
      '</p></div></div>' +
    '<div class="row mt">' +
      '<div class="seg">' + ["aperta","chiusa","tutte"].map(f=>
        '<button class="' + (ISSFILTER===f?"on":"") + '" data-if="' + f + '">' +
        esc(f === "aperta" ? T("q_openissues") : f === "chiusa" ? T("q_closed") : T("c_all")) + '</button>').join("") + '</div>' +
    '</div>' +
    card("",
      list.length ? '<div class="list">' + list.map(i=>{
        const sev = ISS_SEV.find(s=> s[0] === i.sev) || ISS_SEV[0];
        return '<div class="li" style="align-items:flex-start"><div class="ic" style="background:var(--' +
          (sev[2]==="r"?"red":sev[2]==="a"?"amber":"grey") + '-soft);color:var(--' + (sev[2]==="r"?"red":sev[2]==="a"?"amber":"grey") + ')">' + icon("warn") + '</div>' +
          '<div class="tx"><b style="white-space:normal">' + esc(i.desc) + '</b>' +
          '<span>' + esc(fmtDate(i.date,{day:"2-digit",month:"short"})) + ' ' + esc(i.time||"") + ' &middot; ' +
            esc(T((ISS_TYPES.find(t=>t[0]===i.type)||["","q_type_serv"])[1])) +
            (i.by ? ' &middot; ' + esc(staffName(i.by)) : '') + (i.table ? ' &middot; ' + esc(T("c_table")) + ' ' + esc(i.table) : '') + '</span>' +
          (i.action ? '<span style="color:var(--green)">' + icon("check",11) + ' ' + esc(i.action) + '</span>' : '') + '</div>' +
          '<div class="end"><span class="badge ' + sev[2] + '">' + esc(T(sev[1])) + '</span>' +
          (i.status === "aperta" ? '<button class="btn sm ok" data-icl="' + i.id + '">' + esc("Chiudi") + '</button>'
            : '<span class="badge g">' + esc(T("q_closed")) + '</span>') +
          '<button class="btn ico sm ghost" data-ied="' + i.id + '">' + icon("edit",12) + '</button></div></div>';
      }).join("") + '</div>' : empty("Nessuna segnalazione: buon segno","check"), '', "mt flush");

  return {
    title:T("nav_issues"), sub:open.length + " " + T("q_openissues").toLowerCase(),
    actions:'<button class="btn pri" data-inew>' + icon("plus",15) + esc(T("q_issue")) + '</button>',
    html:html,
    after:()=>{
      $$("[data-if]").forEach(b=> b.onclick = ()=>{ ISSFILTER = b.getAttribute("data-if"); refresh(); });
      $$("[data-ied]").forEach(b=> b.onclick = ()=> issueSheet(b.getAttribute("data-ied")));
      $$("[data-icl]").forEach(b=> b.onclick = ()=>{
        const i = byId(DB.issues, b.getAttribute("data-icl"));
        if(!i.action){ issueSheet(i.id); toast("Scrivi prima l'azione correttiva","warn"); return; }
        i.status = "chiusa"; i.closedAt = new Date().toISOString(); save(); refresh(); toast(T("q_closed"),"ok");
      });
      $("[data-inew]").onclick = ()=> issueSheet(null);
    }
  };
};

function issueSheet(id){
  const i = id ? byId(DB.issues, id) : null;
  const body =
    '<div class="field"><label>' + esc("Che cosa e successo") + '</label><textarea class="inp" name="desc" placeholder="' + esc("Es. la carbonara del tavolo 7 e tornata indietro fredda") + '">' + esc(i ? i.desc : "") + '</textarea></div>' +
    '<div class="f3">' +
      '<div class="field"><label>Tipo</label><select class="inp" name="type">' +
        ISS_TYPES.map(t=> '<option value="' + t[0] + '"' + (i && i.type === t[0] ? " selected":"") + '>' + esc(T(t[1])) + '</option>').join("") + '</select></div>' +
      '<div class="field"><label>' + esc(T("q_sev")) + '</label><select class="inp" name="sev">' +
        ISS_SEV.map(sv=> '<option value="' + sv[0] + '"' + (i && i.sev === sv[0] ? " selected":"") + '>' + esc(T(sv[1])) + '</option>').join("") + '</select></div>' +
      '<div class="field"><label>' + esc(T("c_table")) + '</label><input class="inp" name="table" value="' + esc(i ? i.table : "") + '"></div>' +
    '</div>' +
    '<div class="field"><label>' + esc("Chi segnala") + '</label><select class="inp" name="by">' +
      DB.staff.filter(s=>s.active).map(s=> '<option value="' + s.id + '"' + (i && i.by === s.id ? " selected":"") + '>' + esc(s.name) + '</option>').join("") + '</select></div>' +
    '<div class="field"><label>' + esc(T("q_action")) + '</label><textarea class="inp" name="action" style="min-height:56px" placeholder="' + esc("Cosa è stato fatto perché non succeda più") + '">' + esc(i ? i.action : "") + '</textarea></div>';
  const acts = [{label:T("c_cancel"), cls:"ghost"}];
  if(i) acts.push({label:T("c_del"), cls:"dang", run:()=>{ DB.issues = DB.issues.filter(x=>x.id!==id); save(); refresh(); }});
  acts.push({label:T("c_save"), cls:"pri", run:(w)=>{
    const f = readForm(w);
    if(!f.desc){ toast(T("c_desc"),"err"); return false; }
    const patch = {desc:f.desc, type:f.type, sev:f.sev, table:f.table, by:f.by, action:f.action};
    if(i) Object.assign(i, patch);
    else DB.issues.push(Object.assign({id:uid("is"), date:today(), time:nowHM(), status:"aperta", closedAt:null}, patch));
    save(); refresh(); toast(T("c_save"),"ok");
  }});
  modal({title:i ? T("q_issue") : T("c_new") + " " + T("q_issue").toLowerCase(), body:body, actions:acts});
}
</script>
<script>
/* ============================================================
   PARTE 28 — SLOGAN DEL GIORNO
   ============================================================ */
/* Il generatore compone: [apertura] + [soggetto] + [chiusura], in 6 lingue. */
const SL_A = [
  m6(["Oggi","Today","Aujourd'hui","Hoy","Heute","اليوم"]),
  m6(["Da noi","Here","Chez nous","Aqui","Bei uns","عندنا"]),
  m6(["Stasera","Tonight","Ce soir","Esta noche","Heute Abend","الليلة"]),
  m6(["Questo pomeriggio","This afternoon","Cet apres-midi","Esta tarde","Heute Nachmittag","بعد الظهر"])
];
const SL_B = [
  m6(["la pasta è fatta a mano","the pasta is handmade","les pates sont faites main","la pasta es artesanal","die Pasta ist handgemacht","المعكرونة مصنوعة يدويا"]),
  m6(["il pesce arriva dal porto","the fish comes from the harbour","le poisson vient du port","el pescado viene del puerto","der Fisch kommt vom Hafen","السمك يأتي من الميناء"]),
  m6(["il forno è sempre acceso","the oven is always on","le four est toujours allume","el horno siempre encendido","der Ofen ist immer an","الفرن دائما مشتعل"]),
  m6(["il cocktail lo fa il barman","the barman makes your cocktail","le barman prepare votre cocktail","el barman hace tu coctel","der Barmann mixt deinen Cocktail","الساقي يحضر كوكتيلك"]),
  m6(["il dolce è fatto stamattina","the dessert was made this morning","le dessert est fait ce matin","el postre es de esta manana","das Dessert ist von heute Morgen","الحلوى محضرة هذا الصباح"]),
  m6(["il pane esce caldo dal forno","the bread comes out warm","le pain sort chaud du four","el pan sale caliente","das Brot kommt warm heraus","الخبز يخرج ساخنا"])
];
const SL_C = [
  m6(["e si sente","and you can taste it","et ca se sent","y se nota","und man schmeckt es","ويمكنك تذوقه"]),
  m6(["come una volta","like it used to be","comme autrefois","como antes","wie fruher","كما في الماضي"]),
  m6(["passa a provare","come and try","venez gouter","ven a probarlo","komm probieren","تعال وجرب"]),
  m6(["ti aspettiamo","we are waiting for you","on vous attend","te esperamos","wir warten auf dich","ننتظرك"]),
  m6(["niente di più","nothing more","rien de plus","nada mas","nichts weiter","لا شيء أكثر"])
];
function genSlogan(){
  const pick = (a)=> a[Math.floor(Math.random()*a.length)];
  const a = pick(SL_A), b = pick(SL_B), c = pick(SL_C);
  const o = {};
  LKEYS.forEach(lk=>{
    const txt = a[lk] + " " + b[lk] + ", " + c[lk];
    o[lk] = txt.charAt(0).toUpperCase() + txt.slice(1);
  });
  return o;
}

VIEWS.slogan = function(){
  const cur = todaySlogan();
  const used = {};
  DB.slogans.forEach(s=> (s.used||[]).forEach(d=> used[d] = s.id));
  const last7 = Array.from({length:7},(_,i)=> addDays(today(),-6+i));

  const html =
    '<div class="card" style="position:relative;overflow:hidden;border:0;color:#fff;' +
      (photoURL(cur && cur.photo)
        ? 'background:url(' + photoURL(cur.photo) + ') center/cover'
        : 'background:linear-gradient(150deg,var(--brand),var(--brand-2))') + '">' +
      (photoURL(cur && cur.photo)
        ? '<div style="position:absolute;inset:0;background:linear-gradient(165deg,rgba(10,7,4,.45),rgba(10,7,4,.78))"></div>' : '') +
      '<div class="card-b" style="position:relative;padding:30px 24px;text-align:center">' +
        '<div style="font-size:11.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;opacity:.8">' + esc(T("nav_slogan")) + '</div>' +
        '<div style="font-family:var(--serif);font-size:31px;margin-top:12px;line-height:1.25;text-wrap:balance">' +
          esc(cur ? L(cur.text) : "-") + '</div>' +
        '<div class="row" style="justify-content:center;margin-top:16px">' +
          '<button class="btn sm" style="background:rgba(255,255,255,.2);color:#fff" data-slgen>' + icon("mega",13) + esc(T("mk_gen")) + '</button>' +
          '<button class="btn sm" style="background:#fff;color:var(--brand)" data-slled>' + icon("led",13) + esc(T("mk_led_play")) + '</button>' +
        '</div>' +
      '</div></div>' +

    (cur ? card("Lo stesso slogan nelle altre lingue",
      '<div class="grid g2" style="gap:10px">' + LKEYS.map(lk=>
        '<div class="row" style="align-items:flex-start;flex-wrap:nowrap;gap:9px" dir="' + LANGS[lk].dir + '">' +
        flag(lk,13) + '<div style="font-size:13.5px;line-height:1.5">' + esc(cur.text[lk] || "-") + '</div></div>').join("") +
      '</div>', '', "mt") : '') +

    card("Ultimi 7 giorni",
      '<div class="list">' + last7.map(d=>{
        const sid = used[d]; const s = sid ? byId(DB.slogans, sid) : null;
        return '<div class="li" style="padding-inline:0"><div class="avat sm">' + esc(fmtDate(d,{day:"2-digit"})) + '</div>' +
          '<div class="tx"><b style="font-weight:500;white-space:normal">' + esc(s ? L(s.text) : "-") + '</b>' +
          '<span>' + esc(fmtDate(d,{weekday:"long"})) + '</span></div></div>';
      }).join("") + '</div>', '', "mt flush") +

    card("Archivio slogan (" + DB.slogans.length + ")",
      '<div class="list">' + DB.slogans.slice().reverse().map(s=>
        '<div class="li" style="padding-inline:0">' + thumb(s.photo, 38, 8) +
        '<div class="tx"><b style="font-weight:500;white-space:normal">' + esc(L(s.text)) + '</b>' +
        '<span>' + (s.used||[]).length + ' ' + esc("volte usato") + '</span></div>' +
        '<div class="end"><button class="btn sm ' + (cur && cur.id === s.id ? "ok" : "ghost") + '" data-sluse="' + s.id + '">' +
          esc(cur && cur.id === s.id ? T("c_today") : T("mk_use")) + '</button>' +
        '<button class="btn ico sm ghost" data-sled="' + s.id + '">' + icon("edit",12) + '</button>' +
        '<button class="btn ico sm dang" data-sldel="' + s.id + '">' + icon("trash",12) + '</button></div></div>').join("") + '</div>',
      '', "mt flush");

  return {
    title:T("nav_slogan"), sub:fmtDate(today(),{weekday:"long",day:"numeric",month:"long"}),
    actions:'<button class="btn ghost" data-slnew>' + icon("plus",15) + esc(T("c_new")) + '</button>' +
            '<button class="btn pri" data-slgen2>' + icon("mega",15) + esc(T("mk_gen")) + '</button>',
    html:html,
    after:()=>{
      const useIt = (id)=>{
        DB.sloganToday = {id:id, date:today()};
        const s = byId(DB.slogans, id);
        s.used = s.used || []; if(!s.used.includes(today())) s.used.push(today());
        save(); refresh(); toast(T("mk_use"), "ok");
      };
      const gen = ()=>{
        const s = {id:uid("sl"), text:genSlogan(), used:[]};
        DB.slogans.push(s); useIt(s.id);
      };
      $("[data-slgen]").onclick = gen;
      $("[data-slgen2]").onclick = gen;
      $("[data-slled]").onclick = startLed;
      $("[data-slnew]").onclick = ()=> sloganSheet(null);
      $$("[data-sluse]").forEach(b=> b.onclick = ()=> useIt(b.getAttribute("data-sluse")));
      $$("[data-sled]").forEach(b=> b.onclick = ()=> sloganSheet(b.getAttribute("data-sled")));
      $$("[data-sldel]").forEach(b=> b.onclick = ()=>{
        const id = b.getAttribute("data-sldel");
        DB.slogans = DB.slogans.filter(x=> x.id !== id);
        if(DB.sloganToday && DB.sloganToday.id === id) DB.sloganToday = null;
        save(); refresh();
      });
    }
  };
};

function sloganSheet(id){
  const s = id ? byId(DB.slogans, id) : null;
  let getPhoto = ()=> (s ? s.photo : null) || null;
  modal({title:s ? T("c_edit") : T("c_new") + " " + T("mk_slogan").toLowerCase(), size:"wide",
    body:mlFields("text", s ? s.text : null, T("mk_slogan"), true) +
         photoField("Immagine dello slogan", s ? s.photo : null), actions:[
    {label:T("c_cancel"), cls:"ghost"},
    {label:T("c_save"), cls:"pri", run:(w)=>{
      const text = readML(w, "text");
      if(!text.it){ toast(T("mk_slogan"),"err"); return false; }
      if(s){ s.text = text; s.photo = getPhoto(); }
      else DB.slogans.push({id:uid("sl"), text:text, used:[], photo:getPhoto()});
      save(); phGarbage(); refresh(); toast(T("c_save"),"ok");
    }}
  ], onOpen:(w)=>{ getPhoto = wirePhoto(w); }});
}
</script>
<script>
/* ============================================================
   PARTE 27b — CASSA AL BANCO
   Serve a prendere l'ordine in fretta toccando le foto: colazione al
   mattino, gastronomia a mezzogiorno. NON è un registratore fiscale e non
   emette scontrini validi: il documento commerciale lo fa il registratore
   telematico, questo e solo il promemoria dell'ordine.
   ============================================================ */
let CASSA = {lines:[], area:"colazione", cat:null};

function cassaTotal(){ return sum(CASSA.lines.map(lineTotal)); }
function cassaAdd(itemId){
  const it = itemById(itemId); if(!it || !it.available) return;
  const ex = CASSA.lines.find(l=> l.itemId === itemId);
  if(ex) ex.qty++;
  else CASSA.lines.push({id:uid("ln"), itemId:itemId, qty:1, price:it.price, course:"", note:"", mods:[], status:"servito"});
  refresh();
}

VIEWS.cassa = function(){
  const cats = DB.cats.filter(c=> c.area === CASSA.area).sort((a,b)=> a.order - b.order);
  if(!cats.some(c=> c.id === CASSA.cat)) CASSA.cat = cats.length ? cats[0].id : null;
  const items = DB.items.filter(i=> i.cat === CASSA.cat);
  const tot = cassaTotal();
  const nToday = DB.orders.filter(o=> o.type === "banco" && o.date === today()).length;
  const revToday = sum(DB.orders.filter(o=> o.type === "banco" && o.date === today()).map(o=> o.total || 0));

  const tile = (i)=>{
    const u = photoURL(i.photo);
    return '<button class="catile' + (i.available ? "" : " off") + '" data-cai="' + i.id + '"' + (i.available ? "" : " disabled") + '>' +
      '<span class="im"' + (u ? ' style="background-image:url(' + u + ')"' : '') + '>' +
        (u ? '' : '<span class="ph-txt">' + esc(L(i.name)) + '</span>') + '</span>' +
      '<span class="nm">' + esc(L(i.name)) + '</span>' +
      '<span class="pr">' + eur(i.price) + '</span>' +
      (i.available ? '' : '<span class="so">' + esc(T("k_sold")) + '</span>') +
    '</button>';
  };

  const cart = CASSA.lines.length
    ? '<div class="list">' + CASSA.lines.map(l=>{ const it = itemById(l.itemId);
        return '<div class="li" style="padding:7px 12px">' +
          '<div class="row tight" style="flex-wrap:nowrap">' +
            '<button class="btn ico sm" data-caq="' + l.id + '" data-d="-1">-</button>' +
            '<b class="num" style="min-width:18px;text-align:center">' + l.qty + '</b>' +
            '<button class="btn ico sm" data-caq="' + l.id + '" data-d="1">+</button>' +
          '</div>' +
          '<div class="tx"><b>' + esc(it ? L(it.name) : "?") + '</b><span>' + eur(l.price + modsPrice(l)) + '</span>' + modChips(l, true) + '</div>' +
          '<div class="end"><b class="num">' + eur(lineTotal(l)) + '</b>' +
          '<button class="btn ico sm ghost" data-camd="' + l.id + '" title="' + esc(T("md_add")) + '">' + icon("edit",12) + '</button></div></div>';
      }).join("") + '</div>'
    : empty(T("ca_empty"), "order");

  const html =
    '<div class="card" style="background:var(--amber-soft);border-color:transparent;margin-bottom:14px">' +
      '<div class="card-b" style="padding:11px 14px;display:flex;gap:9px;align-items:flex-start">' +
        '<span style="color:var(--amber);flex:none">' + icon("warn",16) + '</span>' +
        '<div style="font-size:13px;line-height:1.55"><b style="color:var(--amber)">' + esc(T("ca_nofisc")) + '.</b> ' +
        esc("Questa cassa serve solo a prendere l'ordine e a sapere quanto fa. Lo scontrino valido lo batte il registratore telematico: il foglio che stampa da qui e un promemoria interno.") +
        '</div></div></div>' +

    '<div class="grid" style="grid-template-columns:minmax(0,1.5fr) minmax(280px,.8fr);gap:16px;align-items:start">' +
      '<div>' +
        '<div class="seg" style="margin-bottom:10px">' + AREAS.map(a=>
          '<button class="' + (CASSA.area === a.k ? "on":"") + '" data-caa="' + a.k + '">' + esc(T(a.t)) + '</button>').join("") + '</div>' +
        '<div class="tabs" style="margin-bottom:12px">' + cats.map(c=>
          '<button class="' + (CASSA.cat === c.id ? "on":"") + '" data-cac="' + c.id + '">' + esc(L(c.name)) + '</button>').join("") + '</div>' +
        (items.length ? '<div class="cagrid">' + items.map(tile).join("") + '</div>' : empty("Nessun piatto in questa categoria","menu")) +
      '</div>' +

      '<div class="card" style="position:sticky;top:0">' +
        '<div class="card-h" style="padding:11px 14px"><h3>' + esc(T("ca_cart")) + '</h3>' +
          '<div class="sp"><span class="badge">' + sum(CASSA.lines.map(l=>l.qty)) + '</span>' +
          (CASSA.lines.length ? '<button class="btn sm ghost" data-cax>' + esc(T("ca_clear")) + '</button>' : '') + '</div></div>' +
        '<div class="card-b flush" style="max-height:340px;overflow:auto">' + cart + '</div>' +
        '<div class="card-b" style="border-top:1px solid var(--sep)">' +
          '<div class="row" style="justify-content:space-between;font-size:21px;margin-bottom:11px">' +
            '<b>' + esc(T("c_total")) + '</b><b class="num">' + eur(tot) + '</b></div>' +
          '<div class="row tight">' +
            '<button class="btn ok" style="flex:1" data-cap="contanti"' + (tot ? "" : " disabled") + '>' + esc(T("o_cash")) + '</button>' +
            '<button class="btn pri" style="flex:1" data-cap="carta"' + (tot ? "" : " disabled") + '>' + esc(T("o_card")) + '</button>' +
          '</div>' +
          '<button class="btn ghost block mt-s" data-capr' + (tot ? "" : " disabled") + '>' + icon("print",14) + esc(T("c_print")) + '</button>' +
        '</div></div>' +
    '</div>' +

    '<div class="grid g3 mt-l">' +
      stat("Ordini al banco oggi", nToday, fmtDate(today())) +
      stat("Incasso al banco", eur(revToday), "non fiscale") +
      stat("Piatti con foto", DB.items.filter(i=> photoURL(i.photo)).length + "/" + DB.items.length,
        '<button class="btn sm ghost mt-s" data-go="photos">' + esc(T("nav_photos")) + '</button>') +
    '</div>';

  return {
    title:T("nav_cassa"),
    sub:esc(T("ca_nofisc")) + ' &middot; ' + esc(T(AREAS.find(a=>a.k===CASSA.area).t)),
    actions:'<button class="btn ghost" data-go="photos">' + icon("menu",15) + esc(T("nav_photos")) + '</button>' +
            '<button class="btn ghost" data-go="orders">' + icon("order",15) + esc(T("nav_orders")) + '</button>',
    html:html,
    after:()=>{
      $$("[data-caa]").forEach(b=> b.onclick = ()=>{ CASSA.area = b.getAttribute("data-caa"); CASSA.cat = null; refresh(); });
      $$("[data-cac]").forEach(b=> b.onclick = ()=>{ CASSA.cat = b.getAttribute("data-cac"); refresh(); });
      $$("[data-cai]").forEach(b=> b.onclick = ()=> cassaAdd(b.getAttribute("data-cai")));
      $$("[data-caq]").forEach(b=> b.onclick = ()=>{
        const l = CASSA.lines.find(x=> x.id === b.getAttribute("data-caq"));
        l.qty += Number(b.getAttribute("data-d"));
        if(l.qty <= 0) CASSA.lines = CASSA.lines.filter(x=> x.id !== l.id);
        refresh();
      });
      $$("[data-camd]").forEach(b=> b.onclick = ()=>{
        const l = CASSA.lines.find(x=> x.id === b.getAttribute("data-camd")); if(!l) return;
        const it = itemById(l.itemId);
        modsSheet(l, L(it ? it.name : ""), (res)=>{ if(res){ l.mods = res.mods; l.note = res.note; } refresh(); });
      });
      const x = $("[data-cax]"); if(x) x.onclick = ()=>{ CASSA.lines = []; refresh(); };
      $$("[data-cap]").forEach(b=> b.onclick = ()=> cassaClose(b.getAttribute("data-cap")));
      $("[data-capr]").onclick = ()=> printBill(cassaDraft());
    }
  };
};

function cassaDraft(){
  return {id:"cassa", tableId:null, type:"banco", covers:0, waiter:"", status:"aperto",
    opened:new Date().toISOString(), closed:null, date:today(),
    lines:CASSA.lines, pay:null, disc:0, total:cassaTotal(), note:""};
}
function cassaClose(pay){
  if(!CASSA.lines.length) return;
  const o = cassaDraft();
  o.id = uid("or"); o.status = "chiuso"; o.pay = pay; o.closed = new Date().toISOString();
  o.lines = CASSA.lines.map(l=> Object.assign({}, l));
  o.total = cassaTotal();
  o.lines.forEach(l=>{ const it = itemById(l.itemId); if(it) it.sold = (it.sold||0) + l.qty; });
  DB.orders.push(o);
  CASSA.lines = [];
  save(); refresh();
  toast(T("o_pay") + " " + eur(o.total), "ok");
}
</script>
<script>
/* ============================================================
   PARTE 28b — FOTO DEI PIATTI, REPARTO PER REPARTO
   Qui si carica tutto: colazione, gastronomia, ristorante e bar.
   Una griglia sola, cosi si vede al volo cosa manca ancora.
   ============================================================ */
let PHAREA = "colazione", PHONLY = false;

VIEWS.photos = function(){
  const cats = DB.cats.filter(c=> c.area === PHAREA).sort((a,b)=> a.order - b.order);
  const areaItems = (k)=> DB.items.filter(i=> { const c = catById(i.cat); return c && c.area === k; });
  const mine = areaItems(PHAREA);
  const shown = PHONLY ? mine.filter(i=> !photoURL(i.photo)) : mine;

  const card2 = (i)=>{
    const u = photoURL(i.photo);
    return '<button class="phcard' + (u ? " has" : "") + '" data-phi="' + i.id + '">' +
      '<span class="im"' + (u ? ' style="background-image:url(' + u + ')"' : '') + '>' +
        (u ? '' : icon("menu", 22)) + '</span>' +
      '<span class="nm">' + esc(L(i.name)) + '</span>' +
      '<span class="pr">' + eur(i.price) + (i.special ? ' &middot; ' + esc(T("m_special")) : '') + '</span>' +
    '</button>';
  };

  const html =
    '<div class="row" style="margin-bottom:14px">' +
      '<div class="seg">' + AREAS.map(a=>{
        const tot = areaItems(a.k).length, ok = areaItems(a.k).filter(i=> photoURL(i.photo)).length;
        return '<button class="' + (PHAREA === a.k ? "on":"") + '" data-pha="' + a.k + '">' +
          esc(T(a.t)) + ' <span style="opacity:.6">' + ok + '/' + tot + '</span></button>';
      }).join("") + '</div>' +
      '<div class="spacer"></div>' +
      '<label class="check" style="padding:0"><input type="checkbox" id="ph-only"' + (PHONLY ? " checked":"") + '>' +
      '<span>' + esc(T("ph_missing")) + '</span></label>' +
    '</div>' +

    '<div class="grid g3" style="margin-bottom:16px">' +
      stat(T("ph_done"), mine.filter(i=> photoURL(i.photo)).length + "/" + mine.length,
        esc(T(AREAS.find(a=>a.k===PHAREA).t))) +
      stat(T("ph_missing"), mine.filter(i=> !photoURL(i.photo)).length, "da fotografare") +
      stat("In tutto il locale", DB.items.filter(i=> photoURL(i.photo)).length + "/" + DB.items.length, "piatti con foto") +
    '</div>' +

    (shown.length
      ? cats.map(c=>{
          const its = shown.filter(i=> i.cat === c.id);
          if(!its.length) return "";
          return '<div class="course" style="margin:14px 0 9px;background:none;padding:0">' + esc(L(c.name)) + '</div>' +

  };
};

function photoActions(itemId){
  const i = itemById(itemId);
  modal({title:L(i.name), size:"slim",
    body:'<div style="width:100%;aspect-ratio:4/3;border-radius:var(--r-m);background:url(' + photoURL(i.photo) + ') center/cover;box-shadow:inset 0 0 0 1px var(--sep)"></div>',

function flyerSheet(id, tpl){
  const f = id ? byId(DB.flyers, id) : (tpl || {kicker:ml(""), title:ml(""), body:ml(""), cta:ml(""), style:"", price:"", period:""});

      price:g.price||"", period:g.period||"", style:g.style||"", photo:getPhoto()};

    {label:"Anteprima", cls:"ghost", run:(w)=>{ $("#fly-prev", w).innerHTML = flyerCard(collect(w), lk); return false; }},
    {label:T("c_save"), cls:"pri", run:(w)=>{

    onOpen:(w)=>{ getPhoto = wirePhoto(w); }});
}

function printFlyer(f, lk){
  if(!f) return;
  const w = window.open("", "_blank", "width=760,height=1020");
  if(!w){ toast("Consenti le finestre popup per stampare","err"); return; }
  const css = Array.from(document.styleSheets).map(ss=>{
    try{ return Array.from(ss.cssRules).map(r=> r.cssText).join("\n"); }catch(e){ return ""; }
  }).join("\n");
  w.document.write('<!doctype html><meta charset="utf-8"><title>' + esc(L(f.title)) + '</title>' +
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Playfair+Display:wght@700;800&family=Noto+Sans+Arabic:wght@400;700&display=swap">' +

    '.flyer .fc{font-size:16px}@page{size:A4;margin:0}</style>' +
    flyerCard(f, lk));
  w.document.close(); setTimeout(()=> w.print(), 600);
}

  const cfg = DB.led;

    '<div class="grid g3">' +
      stat("Schermate attive", on.length + "/" + cfg.slides.length, "in rotazione") +
      stat("Durata giro", num(on.length * cfg.perSlide, 0) + " s", cfg.perSlide + " s per schermata") +

    '</div>' +
    '<div class="grid g2 mt">' +
      card(T("mk_playlist"),
        '<div class="list">' + cfg.slides.map((s,i)=>
          '<div class="li" style="padding-inline:0">' +
          '<label class="check" style="padding:0"><input type="checkbox" data-ls="' + s.id + '"' + (s.on ? " checked":"") + '></label>' +

          '<div class="tx"><b>' + esc(LED_TYPES[s.type] ? LED_TYPES[s.type].t : s.type) + '</b>' +

          [["brand","Colore del locale"],["dark","Scuro"],["light","Chiaro"]].map(m=>
            '<button type="button" style="flex:1" class="' + (cfg.mood === m[0] ? "on":"") + '" data-lm="' + m[0] + '">' + esc(m[1]) + '</button>').join("") + '</div></div>' +
        '<label class="check"><input type="checkbox" id="ld-cyc"' + (cfg.cycleLangs ? " checked":"") + '>' +
          '<span>' + esc("Ruota le lingue a ogni schermata") + '</span></label>' +
        '<label class="check"><input type="checkbox" id="ld-onlyph"' + (cfg.onlyPhotos ? " checked":"") + '>' +
          '<span>' + esc(T("led_allph")) + '<br><small style="color:var(--txt-3)">' +

        '<button class="btn pri block mt" data-lgo>' + icon("play",15) + esc(T("mk_led_play")) + '</button>' +

function ledPreviewText(s){
  if(s.type === "wall"){
    const n = DB.items.filter(i=> photoURL(i.photo) && (!s.area || (catById(i.cat)||{}).area === s.area)).length;
    return (s.area ? T(AREAS.find(a=>a.k===s.area).t) + " - " : "") + plur(n, "foto pronta", "foto pronte");
  }
  if(s.type === "area"){
    const a = AREAS.find(x=> x.k === s.area) || AREAS[0];
    return T(a.t) + " - " + inArea(a.k).filter(i=> i.available).length + " voci";
  }
  if(s.type === "slogan"){ const sl = todaySlogan(); return sl ? L(sl.text) : "-"; }
  if(s.type === "special") return specials().map(i=> L(i.name)).join(", ") || "-";
  if(s.type === "cocktail") return DB.cocktails.map(c=>{ const i = itemById(c.itemId); return i ? L(i.name) : ""; }).filter(Boolean).join(", ");
  if(s.type === "aperitivo") return DB.meta.biz.aperitivo;
  if(s.type === "welcome") return DB.meta.biz.name;
  if(s.type === "clock") return nowHM();
  return "";
}

<script>
/* --- riproduzione a tutto schermo --- */
function inArea(k){ return DB.items.filter(i=>{ const c = catById(i.cat); return c && c.area === k; }); }
/** Vero se questa schermata ha davvero una foto da mostrare. */
function slideHasPhoto(s){
  const any = (arr)=> arr.some(i=> i && photoURL(i.photo));
  if(s.type === "wall")     return any(DB.items.filter(i=> !s.area || (catById(i.cat)||{}).area === s.area));
  if(s.type === "special")  return any(specials());
  if(s.type === "slogan"){ const sl = todaySlogan() || DB.slogans[0]; return !!(sl && photoURL(sl.photo)) || any(specials()); }
  if(s.type === "cocktail") return any(DB.cocktails.map(c=> itemById(c.itemId)));
  if(s.type === "welcome" || s.type === "aperitivo") return any(DB.items);
  if(s.type === "area")     return any(inArea(s.area));
  if(s.type === "menu")     return any(DB.items.filter(i=> i.cat === s.catId));
  if(s.type === "text")     return !!photoURL(s.photo);
  return false;
}
function ledSlides(){
  let a = DB.led.slides.filter(s=> s.on);
  if(DB.led.onlyPhotos){
    const b = a.filter(slideHasPhoto);
    if(b.length) a = b;      /* se non c'e ancora nessuna foto lo schermo non resta vuoto */
  }
  return a;
}

function ledContent(s, lk){
  const prev = LANG; LANG = lk;
  const b = DB.meta.biz;
  let out = "", bg = null;
  const K = (t)=> '<div class="led-k">' + esc(t) + '</div>';
  const H = (t)=> '<div class="led-t">' + esc(t) + '</div>';
  const S = (t)=> t ? '<div class="led-s">' + esc(t) + '</div>' : "";
  const pick = (a)=> a.length ? a[Math.floor(Math.random()*a.length)] : null;
  const withPhoto = (a)=> a.filter(x=> photoURL(x.photo));

  if(s.type === "welcome"){
    out = K(L(b.tagline)) + H(b.name) + S(b.openLunch + "  /  " + b.openDinner);
    bg = (pick(withPhoto(DB.items.filter(i=> i.available))) || {}).photo || null;
  }else if(s.type === "slogan"){
    const sl = todaySlogan() || DB.slogans[0];
    /* la foto dello slogan, se c'e; altrimenti un piatto del giorno fotografato */
    bg = (sl && photoURL(sl.photo)) ? sl.photo : (pick(withPhoto(specials())) || {}).photo || null;
    out = K(T("nav_slogan")) + H(sl ? L(sl.text) : b.name);
  }else if(s.type === "special"){
    const sp = specials();
    const hero = pick(withPhoto(sp));
    if(hero){
      /* a ogni giro tocca a un piatto diverso, cosi lo schermo non si ripete */
      out = '<div class="led-hero"><span class="ph" style="background-image:url(' + photoURL(hero.photo) + ')"></span>' +
        '<div class="tx">' + K(T("m_special")) + H(L(hero.name)) + S(L(hero.desc)) +
        '<div class="led-p">' + eur(hero.price) + '</div></div></div>';
    }else{
      out = K(T("br_specials")) + (sp.length
        ? '<ul class="led-list">' + sp.map(i=> '<li><b>' + esc(L(i.name)) + '</b><i></i><span>' + eur(i.price) + '</span></li>').join("") + '</ul>'
        : H(L(b.tagline)));
    }
  }else if(s.type === "cocktail"){
    const cks = DB.cocktails.filter(c=> itemById(c.itemId));
    const c = pick(cks);
    const i = c ? itemById(c.itemId) : null;
    if(i && photoURL(i.photo)){
      out = '<div class="led-hero"><span class="ph" style="background-image:url(' + photoURL(i.photo) + ')"></span>' +
        '<div class="tx">' + K(T("nav_cocktail")) + H(L(i.name)) + S(c.build.join("  -  ")) +
        '<div class="led-p">' + eur(i.price) + '</div></div></div>';
    }else{
      out = K(T("nav_cocktail")) + (i ? H(L(i.name)) + S(c.build.join("  -  ")) + '<div class="led-p">' + eur(i.price) + '</div>' : H(b.name));
    }
  }else if(s.type === "aperitivo"){
    out = K(T("b_apero")) + H(b.aperitivo) + S({it:"Tutti i giorni al banco e in terrazza", en:"Every day at the bar and on the terrace",
      fr:"Tous les jours au comptoir et en terrasse", es:"Todos los dias en la barra y la terraza",
      de:"Jeden Tag an der Bar und auf der Terrasse", ar:"كل يوم عند البار وعلى التراس"}[lk]);
    const cks = DB.cocktails.map(c=> itemById(c.itemId)).filter(Boolean);
    bg = (pick(withPhoto(cks)) || {}).photo || null;
  }else if(s.type === "menu"){
    const cat = catById(s.catId) || DB.cats[1];
    const items = DB.items.filter(i=> i.cat === cat.id && i.available).slice(0,6);
    out = K(L(cat.name)) + '<ul class="led-list">' + items.map(i=>
      '<li>' + (photoURL(i.photo) ? '<span class="ph" style="background-image:url(' + photoURL(i.photo) + ')"></span>' : '') +
      '<b>' + esc(L(i.name)) + '</b><i></i><span>' + eur(i.price) + '</span></li>').join("") + '</ul>';
  }else if(s.type === "wall"){
    const pool = DB.items.filter(i=> i.available && photoURL(i.photo) && (!s.area || (catById(i.cat)||{}).area === s.area));
    /* si prendono 8, 6, 4, 3, 2 o 1 foto: numeri che riempiono la griglia
       senza lasciare buchi in fondo */
    const GRID = {8:[4,2], 6:[3,2], 4:[2,2], 3:[3,1], 2:[2,1], 1:[1,1]};
    const n = [8,6,4,3,2,1].find(k=> k <= pool.length) || 0;
    const shuffled = pool.slice().sort(()=> Math.random() - 0.5).slice(0, n);
    const [cols, rows] = GRID[n] || [1,1];
    out = '<div class="led-wall" style="grid-template-columns:repeat(' + cols + ',1fr);grid-template-rows:repeat(' + rows + ',1fr)">' +
      shuffled.map(i=> '<span class="w" style="background-image:url(' + photoURL(i.photo) + ')">' +
        '<em><b>' + esc(L(i.name)) + '</b><i>' + eur(i.price) + '</i></em></span>').join("") + '</div>';
  }else if(s.type === "area"){
    const a = AREAS.find(x=> x.k === s.area) || AREAS[0];
    const its = inArea(a.k).filter(i=> i.available).slice(0, 6);
    out = K(T(a.t)) + '<ul class="led-list">' + its.map(i=>
      '<li>' + (photoURL(i.photo) ? '<span class="ph" style="background-image:url(' + photoURL(i.photo) + ')"></span>' : '') +
      '<b>' + esc(L(i.name)) + '</b><i></i><span>' + eur(i.price) + '</span></li>').join("") + '</ul>';
    const conFoto = inArea(a.k).filter(i=> photoURL(i.photo));
    bg = conFoto.length ? conFoto[Math.floor(Math.random()*conFoto.length)].photo : null;
  }else if(s.type === "clock"){
    out = K(fmtDate(today(),{weekday:"long",day:"numeric",month:"long"})) + '<div class="led-clock">' + nowHM() + '</div>';
  }else{
    out = H(L(s.title)) + S(L(s.sub));
    bg = s.photo || null;
  }
  LANG = prev;
  return {html:out, bg:bg};
}
function drawLed(){
  const root = $("#led-root .led"); if(!root) return;
  const slides = ledSlides();
  if(!slides.length){ stopLed(); toast("Nessuna schermata attiva","warn"); return; }
  LEDIX = LEDIX % slides.length;
  const s = slides[LEDIX];
  const langs = (DB.led.cycleLangs ? (DB.led.langs && DB.led.langs.length ? DB.led.langs : LKEYS) : [LANG]);
  const lk = langs[LEDLANGIX % langs.length];
  const inner = $(".led-in", root);
  const c = ledContent(s, lk);
  inner.dir = LANGS[lk].dir;
  inner.className = "led-in fadein" + (s.type === "wall" ? " wide" : "");
  inner.innerHTML = c.html;
  const u = photoURL(c.bg);
  const img = $(".led-img", root), scrim = $(".led-scrim", root);
  if(img){ img.style.backgroundImage = u ? 'url(' + u + ')' : "none"; img.hidden = !u; }
  if(scrim) scrim.hidden = !u;
  void inner.offsetWidth;
  $(".led-foot", root).textContent = DB.meta.biz.name + "  -  " + DB.meta.biz.phone;
  const barEl = $(".led-bar", root);
  barEl.style.transition = "none"; barEl.style.width = "0%";
  requestAnimationFrame(()=>{
    barEl.style.transition = "width " + DB.led.perSlide + "s linear";
    barEl.style.width = "100%";
  });
}
function startLed(){
  if(LEDON) return;
  const root = document.createElement("div");
  root.className = "led";
  root.setAttribute("data-mood", DB.led.mood || "brand");
  root.innerHTML = '<div class="led-bg"></div><div class="led-img" hidden></div><div class="led-scrim" hidden></div>' +
    '<button class="led-x" title="' + esc(T("c_close")) + '">' + icon("x",18) + '</button>' +
    '<div class="led-in"></div><div class="led-foot"></div><div class="led-bar"></div>';
  $("#led-root").appendChild(root);
  $(".led-x", root).onclick = stopLed;
  root.onclick = (e)=>{ if(e.target.closest(".led-x")) return; LEDIX++; LEDLANGIX++; drawLed(); };
  LEDON = true; LEDIX = 0; LEDLANGIX = 0;
  drawLed();
  LEDTIMER = setInterval(()=>{ LEDIX++; LEDLANGIX++; drawLed(); }, (DB.led.perSlide || 9) * 1000);
  LEDTICK = setInterval(()=>{
    const s = ledSlides()[LEDIX % Math.max(1, ledSlides().length)];
    if(s && s.type === "clock") drawLed();
  }, 30000);
  if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
}
function stopLed(){
  clearInterval(LEDTIMER); clearInterval(LEDTICK);
  LEDON = false;
  const r = $("#led-root .led"); if(r) r.remove();
  if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{});
}
</script>
<script>
/* ============================================================
   PARTE 31 — REPORT
   ============================================================ */
let RANGE = 7;
VIEWS.report = function(){
  const d = today();
  const days = Array.from({length:RANGE}, (_,i)=> addDays(d, -(RANGE-1)+i));
  const orders = days.flatMap(closedOn);
  const rev = sum(orders.map(o=> o.total != null ? o.total : orderTotal(o)));
  const cov = sum(orders.map(o=> Number(o.covers)||0));
  const avg = orders.length ? rev / orders.length : 0;
  const perCover = cov ? rev / cov : 0;
  const maxRev = Math.max(1, ...days.map(revenueOn));

  /* per categoria e classifica piatti */
  const catTot = {}, itemTot = {};
  orders.forEach(o=> o.lines.forEach(l=>{
    const it = itemById(l.itemId); if(!it) return;
    catTot[it.cat] = (catTot[it.cat]||0) + lineTotal(l);
    itemTot[it.id] = itemTot[it.id] || {q:0, v:0};
    itemTot[it.id].q += l.qty; itemTot[it.id].v += lineTotal(l);
  }));
  const catArr = Object.keys(catTot).map(k=> ({id:k, v:catTot[k]})).sort((a,b)=> b.v - a.v);
  const topArr = Object.keys(itemTot).map(k=> ({id:k, q:itemTot[k].q, v:itemTot[k].v})).sort((a,b)=> b.v - a.v).slice(0,12);
  const cash = orders.filter(o=> o.pay === "contanti").length, card2 = orders.filter(o=> o.pay === "carta").length;

  /* costi */
  const weeks = Math.max(1, RANGE / 7);
  const labour = weekLabourCost(weekStart(d)) * weeks;
  const foodC = sum(orders.flatMap(o=> o.lines.map(l=>{ const it = itemById(l.itemId); return it ? itemCost(it) * l.qty : 0; })));

  const html =
    '<div class="row" style="margin-bottom:14px"><div class="seg">' +
      [1,7,14,30].map(r=> '<button class="' + (RANGE===r?"on":"") + '" data-rg="' + r + '">' +
        (r === 1 ? esc(T("c_today")) : r + " " + esc("giorni")) + '</button>').join("") + '</div></div>' +
    '<div class="grid g4">' +
      stat(T("r_revenue"), eur(rev), orders.length + " conti", "acc") +
      stat(T("c_covers"), cov, eur(perCover) + " " + esc("per coperto")) +
      stat(T("r_avg"), eur(avg), "per conto") +
      stat(T("m_foodcost"), pct(rev ? (foodC/rev)*100 : 0), eur(foodC)) +
    '</div>' +
    '<div class="grid g4 mt">' +
      stat(T("p_labcost"), eur(labour), pct(rev ? (labour/rev)*100 : 0) + " " + esc("sull'incasso")) +
      stat("Margine lordo", eur(rev - foodC - labour), pct(rev ? ((rev-foodC-labour)/rev)*100 : 0)) +
      stat(T("o_cash") + " / " + T("o_card"), cash + " / " + card2, pct(orders.length ? (card2/orders.length)*100 : 0) + " " + esc("carta")) +
      stat(T("s_value"), eur(stockValue()), DB.inv.length + " articoli") +
    '</div>' +

    card("Andamento", '<div style="display:flex;align-items:stretch;gap:5px;height:170px">' +
      days.map(w=>{ const v = revenueOn(w); const h = clamp((v/maxRev)*100, 2, 88);
        return '<div style="flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;min-width:0">' +
          '<div style="font-size:10px;color:var(--txt-2);font-weight:600" class="num">' + (v ? Math.round(v) : "") + '</div>' +
          '<div style="width:100%;flex:none;height:' + h + '%;border-radius:5px 5px 0 0;background:' + (w===d?'var(--brand)':'var(--fill-2)') + '"></div>' +
          '<div style="font-size:9.5px;color:var(--txt-3);white-space:nowrap">' + esc(fmtDate(w,{day:"2-digit",month:"2-digit"})) + '</div></div>';
      }).join("") + '</div>', '', "mt") +

    '<div class="grid g2 mt">' +
      card(T("r_bycat"), catArr.length ? catArr.map(c=>{
        const cat = catById(c.id);
        return '<div style="margin-bottom:11px"><div class="row" style="justify-content:space-between;font-size:13px;margin-bottom:4px">' +
          '<b>' + esc(cat ? L(cat.name) : "?") + '</b><span class="num">' + eur(c.v) + ' &middot; ' + pct(rev ? (c.v/rev)*100 : 0) + '</span></div>' +
          bar(c.v, catArr[0].v) + '</div>';
      }).join("") : empty("Nessun dato","chart")) +
      card(T("r_top"), topArr.length ? '<div class="list">' + topArr.map((t,i)=>{
        const it = itemById(t.id);
        return '<div class="li" style="padding-inline:0"><span class="avat sm">' + (i+1) + '</span>' +
          '<div class="tx"><b>' + esc(it ? L(it.name) : "?") + '</b><span>' + t.q + ' ' + esc("venduti") + '</span></div>' +
          '<div class="end"><b class="num">' + eur(t.v) + '</b></div></div>';
      }).join("") + '</div>' : empty("Nessun dato","chart"), '', "flush") +
    '</div>';

  return {
    title:T("nav_report"), sub:fmtDate(days[0],{day:"numeric",month:"short"}) + " - " + fmtDate(d,{day:"numeric",month:"short",year:"numeric"}),
    actions:'<button class="btn ghost" data-rcsv>' + icon("down",15) + 'CSV</button>' +
            '<button class="btn ghost" onclick="window.print()">' + icon("print",15) + esc(T("c_print")) + '</button>',
    html:html,
    after:()=>{
      $$("[data-rg]").forEach(b=> b.onclick = ()=>{ RANGE = Number(b.getAttribute("data-rg")); refresh(); });
      $("[data-rcsv]").onclick = ()=>{
        const rows = [["data","conti","coperti","incasso"]].concat(days.map(w=>
          [w, closedOn(w).length, coversOn(w), revenueOn(w).toFixed(2)]));
        rows.push([]); rows.push(["piatto","quantita","valore"]);
        topArr.forEach(t=>{ const it = itemById(t.id); rows.push([it ? L(it.name) : "?", t.q, t.v.toFixed(2)]); });
        downloadCSV(rows, "report_" + d + ".csv");
      };
    }
  };
};

/* Quando la pagina gira dentro un visualizzatore, i link di download sono inerti:
   il file va consegnato all'ospite tramite la capability "downloads". Fuori da li
   (file locale, Vercel, telefono) resta il link normale di sempre. */
let DL = null;
if(window.claude && typeof window.claude.use === "function"){
  window.claude.use("downloads").then(d=>{ DL = d; }).catch(()=>{});
}
function linkSave(filename, data, mime){
  const blob = new Blob([data], {type:mime || "application/octet-stream"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 400);
}
async function saveFile(filename, data, mime, okMsg){
  if(!DL){ linkSave(filename, data, mime); toast(okMsg, "ok"); return; }
  let name = filename;
  for(let tries = 0; tries < 2; tries++){
    try{ await DL.save({filename:name, data:data}); toast(okMsg, "ok"); return; }
    catch(e){
      const code = e && e.code;
      /* il csv non e sempre ammesso: si ripiega sul testo, che Excel apre lo stesso */
      if(code === "extension_not_enabled" && /\.csv$/i.test(name)){ name = name.replace(/\.csv$/i, ".txt"); continue; }
      if(code === "declined") return;
      toast(code === "too_large" ? "File troppo grande per il salvataggio"
          : code === "rate_limited" ? "Aspetta un attimo e riprova"
          : "Salvataggio non riuscito", code === "rate_limited" ? "warn" : "err");
      return;
    }
  }
}
function downloadCSV(rows, name){
  const csv = rows.map(r=> r.map(c=> '"' + String(c==null?"":c).replace(/"/g,'""') + '"').join(";")).join("\n");
  saveFile(name, "﻿" + csv, "text/csv;charset=utf-8", T("c_export"));
}
</script>

      '<div>' +
        card(T("c_language"),
          '<div class="grid g2" style="gap:8px">' + LKEYS.map(lk=>
            '<button class="btn ' + (LANG === lk ? "pri" : "ghost") + '" data-stlang="' + lk + '" style="justify-content:flex-start;gap:9px">' +
            flag(lk,14) + '<span>' + esc(LANGS[lk].native) + '</span></button>').join("") + '</div>' +
          '<p style="font-size:12.5px;color:var(--txt-3);margin-top:10px">' +
          esc("Cambia la lingua di tutto il sistema. I piatti e gli slogan hanno la loro traduzione: quello che non è tradotto resta in italiano.") + '</p>') +

        card(T("st_skin"),
          '<div class="grid g3" style="gap:8px">' + SKINS.map(s=>
            '<button class="btn ' + (DB.meta.skin === s.k ? "pri" : "ghost") + '" data-stskin="' + s.k + '" style="flex-direction:column;gap:6px;padding:11px 6px;height:auto">' +
            '<span style="width:26px;height:26px;border-radius:50%;background:' + s.c + ';display:block;box-shadow:0 0 0 2px var(--bg-2) inset"></span>' +
            '<span style="font-size:11.5px">' + esc(s.n) + '</span></button>').join("") + '</div>' +
          '<div class="lbl mt">' + esc(T("st_theme")) + '</div>' +
          '<div class="seg" style="display:flex">' + [["auto","st_auto"],["light","st_light"],["dark","st_dark"]].map(t=>
            '<button style="flex:1" class="' + (DB.meta.theme === t[0] ? "on":"") + '" data-sttheme="' + t[0] + '">' + esc(T(t[1])) + '</button>').join("") + '</div>', '', "mt") +

        card(T("st_backup"),
          '<p style="font-size:13px;color:var(--txt-2);line-height:1.6;margin-bottom:12px">' +
            esc("I dati stanno solo su questo dispositivo, dentro il browser. Esporta un backup ogni settimana e tienilo da parte: se cambi computer o pulisci il browser, senza backup i dati non tornano più.") + '</p>' +
          '<div class="row">' +
            '<button class="btn ghost" data-stexp>' + icon("down",15) + esc(T("c_export")) + '</button>' +
            '<button class="btn ghost" data-stimp>' + icon("up",15) + esc(T("st_restore")) + '</button>' +
          '</div>' +
          '<div class="row mt-l"><button class="btn dang" data-streset>' + icon("trash",15) + esc(T("st_reset")) + '</button></div>' +
          '<p style="font-size:12px;color:var(--txt-3);margin-top:8px">' + esc("Sostituisce tutto con i dati dimostrativi. Fai prima un backup.") + '</p>', '', "mt") +
      '</div>' +
    '</div>';

  return {
    title:T("nav_set"), sub:b.name,
    actions:'', html:html,
    after:()=>{
      $("[data-stsave]").onclick = ()=>{
        const root = $("#view"), f = readForm(root);
        Object.assign(b, {name:f.name, addr:f.addr, city:f.city, phone:f.phone, email:f.email,
          cover:Number(f.cover)||0, service:Number(f.service)||0, vat:f.vat,
          openLunch:f.openLunch, openDinner:f.openDinner, aperitivo:f.aperitivo,
          closedDay:f.closedDay, wifi:f.wifi, tagline:readML(root,"tagline")});
        save(); refresh(); toast(T("c_save"),"ok");
      };
      $$("[data-stlang]").forEach(x=> x.onclick = ()=>{
        DB.meta.lang = x.getAttribute("data-stlang");
        applyLang(DB.meta.lang); save(); refresh();
      });
      $$("[data-stskin]").forEach(x=> x.onclick = ()=>{
        DB.meta.skin = x.getAttribute("data-stskin"); applyTheme(); save(); refresh();
      });
      $$("[data-sttheme]").forEach(x=> x.onclick = ()=>{
        DB.meta.theme = x.getAttribute("data-sttheme"); applyTheme(); save(); refresh();
      });
      $("[data-stexp]").onclick = ()=> saveFile(
        "backup_ristorante_" + today() + ".json",
        JSON.stringify(Object.assign({}, DB, {_foto:PHOTOS}), null, 1),
        "application/json", T("st_backup"));
      $("[data-stimp]").onclick = ()=>{
        const inp = document.createElement("input");
        inp.type = "file"; inp.accept = "application/json,.json";
        inp.style.cssText = "position:fixed;left:-9999px;width:1px;height:1px;opacity:0";
        document.body.appendChild(inp);
        inp.onchange = ()=>{
          const file = inp.files[0];
          inp.remove();
          if(!file) return;
          const rd = new FileReader();
          rd.onload = ()=>{
            try{
              const d = JSON.parse(rd.result);
              if(!d || !d.meta || !d.tables) throw new Error("formato");
              const foto = d._foto || {}; delete d._foto;
              DB = normalize(d); save();
              PHOTOS = {};
              const ids = Object.keys(foto);
              Promise.all(ids.map(k=> phPut(k, foto[k]).catch(()=>{}))).then(()=>{
                applyLang(DB.meta.lang); applyTheme(); go("dash");
                toast(T("st_restore") + (ids.length ? " (" + ids.length + " foto)" : ""), "ok");
              });
            }catch(e){ toast("File di backup non valido", "err"); }
          };
          rd.readAsText(file);
        };
        inp.click();
      };
      $("[data-streset]").onclick = ()=> confirmBox(
        "Sostituire tutti i dati con quelli dimostrativi? Il lavoro non salvato in un backup andrà perso.",
        ()=>{ resetDemo(); applyLang(DB.meta.lang); applyTheme(); go("dash"); toast(T("st_reset"), "ok"); }, true);
    }
  };
};
</script>
<script>
/* ============================================================
   PARTE 33 — AVVIO
   ============================================================ */
/** Riempie i campi mancanti: serve dopo un ripristino da un backup vecchio. */
function normalize(d){
  const s = buildSeed();
  d.meta = Object.assign({}, s.meta, d.meta || {});
  d.meta.biz = Object.assign({}, s.meta.biz, d.meta.biz || {});
  ["rooms","tables","cats","items","orders","reservations","inv","moves","suppliers","staff",
   "shifts","clock","briefings","issues","hotels","hotelOrders","slogans","flyers","cocktails",
   "haccp","haccpLog","prep","recipes","cashups","pos","mods","changes"].forEach(k=>{
    if(!Array.isArray(d[k])) d[k] = s[k] || [];
  });
  d.checklists = d.checklists || {};
  d.led = Object.assign({}, s.led, d.led || {});
  if(!Array.isArray(d.led.slides) || !d.led.slides.length) d.led.slides = s.led.slides;
  if(!Array.isArray(d.led.langs) || !d.led.langs.length) d.led.langs = LKEYS.slice();
  if(typeof d.led.cycleLangs !== "boolean") d.led.cycleLangs = true;
  if(typeof d.led.onlyPhotos !== "boolean") d.led.onlyPhotos = false;
  s.led.slides.forEach(sl=>{ if(!d.led.slides.some(x=> x.id === sl.id)) d.led.slides.push(sl); });
  d.led.perSlide = clamp(Number(d.led.perSlide) || 9, 3, 60);
  d.tables.forEach(t=>{ if(typeof t.setupDone !== "boolean") t.setupDone = false; });
  d.items.forEach(i=>{ if(!Array.isArray(i.allerg)) i.allerg = []; if(typeof i.available !== "boolean") i.available = true; });

  /* ogni categoria appartiene a un reparto: colazione, gastronomia, ristorante o bar */
  d.cats.forEach(c=>{ if(!c.area) c.area = AREA_OF_CAT[c.id] || (c.kind === "bar" ? "bar" : "ristorante"); });

  /* chi aveva gia i dati salvati prima del banco gastronomia se lo ritrova, senza
     perdere quello che aveva gia messo dentro */
  /* codice e livello: chi non ce l'ha se lo ritrova assegnato */
  d.staff.forEach(st=>{
    if(!st.pin) st.pin = SEED_PINS[st.id] || String(1000 + Math.floor(Math.random()*8999));
    if(!st.level) st.level = MANAGER_ROLES.includes(st.role) ? "responsabile" : "operatore";
  });
  if(!d.mods.length) d.mods = s.mods;
  else s.mods.forEach(m=>{ if(!d.mods.some(x=> x.id === m.id)) d.mods.push(m); });

  if((Number(d.meta.version) || 1) < 2){
    s.cats.forEach(c=>{ if(!d.cats.some(x=> x.id === c.id)) d.cats.push(c); });
    s.items.forEach(i=>{ if(!d.items.some(x=> x.id === i.id)) d.items.push(i); });
    d.meta.version = 2;
  }
  return d;
}

/* Tema imposto dall'esterno, se la pagina e incorporata da qualche parte. */
const HOST_THEME = document.documentElement.getAttribute("data-theme");
function applyTheme(){
  const r = document.documentElement;
  const th = DB.meta.theme || "auto";
  if(th === "auto"){
    if(HOST_THEME) r.setAttribute("data-theme", HOST_THEME); else r.removeAttribute("data-theme");
  }else r.setAttribute("data-theme", th);
  r.setAttribute("data-skin", DB.meta.skin || "classico");
  const meta = $('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", th === "dark" ? "#12100E" : "#FBF7F2");
}

function boot(){
  DB = normalize(load() || buildSeed());
  save();

  applyLang(DB.meta.lang || "it");
  applyTheme();

  $("#burger").onclick = ()=> document.body.classList.toggle("menu-open");
  document.addEventListener("click", (e)=>{
    if(document.body.classList.contains("menu-open") &&
       !e.target.closest(".side") && !e.target.closest("#burger")) document.body.classList.remove("menu-open");
  });
  $("#btn-led").onclick = startLed;
  $("#btn-user").onclick = ()=>{ if(me()) signOut(); else signIn(); };
  $("#btn-lang").onclick = ()=>{
    modal({title:T("c_language"), size:"slim",
      body:'<div class="grid g2" style="gap:8px">' + LKEYS.map(lk=>
        '<button class="btn ' + (LANG === lk ? "pri":"ghost") + '" data-gl="' + lk + '" style="justify-content:flex-start;gap:9px">' +
        flag(lk,14) + '<span>' + esc(LANGS[lk].native) + '</span></button>').join("") + '</div>',
      actions:[{label:T("c_close"), cls:"ghost"}],
      onOpen:(w)=> $$("[data-gl]", w).forEach(b=> b.onclick = ()=>{
        DB.meta.lang = b.getAttribute("data-gl");
        applyLang(DB.meta.lang); save(); closeModal(); render();
      })});
  };

  /* scorciatoie da tastiera */
  document.addEventListener("keydown", (e)=>{
    if(e.target.matches("input,textarea,select")) return;
    if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); go("tables"); return; }
    if(e.key === "F2"){ e.preventDefault(); go("kds"); return; }
    const map = {"1":"dash","2":"tables","3":"orders","4":"kds","5":"stock","6":"shifts","7":"briefing"};
    if(map[e.key] && !e.metaKey && !e.ctrlKey && !e.altKey) go(map[e.key]);
  });

  /* aggiorna i minuti sui tavoli e in cucina senza ricaricare tutto */
  setInterval(()=>{ if(VIEW === "tables" || VIEW === "dash") refresh(); }, 60000);

  go("dash");

  /* IndexedDB e asincrono: si disegna subito e si ridisegna quando le foto ci sono */
  phLoadAll().then(ph=>{
    PHOTOS = ph;
    if(Object.keys(ph).length && !LEDON) refresh();
  });
}
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
</script>
