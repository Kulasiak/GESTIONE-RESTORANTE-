<!doctype html>
<html lang="it" dir="ltr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Sistema gestionale completo per ristorante, bar e servizio hotel: sala, cucina, magazzino, personale, turni, briefing, marketing e schermo LED.">
<meta name="theme-color" content="#FBF7F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12100E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ristorante — Sistema di Gestione</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- I font arrivano per conto loro: se la connessione manca il gestionale parte lo stesso,
     con i caratteri di sistema, invece di restare fermo ad aspettarli. -->
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* ============================================================
   RISTORANTE — Sistema di gestione completo
   Design system: superfici calde, 6 skin colore, IT/EN/FR/ES/DE/AR
   ============================================================ */

/* ---------- 1. SKIN COLORE (colore/pelle del sistema) ---------- */
:root{
  --brand:#B4451F; --brand-2:#8E3416; --brand-soft:rgba(180,69,31,.12);
  --accent:#1F7A5A; --accent-soft:rgba(31,122,90,.13);
}
:root[data-skin="notte"]{ --brand:#C9A227; --brand-2:#A6851C; --brand-soft:rgba(201,162,39,.16); --accent:#4E8FD4; --accent-soft:rgba(78,143,212,.15); }
:root[data-skin="marino"]{ --brand:#1668A8; --brand-2:#0F4E80; --brand-soft:rgba(22,104,168,.12); --accent:#12897E; --accent-soft:rgba(18,137,126,.13); }
:root[data-skin="bosco"]{ --brand:#2C6E3F; --brand-2:#1F5230; --brand-soft:rgba(44,110,63,.12); --accent:#9A6A1E; --accent-soft:rgba(154,106,30,.14); }
:root[data-skin="vino"]{  --brand:#7D1F3A; --brand-2:#5E1429; --brand-soft:rgba(125,31,58,.12); --accent:#2F6B57; --accent-soft:rgba(47,107,87,.13); }
:root[data-skin="oro"]{   --brand:#A88332; --brand-2:#856623; --brand-soft:rgba(168,131,50,.16); --accent:#5B5B5B; --accent-soft:rgba(91,91,91,.14); }

/* ---------- 2. SUPERFICI CHIARE ---------- */
:root{
  color-scheme: light;
  --bg:#FBF7F2; --bg-2:#FFFFFF; --bg-3:#F4EEE6;
  --bg-side:rgba(251,247,242,.88); --bar:rgba(255,255,255,.82);
  --fill-1:rgba(90,74,60,.07); --fill-2:rgba(90,74,60,.13); --fill-3:rgba(90,74,60,.04);
  --sep:rgba(90,74,60,.16); --sep-2:rgba(90,74,60,.28);
  --txt:#1A1512; --txt-2:rgba(26,21,18,.64); --txt-3:rgba(26,21,18,.40);
  --on-brand:#FFFFFF;
  --green:#1F7A5A; --green-soft:rgba(31,122,90,.13);
  --red:#C0392B;   --red-soft:rgba(192,57,43,.12);
  --amber:#B87309; --amber-soft:rgba(184,115,9,.14);
  --blue:#1668A8;  --blue-soft:rgba(22,104,168,.12);
  --violet:#6B4E9E;--violet-soft:rgba(107,78,158,.13);
  --grey:#8A7F75;  --grey-soft:rgba(138,127,117,.14);
  --sh-1:0 1px 2px rgba(60,45,30,.06), 0 1px 1px rgba(60,45,30,.04);
  --sh-2:0 6px 20px -8px rgba(60,45,30,.18), 0 1px 3px rgba(60,45,30,.07);
  --sh-3:0 28px 70px -22px rgba(40,28,16,.36), 0 3px 10px rgba(40,28,16,.10);
  --r-l:18px; --r-m:13px; --r-s:9px; --r-pill:980px;
  --ease:cubic-bezier(.32,.72,0,1);
  --sans:"Inter",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"Roboto Mono",monospace;
  --side-w:268px;
}
:root[lang="ar"]{ --sans:"Noto Sans Arabic","Inter",system-ui,sans-serif; --serif:"Noto Sans Arabic",Georgia,serif; }

/* ---------- 3. SUPERFICI SCURE ---------- */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#12100E; --bg-2:#1C1917; --bg-3:#26221F;
    --bg-side:rgba(18,16,14,.88); --bar:rgba(28,25,23,.82);
    --fill-1:rgba(235,225,215,.07); --fill-2:rgba(235,225,215,.13); --fill-3:rgba(235,225,215,.04);
    --sep:rgba(235,225,215,.14); --sep-2:rgba(235,225,215,.24);
    --txt:#F7F2EC; --txt-2:rgba(247,242,236,.64); --txt-3:rgba(247,242,236,.38);
    --green:#3FBF8F; --green-soft:rgba(63,191,143,.18);
    --red:#F0685A;   --red-soft:rgba(240,104,90,.18);
    --amber:#E0A33A; --amber-soft:rgba(224,163,58,.18);
    --blue:#5CA8E6;  --blue-soft:rgba(92,168,230,.18);
    --violet:#A98BE0;--violet-soft:rgba(169,139,224,.18);
    --grey:#A79C92;  --grey-soft:rgba(167,156,146,.16);
    --sh-1:0 1px 2px rgba(0,0,0,.36); --sh-2:0 8px 24px -10px rgba(0,0,0,.6), 0 1px 3px rgba(0,0,0,.4);
    --sh-3:0 30px 70px -20px rgba(0,0,0,.8), 0 4px 12px rgba(0,0,0,.5);
    --brand-soft:rgba(255,255,255,.10); --accent-soft:rgba(255,255,255,.08);
  }
  :root:not([data-theme="light"])[data-skin="classico"]{ --brand:#E0703F; --brand-2:#C2542A; }
  :root:not([data-theme="light"])[data-skin="marino"]{ --brand:#4E9FDC; --brand-2:#2C7CB8; --accent:#2FB0A2; }
  :root:not([data-theme="light"])[data-skin="bosco"]{ --brand:#59B072; --brand-2:#3D8B54; --accent:#D2A044; }
  :root:not([data-theme="light"])[data-skin="vino"]{ --brand:#D4536F; --brand-2:#B03A55; --accent:#4FA98A; }
}

/* stesse tinte quando lo scuro e scelto a mano nelle impostazioni */
:root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#12100E; --bg-2:#1C1917; --bg-3:#26221F;
    --bg-side:rgba(18,16,14,.88); --bar:rgba(28,25,23,.82);
    --fill-1:rgba(235,225,215,.07); --fill-2:rgba(235,225,215,.13); --fill-3:rgba(235,225,215,.04);
    --sep:rgba(235,225,215,.14); --sep-2:rgba(235,225,215,.24);
    --txt:#F7F2EC; --txt-2:rgba(247,242,236,.64); --txt-3:rgba(247,242,236,.38);
    --green:#3FBF8F; --green-soft:rgba(63,191,143,.18);
    --red:#F0685A;   --red-soft:rgba(240,104,90,.18);
    --amber:#E0A33A; --amber-soft:rgba(224,163,58,.18);
    --blue:#5CA8E6;  --blue-soft:rgba(92,168,230,.18);
    --violet:#A98BE0;--violet-soft:rgba(169,139,224,.18);
    --grey:#A79C92;  --grey-soft:rgba(167,156,146,.16);
    --sh-1:0 1px 2px rgba(0,0,0,.36); --sh-2:0 8px 24px -10px rgba(0,0,0,.6), 0 1px 3px rgba(0,0,0,.4);
    --sh-3:0 30px 70px -20px rgba(0,0,0,.8), 0 4px 12px rgba(0,0,0,.5);
    --brand-soft:rgba(255,255,255,.10); --accent-soft:rgba(255,255,255,.08);
  }
  :root[data-theme="dark"][data-skin="classico"]{ --brand:#E0703F; --brand-2:#C2542A; }
  :root[data-theme="dark"][data-skin="marino"]{ --brand:#4E9FDC; --brand-2:#2C7CB8; --accent:#2FB0A2; }
  :root[data-theme="dark"][data-skin="bosco"]{ --brand:#59B072; --brand-2:#3D8B54; --accent:#D2A044; }
  :root[data-theme="dark"][data-skin="vino"]{ --brand:#D4536F; --brand-2:#B03A55; --accent:#4FA98A; }
</style>
<style>
/* ---------- 4. RESET E BASE ---------- */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--txt);
  font-family:var(--sans); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overscroll-behavior:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,h4,p,figure{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
table{border-collapse:collapse;width:100%}
a{color:var(--brand);text-decoration:none}
[hidden]{display:none!important}
::selection{background:var(--brand-soft)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ---------- 5. SHELL ---------- */
.app{display:grid;grid-template-columns:var(--side-w) 1fr;height:100dvh;overflow:hidden}
.side{
  background:var(--bg-side); backdrop-filter:saturate(180%) blur(24px);
  border-inline-end:1px solid var(--sep);
  display:flex;flex-direction:column;overflow:hidden;
  padding-top:env(safe-area-inset-top);
}
.brandbar{display:flex;align-items:center;gap:11px;padding:16px 16px 12px}
.logo{
  width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--brand),var(--brand-2));color:#fff;
  font-family:var(--serif);font-size:19px;font-weight:700;box-shadow:var(--sh-1);
}
.brandbar b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.brandbar span{display:block;font-size:11.5px;color:var(--txt-2);line-height:1.3}
.nav{flex:1;overflow-y:auto;padding:2px 10px 18px;scrollbar-width:thin}
.nav::-webkit-scrollbar{width:6px}
.nav::-webkit-scrollbar-thumb{background:var(--fill-2);border-radius:3px}
.navgrp{margin-top:14px;padding:0 8px 5px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--txt-3)}
.navbtn{
  display:flex;align-items:center;gap:10px;width:100%;text-align:start;
  padding:8px 10px;border-radius:var(--r-s);color:var(--txt-2);
  font-size:13.5px;font-weight:500;transition:background .14s,color .14s;
}
.navbtn svg{width:17px;height:17px;flex:none;opacity:.85}
.navbtn:hover{background:var(--fill-1);color:var(--txt)}
.navbtn.on{background:var(--brand);color:var(--on-brand);font-weight:600;box-shadow:var(--sh-1)}
.navbtn.on svg{opacity:1}
.navbtn .pip{
  margin-inline-start:auto;min-width:19px;height:19px;padding:0 5px;border-radius:var(--r-pill);
  background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;
}
.navbtn.on .pip{background:rgba(255,255,255,.28)}
.sidefoot{padding:10px;border-top:1px solid var(--sep);display:flex;gap:7px}

/* ---------- 6. AREA PRINCIPALE ---------- */
.main{display:flex;flex-direction:column;overflow:hidden;min-width:0}
.top{
  display:flex;align-items:center;gap:12px;padding:13px 22px;
  border-bottom:1px solid var(--sep);background:var(--bar);
  backdrop-filter:saturate(180%) blur(24px);
  padding-top:calc(13px + env(safe-area-inset-top));
}
.top h1{font-size:20px;font-weight:700;letter-spacing:-.022em}
.top .sub{font-size:12.5px;color:var(--txt-2);margin-top:1px}
.topact{margin-inline-start:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.view{flex:1;overflow-y:auto;padding:20px 22px 60px;scroll-behavior:smooth}
.wrap{max-width:1320px;margin:0 auto}
.burger{display:none}

/* ---------- 7. COMPONENTI ---------- */
.card{background:var(--bg-2);border:1px solid var(--sep);border-radius:var(--r-l);box-shadow:var(--sh-1)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 17px;border-bottom:1px solid var(--sep)}
.card-h h3{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.card-h .sp{margin-inline-start:auto;display:flex;gap:7px;align-items:center}
.card-b{padding:16px 17px}
.card-b.flush{padding:0}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.gauto-s{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.gauto-l{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.row.tight{gap:6px}
.spacer{flex:1}
.mt{margin-top:14px}.mt-s{margin-top:8px}.mt-l{margin-top:22px}

/* Bottoni */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:8px 14px;border-radius:var(--r-s);background:var(--fill-1);color:var(--txt);
  font-size:13.5px;font-weight:600;white-space:nowrap;
  transition:background .14s,transform .1s,opacity .14s;
}
.btn:hover{background:var(--fill-2)}
.btn:active{transform:scale(.97)}
.btn svg{width:15px;height:15px}
.btn.pri{background:var(--brand);color:var(--on-brand);box-shadow:var(--sh-1)}
.btn.pri:hover{background:var(--brand-2)}
.btn.ok{background:var(--green);color:#fff}
.btn.warn{background:var(--amber);color:#fff}
.btn.dang{background:var(--red-soft);color:var(--red)}
.btn.dang:hover{background:var(--red);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--sep-2)}
.btn.ghost:hover{background:var(--fill-1)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn.sm svg{width:13px;height:13px}
.btn.lg{padding:11px 20px;font-size:15px;border-radius:var(--r-m)}
.btn.ico{padding:8px;width:34px;height:34px}
.btn.ico.sm{width:28px;height:28px;padding:5px}
.btn.block{width:100%}
.btn:disabled{opacity:.42;pointer-events:none}

/* Segmenti / tab */
.seg{display:inline-flex;background:var(--fill-1);border-radius:var(--r-s);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:6px 13px;border-radius:7px;font-size:13px;font-weight:600;color:var(--txt-2);transition:.14s}
.seg button.on{background:var(--bg-2);color:var(--txt);box-shadow:var(--sh-1)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--sep);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:10px 14px;font-size:13.5px;font-weight:600;color:var(--txt-2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}

/* Badge e pill */
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--r-pill);
  font-size:11.5px;font-weight:700;letter-spacing:.01em;background:var(--fill-1);color:var(--txt-2);white-space:nowrap;
}
.badge.g{background:var(--green-soft);color:var(--green)}
.badge.r{background:var(--red-soft);color:var(--red)}
.badge.a{background:var(--amber-soft);color:var(--amber)}
.badge.b{background:var(--blue-soft);color:var(--blue)}
.badge.v{background:var(--violet-soft);color:var(--violet)}
.badge.n{background:var(--grey-soft);color:var(--grey)}
.badge.brand{background:var(--brand-soft);color:var(--brand)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.flg{border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.16);vertical-align:-1px;flex:none;display:inline-block}

/* Form */
.field{display:block;margin-bottom:12px}
.field>label,.lbl{display:block;font-size:12px;font-weight:600;color:var(--txt-2);margin-bottom:5px}
.inp,select.inp,textarea.inp{
  width:100%;padding:9px 11px;border-radius:var(--r-s);border:1px solid var(--sep-2);
  background:var(--bg-2);color:var(--txt);font-size:14px;transition:border-color .14s,box-shadow .14s;
}
.inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.inp{resize:vertical;min-height:74px;line-height:1.55}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--txt-2) 50%),linear-gradient(135deg,var(--txt-2) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-inline-end:30px}
:root[dir="rtl"] select.inp{background-position:15px 50%,20px 50%;padding-inline-end:11px;padding-inline-start:30px}
.inp.sm{padding:6px 9px;font-size:13px}
.check{display:flex;align-items:flex-start;gap:9px;padding:7px 0;cursor:pointer;font-size:13.5px}
.check input{width:18px;height:18px;flex:none;margin-top:1px;accent-color:var(--brand);cursor:pointer}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.search{position:relative;flex:1;min-width:150px}
.search .inp{padding-inline-start:33px}
.search svg{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--txt-3);pointer-events:none}

/* Tabelle */
.tbl{font-size:13.5px}
.tbl th{
  text-align:start;padding:9px 14px;font-size:11px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--txt-3);border-bottom:1px solid var(--sep);
  position:sticky;top:0;background:var(--bg-2);z-index:2;
}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--sep)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--fill-3)}
.tbl .r{text-align:end}
.tbl .c{text-align:center}
.tbl .clik{cursor:pointer}
.scrollx{overflow-x:auto;scrollbar-width:thin}
.scrollx::-webkit-scrollbar{height:7px}
.scrollx::-webkit-scrollbar-thumb{background:var(--fill-2);border-radius:4px}

/* Statistiche */
.stat{background:var(--bg-2);border:1px solid var(--sep);border-radius:var(--r-l);padding:15px 16px;box-shadow:var(--sh-1)}
.stat .k{font-size:11.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--txt-3)}
.stat .v{font-size:26px;font-weight:750;letter-spacing:-.03em;margin-top:5px;line-height:1.1}
.stat .d{font-size:12px;color:var(--txt-2);margin-top:4px}
.stat.acc{background:linear-gradient(155deg,var(--brand),var(--brand-2));border-color:transparent;color:var(--on-brand)}
.stat.acc .k,.stat.acc .d{color:rgba(255,255,255,.78)}

/* Barre e progresso */
.bar{height:7px;border-radius:4px;background:var(--fill-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--brand);transition:width .5s var(--ease)}
.bar>i.g{background:var(--green)}.bar>i.a{background:var(--amber)}.bar>i.r{background:var(--red)}

/* Vuoto */
.empty{padding:44px 20px;text-align:center;color:var(--txt-3)}
.empty svg{width:38px;height:38px;opacity:.4;margin-bottom:10px}
.empty b{display:block;color:var(--txt-2);font-size:14.5px;margin-bottom:4px}
.empty p{font-size:13px;max-width:340px;margin:0 auto}

/* Modale */
.ovl{
  position:fixed;inset:0;background:rgba(20,14,8,.42);backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:18px;z-index:200;animation:fade .18s ease;
}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}}
.modal{
  background:var(--bg-2);border-radius:20px;box-shadow:var(--sh-3);
  width:min(620px,100%);max-height:min(88dvh,880px);display:flex;flex-direction:column;
  animation:pop .24s var(--ease);overflow:hidden;
}
.modal.wide{width:min(980px,100%)}
.modal.xwide{width:min(1240px,100%)}
.modal.slim{width:min(430px,100%)}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 19px;border-bottom:1px solid var(--sep)}
.modal-h h3{font-size:16.5px;font-weight:700;letter-spacing:-.015em}
.modal-h .x{margin-inline-start:auto;width:30px;height:30px;border-radius:50%;background:var(--fill-1);display:grid;place-items:center;color:var(--txt-2)}
.modal-h .x:hover{background:var(--fill-2)}
.modal-b{padding:18px 19px;overflow-y:auto;flex:1}
.modal-f{padding:13px 19px;border-top:1px solid var(--sep);display:flex;gap:9px;justify-content:flex-end;background:var(--fill-3);flex-wrap:wrap}

/* Toast */
.toasts{position:fixed;bottom:20px;inset-inline-end:20px;z-index:400;display:flex;flex-direction:column;gap:9px;align-items:flex-end}
.toast{
  background:var(--txt);color:var(--bg);padding:11px 16px;border-radius:var(--r-m);
  font-size:13.5px;font-weight:600;box-shadow:var(--sh-3);animation:pop .22s var(--ease);
  max-width:340px;display:flex;align-items:center;gap:9px;
}
.toast.ok{background:var(--green);color:#fff}
.toast.err{background:var(--red);color:#fff}
.toast.warn{background:var(--amber);color:#fff}

/* ---------- 8. PIANTINA TAVOLI ---------- */
.floor{
  position:relative;background:var(--bg-3);border:1px solid var(--sep);border-radius:var(--r-l);
  min-height:520px;overflow:auto;
  background-image:radial-gradient(var(--sep) .9px,transparent .9px);background-size:26px 26px;
}
.tb{
  position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:var(--r-m);border:2px solid var(--sep-2);background:var(--bg-2);
  box-shadow:var(--sh-1);cursor:pointer;user-select:none;
  transition:transform .12s var(--ease),box-shadow .16s,border-color .16s;
  padding:5px;text-align:center;
}
.tb:hover{transform:translateY(-2px);box-shadow:var(--sh-2);z-index:5}
.tb.round{border-radius:50%}
.tb .n{font-size:15px;font-weight:750;letter-spacing:-.02em;line-height:1.1}
.tb .s{font-size:10px;font-weight:600;color:var(--txt-2);margin-top:2px;line-height:1.2}
.tb .t{position:absolute;top:-9px;inset-inline-end:-7px;background:var(--txt);color:var(--bg);font-size:10px;font-weight:700;padding:1px 6px;border-radius:var(--r-pill);box-shadow:var(--sh-1)}
.tb[data-st="libero"]{border-color:var(--sep-2)}
.tb[data-st="occupato"]{border-color:var(--red);background:var(--red-soft)}
.tb[data-st="prenotato"]{border-color:var(--blue);background:var(--blue-soft)}
.tb[data-st="conto"]{border-color:var(--amber);background:var(--amber-soft)}
.tb[data-st="pulire"]{border-color:var(--violet);background:var(--violet-soft);border-style:dashed}
.tb[data-st="fuori"]{border-color:var(--sep);background:var(--fill-3);opacity:.5}
.tb.sel{outline:3px solid var(--brand);outline-offset:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--txt-2)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;border:2px solid;margin-inline-end:5px;vertical-align:-1px}

/* ---------- 9. MONITOR CUCINA (KDS) ---------- */
.kds{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:13px;align-items:start}
.tik{background:var(--bg-2);border:1px solid var(--sep);border-radius:var(--r-m);box-shadow:var(--sh-1);overflow:hidden;border-top:4px solid var(--grey)}
.tik.nuovo{border-top-color:var(--blue)}
.tik.lavorazione{border-top-color:var(--amber)}
.tik.pronto{border-top-color:var(--green)}
.tik.tardi{border-top-color:var(--red);animation:puls 1.6s ease-in-out infinite}
@keyframes puls{50%{box-shadow:0 0 0 4px var(--red-soft)}}
.tik-h{padding:9px 12px;border-bottom:1px solid var(--sep);display:flex;align-items:center;gap:8px;background:var(--fill-3)}
.tik-h b{font-size:14.5px;font-weight:750}
.tik-h .tm{margin-inline-start:auto;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--txt-2)}
.tik-h .tm.late{color:var(--red)}
.tik ul{padding:6px 0}
.tik li{display:flex;gap:9px;padding:6px 12px;font-size:13.5px;align-items:flex-start;cursor:pointer;transition:.14s}
.tik li:hover{background:var(--fill-3)}
.tik li.done{opacity:.45;text-decoration:line-through}
.tik li .q{font-weight:750;min-width:20px;color:var(--brand)}
.tik li em{display:block;font-style:normal;font-size:11.5px;color:var(--amber);font-weight:600;margin-top:1px}
.tik li em.alert{color:var(--red);font-weight:800;letter-spacing:.02em;font-size:12px}
.tik-f{padding:8px 10px;border-top:1px solid var(--sep);display:flex;gap:6px}
.course{padding:3px 12px;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--txt-3);background:var(--fill-3)}

/* ---------- 10. PIANIFICAZIONE TURNI ---------- */
.plan{min-width:940px;font-size:12.5px}
.plan th{padding:8px 6px;font-size:10.5px;text-align:center;border-bottom:1px solid var(--sep);color:var(--txt-3);text-transform:uppercase;font-weight:700;letter-spacing:.04em}
.plan th:first-child{text-align:start;padding-inline-start:14px;min-width:170px}
.plan td{padding:4px;border-bottom:1px solid var(--sep);vertical-align:top}
.plan td:first-child{padding-inline-start:14px;vertical-align:middle}
.plan .oggi{background:var(--brand-soft)}
.sh{
  display:block;width:100%;padding:5px 7px;border-radius:7px;margin-bottom:3px;
  font-size:11.5px;font-weight:650;line-height:1.3;text-align:start;transition:.12s;
  background:var(--fill-1);border-inline-start:3px solid var(--grey);
}
.sh:hover{background:var(--fill-2)}
.sh small{display:block;font-weight:500;opacity:.72;font-size:10.5px}
.sh.sala{border-inline-start-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.sh.cucina{border-inline-start-color:var(--red);background:var(--red-soft);color:var(--red)}
.sh.bar{border-inline-start-color:var(--violet);background:var(--violet-soft);color:var(--violet)}
.sh.direzione{border-inline-start-color:var(--amber);background:var(--amber-soft);color:var(--amber)}
.sh.riposo{border-inline-start-color:var(--grey);background:var(--fill-1);color:var(--txt-3);font-style:italic}
.addsh{width:100%;padding:4px;border-radius:7px;border:1px dashed var(--sep-2);color:var(--txt-3);font-size:15px;line-height:1;opacity:0;transition:.14s}
.plan td:hover .addsh{opacity:1}
.addsh:hover{background:var(--fill-1);color:var(--brand);border-color:var(--brand)}

/* ---------- 11. LISTE, RIGHE, CHECKLIST ---------- */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--sep)}
.li:last-child{border-bottom:0}
.li:hover{background:var(--fill-3)}
.li .ic{width:36px;height:36px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--fill-1);color:var(--txt-2)}
.li .ic svg{width:17px;height:17px}
.li .tx{min-width:0;flex:1}
.li .tx b{display:block;font-size:13.8px;font-weight:650;letter-spacing:-.005em}
.li .tx span{display:block;font-size:12.2px;color:var(--txt-2);margin-top:1px}
.li .end{margin-inline-start:auto;text-align:end;display:flex;align-items:center;gap:8px}
.li.done .tx b{text-decoration:line-through;opacity:.5}

.avat{
  width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:var(--brand-soft);color:var(--brand);font-size:12.5px;font-weight:750;letter-spacing:.02em;
}
.avat.lg{width:46px;height:46px;font-size:16px}
.avat.sm{width:26px;height:26px;font-size:10.5px}

/* ---------- 12. MENU E STAMPA ---------- */
.dish{display:flex;gap:12px;padding:11px 0;border-bottom:1px dotted var(--sep)}
.dish:last-child{border-bottom:0}
.dish .nm{flex:1;min-width:0}
.dish .nm b{font-size:14.5px;font-weight:650}
.dish .nm p{font-size:12.5px;color:var(--txt-2);margin-top:2px;line-height:1.45}
.dish .pr{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.alg{display:inline-flex;gap:3px;flex-wrap:wrap;margin-top:4px}
.alg span{font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:4px;background:var(--amber-soft);color:var(--amber);letter-spacing:.02em}

.sheet{background:#fff;color:#1a1512;border-radius:var(--r-m);padding:34px 38px;box-shadow:var(--sh-2);max-width:760px;margin:0 auto}
.sheet h2{font-family:var(--serif);font-size:30px;text-align:center;letter-spacing:.01em}
.sheet .rule{height:1px;background:currentColor;opacity:.22;margin:14px 0 18px}
.sheet h4{font-family:var(--serif);font-size:17px;margin:20px 0 8px;letter-spacing:.06em;text-transform:uppercase;opacity:.78}
.sheet .dish .nm p{color:rgba(26,21,18,.6)}
.sheet .dish{border-bottom-color:rgba(26,21,18,.14)}
.sheet .mph{width:66px;height:66px;flex:none;border-radius:8px;background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px rgba(26,21,18,.12)}

/* ---------- 13. FLYER ---------- */
.flyer{
  width:100%;aspect-ratio:210/297;border-radius:var(--r-m);overflow:hidden;position:relative;
  display:flex;flex-direction:column;box-shadow:var(--sh-2);
  background:linear-gradient(165deg,var(--brand),var(--brand-2));color:#fff;padding:30px 26px;
}
.flyer.inv{background:#14100C;color:#F6EFE4}
.flyer.light{background:#FBF7F2;color:#1A1512}
.flyer .fk{font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;opacity:.8}
.flyer h2{font-family:var(--serif);font-size:34px;line-height:1.08;margin-top:12px;letter-spacing:-.01em}
.flyer .fb{font-size:14px;line-height:1.55;margin-top:12px;opacity:.92}
.flyer .fimg{margin-top:15px;width:100%;aspect-ratio:4/3;border-radius:10px;background-size:cover;background-position:center;box-shadow:0 8px 26px rgba(0,0,0,.24)}
.flyer .fc{margin-top:auto;padding-top:18px;border-top:1px solid rgba(255,255,255,.28);font-size:12.5px;line-height:1.6}
.flyer.light .fc{border-top-color:rgba(26,21,18,.2)}
.flyer .cta{display:inline-block;margin-top:14px;padding:9px 18px;border-radius:var(--r-pill);background:#fff;color:var(--brand);font-weight:750;font-size:13.5px}
.flyer.inv .cta,.flyer.light .cta{background:var(--brand);color:#fff}

/* ---------- 13b. GRIGLIA DELLE FOTO ---------- */
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:11px}
.phcard{
  display:flex;flex-direction:column;gap:2px;text-align:start;padding:0;border-radius:var(--r-m);
  background:var(--bg-2);border:1px solid var(--sep);overflow:hidden;box-shadow:var(--sh-1);
  transition:transform .12s var(--ease),box-shadow .16s,border-color .16s;
}
.phcard:hover{transform:translateY(-2px);box-shadow:var(--sh-2);border-color:var(--brand)}
.phcard .im{
  width:100%;aspect-ratio:4/3;background:var(--fill-1) center/cover;display:grid;place-items:center;
  color:var(--txt-3);border-bottom:1px solid var(--sep);
}
.phcard.has .im{border-bottom-color:transparent}
.phcard:not(.has) .im{border:1px dashed var(--sep-2);border-radius:var(--r-m) var(--r-m) 0 0}
.phcard .nm{padding:8px 10px 0;font-size:13px;font-weight:650;line-height:1.3}
.phcard .pr{padding:0 10px 9px;font-size:11.5px;color:var(--txt-2)}

/* ---------- 13c. PIASTRELLE DELLA CASSA ---------- */
.cagrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:10px}
.catile{
  position:relative;display:flex;flex-direction:column;text-align:start;padding:0;overflow:hidden;
  border-radius:var(--r-m);background:var(--bg-2);border:1px solid var(--sep);box-shadow:var(--sh-1);
  transition:transform .1s var(--ease),box-shadow .16s,border-color .16s;
}
.catile:hover{transform:translateY(-2px);box-shadow:var(--sh-2);border-color:var(--brand)}
.catile:active{transform:scale(.97)}
.catile .im{
  width:100%;aspect-ratio:1/1;background:linear-gradient(150deg,var(--fill-1),var(--fill-2)) center/cover;
  display:grid;place-items:center;padding:9px;
}
.catile .ph-txt{font-family:var(--serif);font-size:15px;line-height:1.2;color:var(--txt-2);text-align:center}
.catile .nm{padding:7px 9px 0;font-size:12.5px;font-weight:650;line-height:1.25}
.catile .pr{padding:1px 9px 8px;font-size:13px;font-weight:750;color:var(--brand);font-variant-numeric:tabular-nums}
.catile.off{opacity:.4}
.catile .so{position:absolute;top:7px;inset-inline-end:7px;background:var(--red);color:#fff;font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:var(--r-pill)}

/* ---------- 13d. TASTIERINO DEL CODICE ---------- */
.pin-dots{display:flex;gap:13px;justify-content:center;margin:6px 0 4px}
.pin-dots i{width:15px;height:15px;border-radius:50%;background:var(--fill-2);transition:background .14s,transform .14s}
.pin-dots i.on{background:var(--brand);transform:scale(1.12)}
.pin-dots.shake{animation:shake .4s}
@keyframes shake{10%,90%{transform:translateX(-3px)}30%,70%{transform:translateX(5px)}50%{transform:translateX(-5px)}}
.pin-msg{text-align:center;font-size:12.5px;font-weight:600;color:var(--red);min-height:19px;margin-bottom:8px}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:280px;margin:0 auto}
.pin-k{
  height:58px;border-radius:var(--r-m);background:var(--fill-1);font-size:22px;font-weight:600;
  display:grid;place-items:center;transition:background .12s,transform .1s;font-variant-numeric:tabular-nums;
}
.pin-k:hover{background:var(--fill-2)}
.pin-k:active{transform:scale(.94)}
.pin-k.ok{background:var(--green);color:#fff}
.pin-k.c{background:transparent;border:1px solid var(--sep-2);font-size:19px}

/* ---------- 13e. MONITOR DEL CAMERIERE ---------- */
.lockscreen{display:grid;place-items:center;min-height:62vh;padding:20px}
.lk-card{
  background:var(--bg-2);border:1px solid var(--sep);border-radius:22px;box-shadow:var(--sh-2);
  padding:34px 30px;text-align:center;max-width:380px;width:100%;
}
.lk-logo{
  width:60px;height:60px;margin:0 auto 16px;border-radius:17px;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--brand),var(--brand-2));color:#fff;
  font-family:var(--serif);font-size:28px;font-weight:700;box-shadow:var(--sh-1);
}
.lk-card h2{font-family:var(--serif);font-size:24px;letter-spacing:-.01em}
.lk-card p{font-size:13.5px;color:var(--txt-2);margin-top:6px;line-height:1.5}
.lk-team{margin-top:22px;padding-top:16px;border-top:1px solid var(--sep);font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--txt-3)}
.tmtile{
  position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:1px;
  padding:12px 13px;border-radius:var(--r-m);background:var(--bg-2);border:2px solid var(--sep-2);
  box-shadow:var(--sh-1);transition:transform .1s var(--ease),box-shadow .16s;text-align:start;
}
.tmtile:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.tmtile:active{transform:scale(.97)}
.tmtile .n{font-size:20px;font-weight:750;letter-spacing:-.02em;line-height:1}
.tmtile .s{font-size:11px;font-weight:650;color:var(--txt-2)}
.tmtile .v{font-size:12.5px;font-weight:700;margin-top:3px}
.tmtile .t{position:absolute;top:8px;inset-inline-end:9px;font-size:11px;font-weight:700;color:var(--txt-3)}
.tmtile[data-st="occupato"]{border-color:var(--red);background:var(--red-soft)}
.tmtile[data-st="prenotato"]{border-color:var(--blue);background:var(--blue-soft)}
.tmtile[data-st="conto"]{border-color:var(--amber);background:var(--amber-soft)}
.tmtile[data-st="pulire"]{border-color:var(--violet);background:var(--violet-soft);border-style:dashed}

/* ---------- 14. SCHERMO LED ---------- */
.led{
  position:fixed;inset:0;z-index:500;background:#08060420;display:flex;
  align-items:center;justify-content:center;overflow:hidden;
}
.led-bg{position:absolute;inset:0;background:linear-gradient(150deg,var(--brand),var(--brand-2));transition:background .8s ease}
.led[data-mood="dark"] .led-bg{background:radial-gradient(1200px 700px at 30% 20%,#241A12,#0A0705)}
.led[data-mood="light"] .led-bg{background:linear-gradient(150deg,#FBF7F2,#EDE2D3)}
.led-in{position:relative;text-align:center;padding:5vmin 7vmin;max-width:1500px;color:#fff}
.led[data-mood="light"] .led-in{color:#1A1512}
.led-k{font-size:clamp(13px,1.7vw,26px);font-weight:800;letter-spacing:.3em;text-transform:uppercase;opacity:.72}
.led-t{font-family:var(--serif);font-size:clamp(38px,7.4vw,124px);line-height:1.03;margin-top:2.6vmin;letter-spacing:-.015em;text-wrap:balance}
.led-s{font-size:clamp(16px,2.5vw,40px);margin-top:2.6vmin;opacity:.88;line-height:1.4;text-wrap:balance}
.led-p{font-size:clamp(24px,4.4vw,74px);font-weight:800;margin-top:2.2vmin;font-variant-numeric:tabular-nums}
.led-clock{font-size:clamp(56px,13vw,220px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.04em;line-height:1}
.led-list{display:flex;flex-direction:column;gap:1.6vmin;margin-top:3vmin;text-align:start}
.led-list li{display:flex;gap:2vmin;align-items:baseline;font-size:clamp(15px,2.5vw,40px)}
.led-list li b{font-weight:650}
.led-list li i{flex:1;border-bottom:2px dotted currentColor;opacity:.3;margin-bottom:.5vmin}
.led-in.wide{max-width:none;width:100%;padding:0}
.led-in.wide ~ .led-foot{display:none}
.led-wall{display:grid;width:100vw;height:100dvh;gap:2px}
.led-wall .w{position:relative;background-size:cover;background-position:center;display:block;overflow:hidden}
.led-wall .w em{
  position:absolute;inset-inline:0;bottom:0;padding:1.8vmin 2vmin 2.6vmin;font-style:normal;color:#fff;
  background:linear-gradient(180deg,rgba(8,6,4,0),rgba(8,6,4,.88));display:flex;align-items:baseline;gap:1.4vmin;
}
.led-wall .w b{font-size:clamp(12px,1.6vw,26px);font-weight:650;line-height:1.22;text-align:start}
.led-wall .w i{margin-inline-start:auto;font-style:normal;font-weight:800;font-variant-numeric:tabular-nums;font-size:clamp(12px,1.5vw,24px)}
.led-x{position:absolute;top:18px;inset-inline-end:18px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;z-index:3}
.led-bar{position:absolute;bottom:0;inset-inline-start:0;height:5px;background:rgba(255,255,255,.85);transition:width .3s linear}
.led-foot{position:absolute;bottom:3vmin;inset-inline-start:0;inset-inline-end:0;text-align:center;font-size:clamp(11px,1.4vw,20px);letter-spacing:.24em;text-transform:uppercase;opacity:.55;color:#fff}
.led[data-mood="light"] .led-foot{color:#1A1512}
.fadein{animation:ledin .7s var(--ease)}
@keyframes ledin{from{opacity:0;transform:translateY(24px)}}

/* ---------- 15. RTL (arabo) ---------- */
:root[dir="rtl"] .tik li .q,:root[dir="rtl"] .plan th:first-child{text-align:start}
:root[dir="rtl"] .bar>i{float:right}
:root[dir="rtl"] .tb .t{transform:scaleX(1)}

/* ---------- 16. RESPONSIVE ---------- */
@media (max-width:1080px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:920px){
  .app{grid-template-columns:1fr}
  .side{
    position:fixed;inset-block:0;inset-inline-start:0;width:min(292px,84vw);z-index:120;
    transform:translateX(-102%);transition:transform .26s var(--ease);box-shadow:var(--sh-3);
  }
  :root[dir="rtl"] .side{transform:translateX(102%)}
  body.menu-open .side{transform:none}
  body.menu-open::after{content:"";position:fixed;inset:0;background:rgba(20,14,8,.4);z-index:110;animation:fade .2s}
  .burger{display:grid;place-items:center;width:36px;height:36px;border-radius:var(--r-s);background:var(--fill-1);flex:none}
  .top{padding-inline:15px}.view{padding:15px 15px 70px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .f2,.f3{grid-template-columns:1fr}
  .modal{width:100%;max-height:92dvh}
  .toasts{inset-inline:14px;align-items:stretch}
  .toast{max-width:none}
}
@media (max-width:560px){
  .top h1{font-size:17.5px}
  .stat .v{font-size:22px}
  .gauto,.gauto-l{grid-template-columns:1fr}
  .card-b{padding:13px}
  .sheet{padding:22px 18px}
}

/* foto a tutto schermo dietro al testo, piu il taglio grande del piatto */
.led-img{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.62}
.led[data-mood="light"] .led-img{opacity:.42}
.led-scrim{position:absolute;inset:0;background:linear-gradient(175deg,rgba(10,7,4,.34),rgba(10,7,4,.80))}
.led[data-mood="light"] .led-scrim{background:linear-gradient(175deg,rgba(251,247,242,.58),rgba(251,247,242,.90))}

<script>
/* ============================================================
   PARTE 2 — MOTORE i18n
   ============================================================ */
const LKEYS = ["it","en","fr","es","de","ar"];
const DICT = {};
LKEYS.forEach((lk,i)=>{ DICT[lk] = {}; for(const k in RAW) DICT[lk][k] = RAW[k][i] || RAW[k][0]; });

let LANG = "it";
/** Traduce una chiave di interfaccia. */
function T(k){ return (DICT[LANG] && DICT[LANG][k]) || DICT.it[k] || k; }
/** Legge un contenuto multilingua {it:..,en:..} con ripiego sull'italiano. */
function L(o){
  if(o == null) return "";
  if(typeof o === "string") return o;
  return o[LANG] || o.it || o.en || Object.values(o)[0] || "";
}
/** Costruisce un oggetto multilingua a partire da un valore singolo. */
function ml(v){ const o = {}; LKEYS.forEach(k => o[k] = v); return o; }

function applyLang(lk){
  LANG = LKEYS.includes(lk) ? lk : "it";
  const root = document.documentElement;
  root.setAttribute("lang", LANG);
  root.setAttribute("dir", LANGS[LANG].dir);
}

/* ============================================================
   PARTE 3 — UTILITA
   ============================================================ */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const uid = (p)=> (p||"id") + "_" + Math.random().toString(36).slice(2,9);
const clamp = (n,a,b)=> Math.max(a, Math.min(b, n));
const sum = (a)=> a.reduce((x,y)=> x + y, 0);

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
/* In arabo teniamo le cifre latine: i prezzi restano leggibili a tutti in sala. */
function locale(){ return LANG === "ar" ? "ar-u-nu-latn" : LANG; }
function eur(n){
  const v = Number(n) || 0;
  try{ return v.toLocaleString(locale(), {style:"currency", currency:"EUR", minimumFractionDigits:2}); }
  catch(e){ return v.toFixed(2) + " EUR"; }
}
function num(n,d){
  const v = Number(n) || 0;
  try{ return v.toLocaleString(locale(), {minimumFractionDigits:d||0, maximumFractionDigits:d==null?2:d}); }
  catch(e){ return String(v); }
}
function pct(n){ return (Number(n)||0).toFixed(0) + "%"; }
/** Singolare o plurale: plur(1,"tavolo","tavoli") -> "1 tavolo". */
function plur(n, one, many){ return n + " " + (Math.abs(n) === 1 ? one : many); }

/* --- date --- */
const iso = (d)=>{ const x = d ? new Date(d) : new Date(); const o = x.getTimezoneOffset(); return new Date(x - o*60000).toISOString().slice(0,10); };
const today = ()=> iso();
function addDays(dstr, n){ const d = new Date(dstr + "T12:00:00"); d.setDate(d.getDate() + n); return iso(d); }
function fmtDate(dstr,opt){
  if(!dstr) return "";
  const d = new Date(dstr.length <= 10 ? dstr + "T12:00:00" : dstr);
  if(isNaN(d)) return dstr;
  try{ return d.toLocaleDateString(locale(), opt || {day:"2-digit",month:"short",year:"numeric"}); }
  catch(e){ return dstr; }
}
function fmtTime(t){ return t || ""; }
function nowHM(){ const d = new Date(); return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); }
function hm2min(t){ if(!t) return 0; const [h,m] = t.split(":").map(Number); return h*60 + (m||0); }
function min2hm(m){ m = Math.max(0, Math.round(m)); return String(Math.floor(m/60)).padStart(2,"0") + ":" + String(m%60).padStart(2,"0"); }
/** Durata in minuti fra due orari, gestendo il turno che supera la mezzanotte. */
function shiftMinutes(start, end, brk){
  let d = hm2min(end) - hm2min(start);
  if(d < 0) d += 1440;
  return Math.max(0, d - (Number(brk) || 0));
}
function minutesSince(tsIso){ if(!tsIso) return 0; return Math.max(0, Math.floor((Date.now() - new Date(tsIso).getTime())/60000)); }
function weekStart(dstr){
  const d = new Date((dstr || today()) + "T12:00:00");
  const wd = (d.getDay() + 6) % 7;   /* lunedi = 0 */
  d.setDate(d.getDate() - wd);
  return iso(d);
}
function initials(name){
  return String(name||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase() || "?";
}

<script>
/* --- toast --- */
function toast(msg, kind){
  const el = document.createElement("div");
  el.className = "toast " + (kind || "");
  el.innerHTML = esc(msg);
  $("#toasts").appendChild(el);
  setTimeout(()=>{ el.style.opacity = "0"; el.style.transform = "translateY(8px)"; el.style.transition = "opacity .25s, transform .25s"; }, 2600);
  setTimeout(()=> el.remove(), 2950);
}

/* --- modale --- */
let MODAL = null;
function modal(opts){
  closeModal();
  const o = Object.assign({title:"", body:"", size:"", actions:[], onOpen:null}, opts);
  const ovl = document.createElement("div");
  ovl.className = "ovl";
  ovl.innerHTML =
    '<div class="modal ' + o.size + '" role="dialog" aria-modal="true">' +
      '<div class="modal-h"><h3>' + esc(o.title) + '</h3>' +
        '<button class="x" data-x aria-label="' + esc(T("c_close")) + '">' + icon("x",15) + '</button></div>' +
      '<div class="modal-b">' + o.body + '</div>' +
      (o.actions.length ? '<div class="modal-f" data-foot></div>' : '') +
    '</div>';
  const foot = $("[data-foot]", ovl);
  if(foot) o.actions.forEach((a,i)=>{
    const b = document.createElement("button");
    b.className = "btn " + (a.cls || "");
    b.innerHTML = (a.icon ? icon(a.icon,15) : "") + esc(a.label);
    b.onclick = ()=>{ const r = a.run ? a.run(ovl) : true; if(r !== false) closeModal(); };
    foot.appendChild(b);
  });
  $("[data-x]", ovl).onclick = closeModal;
  ovl.onclick = (e)=>{ if(e.target === ovl) closeModal(); };
  $("#modal-root").appendChild(ovl);
  MODAL = ovl;
  if(o.onOpen) o.onOpen(ovl);
  const f = $("input:not([type=hidden]),select,textarea", ovl);
  if(f && !("ontouchstart" in window)) setTimeout(()=> f.focus(), 60);
  return ovl;
}
function closeModal(){ if(MODAL){ MODAL.remove(); MODAL = null; } }
document.addEventListener("keydown", (e)=>{ if(e.key === "Escape"){ if(MODAL) closeModal(); else if(LEDON) stopLed(); } });

function confirmBox(msg, onYes, danger){
  modal({ title:T("c_confirm"), size:"slim", body:'<p style="font-size:14.5px;line-height:1.6">' + esc(msg) + '</p>',
    actions:[ {label:T("c_cancel"), cls:"ghost"}, {label:T("c_confirm"), cls: danger ? "dang" : "pri", run:()=> onYes && onYes()} ] });
}

/* --- lettura form dentro un contenitore --- */
function readForm(root){
  const d = {};
  $$("[name]", root).forEach(el=>{
    if(el.type === "checkbox") d[el.name] = el.checked;
    else if(el.type === "number") d[el.name] = el.value === "" ? null : Number(el.value);
    else d[el.name] = el.value;
  });
  return d;
}
/** Campi multilingua: raccoglie name="nome@it", "nome@en"... in un oggetto. */
function readML(root, base){
  const o = {};
  LKEYS.forEach(lk=>{ const el = $('[name="' + base + '@' + lk + '"]', root); if(el && el.value.trim()) o[lk] = el.value.trim(); });
  if(!o.it) o.it = (o.en || Object.values(o)[0] || "");
  return o;
}
function mlFields(base, obj, label, textarea){
  return '<div class="field"><label>' + esc(label) + ' <span style="color:var(--txt-3);font-weight:500">' + esc(T("m_translate")) + '</span></label>' +
    '<div class="grid gauto-s" style="gap:8px">' + LKEYS.map(lk=>
      '<div><div style="font-size:11px;font-weight:700;color:var(--txt-3);margin-bottom:3px;display:flex;align-items:center;gap:5px">' + flag(lk,11) + LANGS[lk].code + '</div>' +
      (textarea
        ? '<textarea class="inp sm" style="min-height:52px" name="' + base + '@' + lk + '" dir="' + LANGS[lk].dir + '">' + esc((obj && obj[lk]) || "") + '</textarea>'
        : '<input class="inp sm" name="' + base + '@' + lk + '" dir="' + LANGS[lk].dir + '" value="' + esc((obj && obj[lk]) || "") + '">') +
      '</div>').join("") + '</div></div>';
}

/* --- blocchi riusabili --- */
function stat(k, v, d, cls){
  return '<div class="stat ' + (cls || "") + '"><div class="k">' + esc(k) + '</div><div class="v num">' + v + '</div>' + (d ? '<div class="d">' + d + '</div>' : '') + '</div>';
}
function card(title, body, actions, cls){
  return '<section class="card ' + (cls || "") + '">' +
    (title ? '<div class="card-h"><h3>' + esc(title) + '</h3>' + (actions ? '<div class="sp">' + actions + '</div>' : '') + '</div>' : '') +
    '<div class="card-b' + (cls && cls.indexOf("flush") >= 0 ? " flush" : "") + '">' + body + '</div></section>';
}
function empty(msg, ico){
  return '<div class="empty">' + icon(ico || "check", 38) + '<b>' + esc(T("c_none_yet")) + '</b><p>' + esc(msg || "") + '</p></div>';
}
function bar(v, max, cls){
  const w = clamp(max ? (v / max) * 100 : 0, 0, 100);
  return '<div class="bar"><i class="' + (cls || "") + '" style="width:' + w.toFixed(1) + '%"></i></div>';
}

<script>
/* --- persistenza --- */
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch(e){ toast("Memoria piena: esporta un backup", "err"); }
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    return (d && d.meta && d.tables) ? d : null;
  }catch(e){ return null; }
}
function resetDemo(){ DB = buildSeed(); DB.meta.lang = LANG; save(); }

/* --- ricerche --- */
const byId = (arr,id)=> arr.find(x=> x.id === id) || null;
const itemById = (id)=> byId(DB.items, id);
const tableById = (id)=> byId(DB.tables, id);
const staffById = (id)=> byId(DB.staff, id);
const catById = (id)=> byId(DB.cats, id);
const invById = (id)=> byId(DB.inv, id);
const hotelById = (id)=> byId(DB.hotels, id);
const staffName = (id)=> (staffById(id) || {}).name || "";
const openOrders = ()=> DB.orders.filter(o=> o.status !== "chiuso" && o.status !== "annullato");
const orderOf = (tableId)=> openOrders().find(o=> o.tableId === tableId) || null;

/* --- calcoli comanda --- */
function modById(id){ return (DB.mods || []).find(m=> m.id === id) || null; }
/** Quanto costano in piu le modifiche scelte su una riga. */
function modsPrice(l){ return sum((l.mods || []).map(id=>{ const m = modById(id); return m ? (Number(m.price)||0) : 0; })); }
function modsText(l){ return (l.mods || []).map(id=>{ const m = modById(id); return m ? L(m.name) : ""; }).filter(Boolean); }
function lineTotal(l){ return ((Number(l.price)||0) + modsPrice(l)) * (Number(l.qty)||0); }
function orderSubtotal(o){ return sum((o.lines||[]).map(lineTotal)); }
function orderTotal(o){
  const sub = orderSubtotal(o);
  const cov = (o.type === "sala" ? (Number(o.covers)||0) * (DB.meta.biz.cover||0) : 0);
  const disc = (Number(o.disc)||0);
  const svc = sub * ((DB.meta.biz.service||0)/100);
  return Math.max(0, sub + cov + svc - disc);
}
function orderLabel(o){
  if(o.type === "banco") return T("nav_cassa") + " " + T("a_counter").toLowerCase();
  if(o.type === "sala"){ const t = tableById(o.tableId); return T("c_table") + " " + (t ? t.n : "?"); }
  if(o.type === "hotel"){ const h = hotelById(o.hotelId); return "Hotel " + (h ? h.name : ""); }
  return T("nav_away");
}

/* --- stato tavolo --- */
function setTable(id, patch){ const t = tableById(id); if(t){ Object.assign(t, patch); save(); } }
function freeTable(id){
  setTable(id, {status:"pulire", covers:0, waiter:"", orderId:null, since:new Date().toISOString(), setupDone:false});
}

/* --- magazzino --- */
function stockMove(itemId, type, qty, note){
  const it = invById(itemId); if(!it) return;
  const q = Math.abs(Number(qty) || 0);
  if(type === "carico") it.qty += q;
  else if(type === "rettifica") it.qty = q;
  else it.qty = Math.max(0, it.qty - q);
  DB.moves.unshift({id:uid("mv"), date:new Date().toISOString(), itemId:itemId, type:type, qty:q, note:note || ""});
  if(DB.moves.length > 600) DB.moves.length = 600;
  save();
}
const lowStock = ()=> DB.inv.filter(i=> i.qty <= i.min);
const stockValue = ()=> sum(DB.inv.map(i=> (i.qty||0) * (i.cost||0)));

/* --- turni --- */
function shiftsOf(dateStr){ return DB.shifts.filter(s=> s.date === dateStr); }
function shiftHours(s){ return shiftMinutes(s.start, s.end, s.brk) / 60; }
function weekHours(staffId, ws){
  const days = Array.from({length:7}, (_,i)=> addDays(ws,i));
  return sum(DB.shifts.filter(s=> s.staffId === staffId && days.includes(s.date)).map(shiftHours));
}
function weekLabourCost(ws){
  const days = Array.from({length:7}, (_,i)=> addDays(ws,i));
  return sum(DB.shifts.filter(s=> days.includes(s.date)).map(s=>{
    const st = staffById(s.staffId); return shiftHours(s) * ((st && st.rate) || 0);
  }));
}

/* --- giornata --- */
function ordersOn(dateStr){ return DB.orders.filter(o=> (o.date || (o.closed||o.opened||"").slice(0,10)) === dateStr); }
function closedOn(dateStr){ return ordersOn(dateStr).filter(o=> o.status === "chiuso"); }
function revenueOn(dateStr){ return sum(closedOn(dateStr).map(o=> o.total != null ? o.total : orderTotal(o))); }
function coversOn(dateStr){ return sum(closedOn(dateStr).map(o=> Number(o.covers)||0)); }
function briefingOf(dateStr){ return DB.briefings.find(b=> b.date === dateStr) || null; }
function checklistOf(dateStr, kind){
  DB.checklists[dateStr] = DB.checklists[dateStr] || {};
  if(!DB.checklists[dateStr][kind]) DB.checklists[dateStr][kind] = {};
  return DB.checklists[dateStr][kind];
}
function todaySlogan(){
  if(DB.sloganToday && DB.sloganToday.date === today()) return byId(DB.slogans, DB.sloganToday.id);
  return null;
}
const specials = ()=> DB.items.filter(i=> i.special && i.available);
const soldOut  = ()=> DB.items.filter(i=> !i.available);

<script>
/* ============================================================
   PARTE 6b — FOTO DEI PIATTI
   Le foto stanno in IndexedDB, non in localStorage: quattro scatti da
   telefono riempirebbero subito i 5 MB scarsi che localStorage concede,
   e il gestionale smetterebbe di salvare tutto il resto.
   In memoria ne teniamo una copia (PHOTOS) per poterle disegnare subito.
   ============================================================ */
const PH_DB = "ristorante_foto", PH_STORE = "foto";
let PHOTOS = {};

function phOpen(){
  return new Promise((res, rej)=>{
    if(!window.indexedDB){ rej(new Error("senza IndexedDB")); return; }
    const r = indexedDB.open(PH_DB, 1);
    r.onupgradeneeded = ()=>{
      const d = r.result;
      if(!d.objectStoreNames.contains(PH_STORE)) d.createObjectStore(PH_STORE);
    };
    r.onsuccess = ()=> res(r.result);
    r.onerror = ()=> rej(r.error);
  });
}
function phLoadAll(){
  return phOpen().then(d=> new Promise((res)=>{
    const out = {};
    const cur = d.transaction(PH_STORE, "readonly").objectStore(PH_STORE).openCursor();
    cur.onsuccess = ()=>{ const c = cur.result; if(c){ out[c.key] = c.value; c.continue(); } else res(out); };
    cur.onerror = ()=> res(out);
  })).catch(()=> ({}));
}
function phPut(id, dataURL){
  PHOTOS[id] = dataURL;
  return phOpen().then(d=> new Promise((res, rej)=>{
    const tx = d.transaction(PH_STORE, "readwrite");
    tx.objectStore(PH_STORE).put(dataURL, id);
    tx.oncomplete = ()=> res(id);
    tx.onerror = ()=> rej(tx.error);
  })).catch(e=>{ toast("Foto non salvata: memoria piena", "err"); throw e; });
}
function phDel(id){
  delete PHOTOS[id];
  return phOpen().then(d=> new Promise((res)=>{
    const tx = d.transaction(PH_STORE, "readwrite");
    tx.objectStore(PH_STORE).delete(id);
    tx.oncomplete = res; tx.onerror = res;
  })).catch(()=>{});
}
/** Foto non piu agganciata a niente: si butta, altrimenti resta li a occupare spazio. */
function phGarbage(){
  const used = {};
  DB.items.forEach(i=>{ if(i.photo) used[i.photo] = 1; });
  DB.slogans.forEach(x=>{ if(x.photo) used[x.photo] = 1; });
  DB.flyers.forEach(f=>{ if(f.photo) used[f.photo] = 1; });
  (DB.led.slides || []).forEach(x=>{ if(x.photo) used[x.photo] = 1; });
  Object.keys(PHOTOS).forEach(id=>{ if(!used[id]) phDel(id); });
}

/** Una foto da telefono pesa 4 MB: qui ne bastano 150 KB per riempire uno schermo. */
function shrink(file, maxW, quality){
  return new Promise((res, rej)=>{
    const fr = new FileReader();
    fr.onerror = ()=> rej(new Error("lettura"));
    fr.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> rej(new Error("immagine"));
      img.onload = ()=>{
        const sc = Math.min(1, (maxW || 1100) / img.width);
        const c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.width * sc));
        c.height = Math.max(1, Math.round(img.height * sc));
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        try{ res(c.toDataURL("image/jpeg", quality || 0.72)); }
        catch(e){ rej(e); }
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/** Apre la fotocamera o la galleria, rimpicciolisce e salva. Ritorna l'id. */
function pickPhoto(onDone){
  /* l'input sta nel documento, non staccato: certi browser non aprono il
     selettore su un elemento che non e in pagina */
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*";
  inp.style.cssText = "position:fixed;left:-9999px;width:1px;height:1px;opacity:0";
  inp.onchange = ()=>{
    const f = inp.files && inp.files[0];
    inp.remove();
    if(!f) return;
    toast("Sto preparando la foto...");
    shrink(f, 1100, 0.72)
      .then(url=>{ const id = uid("ph"); return phPut(id, url).then(()=> onDone(id)); })
      .catch(()=> toast("Non riesco a leggere questa immagine", "err"));
  };
  document.body.appendChild(inp);
  inp.click();
}

/* --- pezzi di interfaccia --- */
function photoURL(id){ return id && PHOTOS[id] ? PHOTOS[id] : null; }
function thumb(id, size, radius){
  const u = photoURL(id), sz = size || 44;
  return '<span style="width:' + sz + 'px;height:' + sz + 'px;flex:none;border-radius:' + (radius || 9) + 'px;' +
    'display:block;background:' + (u ? 'url(' + u + ') center/cover' : 'var(--fill-1)') + ';' +
    'box-shadow:inset 0 0 0 1px var(--sep)"></span>';
}
/** Riquadro con anteprima e i due pulsanti, da mettere dentro una scheda. */
function photoField(label, id){
  const u = photoURL(id);
  return '<div class="field"><label>' + esc(label) + '</label>' +
    '<div class="row" data-photo="' + (id || "") + '">' +
      '<span class="ph-prev" style="width:88px;height:66px;flex:none;border-radius:var(--r-s);display:grid;place-items:center;' +
        'background:' + (u ? 'url(' + u + ') center/cover' : 'var(--fill-1)') + ';box-shadow:inset 0 0 0 1px var(--sep);' +
        'color:var(--txt-3);font-size:11px">' + (u ? '' : esc("nessuna")) + '</span>' +
      '<button type="button" class="btn sm ghost" data-phpick>' + icon("menu",13) + esc(u ? "Cambia foto" : "Scegli foto") + '</button>' +
      '<button type="button" class="btn sm dang" data-phclear' + (u ? '' : ' hidden') + '>' + icon("trash",13) + esc("Togli") + '</button>' +
    '</div>' +
    '<p style="font-size:12px;color:var(--txt-3);margin-top:6px">' +
      esc("Scatta col telefono il piatto vero, con la luce del locale. La foto viene rimpicciolita da sola e resta su questo dispositivo.") + '</p></div>';
}
/** Collega i pulsanti del riquadro. Ritorna una funzione che legge l'id scelto. */
function wirePhoto(root){
  const box = $("[data-photo]", root);
  if(!box) return ()=> null;
  const draw = ()=>{
    const u = photoURL(box.dataset.photo);
    const prev = $(".ph-prev", box);
    prev.style.background = u ? 'url(' + u + ') center/cover' : 'var(--fill-1)';
    prev.textContent = u ? "" : "nessuna";
    $("[data-phpick]", box).innerHTML = icon("menu",13) + esc(u ? "Cambia foto" : "Scegli foto");
    $("[data-phclear]", box).hidden = !u;
  };
  $("[data-phpick]", box).onclick = ()=> pickPhoto(id=>{ box.dataset.photo = id; draw(); });
  $("[data-phclear]", box).onclick = ()=>{ box.dataset.photo = ""; draw(); };
  return ()=> box.dataset.photo || null;
}
</script>
<script>
/* ============================================================
   PARTE 6c — CHI È AL MONITOR, E CHI PUO MODIFICARE
   Ogni persona ha il suo codice di quattro cifre. Il cameriere entra col
   suo e prende le comande a nome suo. Qualsiasi modifica a una comanda
   gia mandata in cucina, o allo sconto, chiede il codice del responsabile:
   il responsabile arriva dappertutto.

   Nota onesta: il codice serve a mettere ordine nel lavoro, non è una
   difesa informatica. I dati stanno in chiaro nel browser e chi ha in mano
   il dispositivo puo leggerli.
   ============================================================ */
let SESSION = null;      /* {staffId, since} */

function isManager(st){ return !!st && (st.level === "responsabile" || MANAGER_ROLES.includes(st.role)); }
function me(){ return SESSION ? staffById(SESSION.staffId) : null; }
function meIsManager(){ return isManager(me()); }
function staffByPin(pin){ return DB.staff.find(st=> st.active && st.pin && st.pin === pin) || null; }

/** Tastierino numerico. accept(staff) decide chi passa. */
function askPin(o){
  let pin = "";
  const keys = ["1","2","3","4","5","6","7","8","9","c","0","ok"];
  const body =
    (o.hint ? '<p style="font-size:13.5px;color:var(--txt-2);text-align:center;margin-bottom:14px;line-height:1.55">' + esc(o.hint) + '</p>' : '') +
    '<div class="pin-dots" id="pin-dots"></div>' +
    '<div class="pin-msg" id="pin-msg"></div>' +
    '<div class="pin-pad">' + keys.map(k=>
      '<button class="pin-k' + (k === "ok" ? " ok" : k === "c" ? " c" : "") + '" data-k="' + k + '">' +
      (k === "c" ? "&#9003;" : k === "ok" ? icon("check",20) : k) + '</button>').join("") + '</div>';

  modal({title:o.title || T("au_pin"), size:"slim", body:body,
    actions:[{label:T("c_cancel"), cls:"ghost", run:()=> o.onCancel && o.onCancel()}],
    onOpen:(w)=>{
      const dots = $("#pin-dots", w), msg = $("#pin-msg", w);
      const draw = ()=> dots.innerHTML = [0,1,2,3].map(i=>
        '<i class="' + (i < pin.length ? "on" : "") + '"></i>').join("");
      const wrong = ()=>{
        msg.textContent = T("au_wrong");
        dots.classList.add("shake");
        setTimeout(()=> dots.classList.remove("shake"), 420);
        pin = ""; draw();
      };
      const submit = ()=>{
        const st = staffByPin(pin);
        if(st && (!o.accept || o.accept(st))){ closeModal(); o.onOk(st); }
        else wrong();
      };
      const press = (k)=>{
        msg.textContent = "";
        if(k === "c") pin = pin.slice(0, -1);
        else if(k === "ok") return submit();
        else if(pin.length < 4) pin += k;
        draw();
        if(pin.length === 4) setTimeout(submit, 120);
      };
      $$("[data-k]", w).forEach(b=> b.onclick = ()=> press(b.getAttribute("data-k")));
      w.tabIndex = -1; w.focus();
      w.addEventListener("keydown", (e)=>{
        if(/^[0-9]$/.test(e.key)) press(e.key);
        else if(e.key === "Backspace") press("c");
        else if(e.key === "Enter") press("ok");
      });
      draw();
    }});
}

/** Tiene traccia di chi ha autorizzato una modifica, e su cosa. */
function logChange(order, line, what, mgr){
  DB.changes = DB.changes || [];
  const it = line ? itemById(line.itemId) : null;
  DB.changes.unshift({
    id:uid("ch"), at:new Date().toISOString(),
    by:(me() || {}).id || null, mgr:mgr ? mgr.id : null,
    what:what, where:order ? orderLabel(order) : "", item:it ? L(it.name) : ""
  });
  if(DB.changes.length > 400) DB.changes.length = 400;
  save();
}

/** Chiede il codice del responsabile, se chi e al monitor non lo e gia. */
function requireManager(reason, onOk){
  if(meIsManager()){ onOk(me()); return; }
  askPin({title:T("au_need"), hint:reason, accept:isManager, onOk:(st)=>{
    toast(T("au_mgr") + ": " + st.name, "ok");
    onOk(st);
  }});
}

/** Entra al monitor. */
function signIn(after){
  askPin({title:T("au_who"), hint:"Il tuo codice personale di quattro cifre",
    accept:(st)=> st.active,
    onOk:(st)=>{
      SESSION = {staffId:st.id, since:new Date().toISOString()};
      /* la timbratura di entrata, se non c'e gia */
      const d = today();
      if(!DB.clock.some(c=> c.date === d && c.staffId === st.id && !c.out)){
        DB.clock.push({id:uid("cl"), staffId:st.id, date:d, in:nowHM(), out:null});
        save();
      }
      toast(esc(st.name) + (isManager(st) ? " - " + T("au_mgr") : ""), "ok");
      if(after) after(st); else refresh();
    }});
}

/** Stacca: chiude la timbratura e libera il monitor. */
function signOut(){
  const st = me(); if(!st) return;
  confirmBox(T("au_offq"), ()=>{
    const c = DB.clock.find(x=> x.date === today() && x.staffId === st.id && !x.out);
    if(c) c.out = nowHM();
    SESSION = null; save(); refresh();
    toast(T("au_off") + " " + (c ? c.out : nowHM()), "ok");
  });
}

<script>

VIEWS.dash = function(){
  const d = today();

          eur(sum(nb.map(o=> o.total||0))) + ' &middot; ' + esc(T("ca_nofisc").toLowerCase()) + '</span></div>' +

             '<button class="btn ghost" data-led>' + icon("led",15) + esc(T("mk_led_play")) + '</button>' +
             '<button class="btn pri" data-go="cassa">' + icon("order",15) + esc(T("nav_cassa")) + '</button>',

<script>
/* ============================================================
   PARTE 9 — TAVOLI E PIANTINA
   ============================================================ */
const TSTATES = [
  {k:"libero",    t:"t_free",  c:"--sep-2"},
  {k:"prenotato", t:"t_res",   c:"--blue"},
  {k:"occupato",  t:"t_busy",  c:"--red"},
  {k:"conto",     t:"t_bill",  c:"--amber"},
  {k:"pulire",    t:"t_clean", c:"--violet"},
  {k:"fuori",     t:"t_out",   c:"--sep"}
];
let ROOM = "r_int";

function tableSize(t){
  const base = t.seats <= 2 ? 66 : t.seats <= 4 ? 82 : t.seats <= 6 ? 100 : 124;
  return {w: t.shape === "rect" ? base + 34 : base, h: t.shape === "rect" ? base - 12 : base};
}

VIEWS.tables = function(){
  const list = DB.tables.filter(t=> t.room === ROOM);
  const all = DB.tables;
  const busy = all.filter(t=> t.status === "occupato").length;
  const setupLeft = all.filter(t=> !t.setupDone && t.status !== "fuori").length;

  const floor = '<div class="floor" id="floor">' + list.map(t=>{
    const sz = tableSize(t);
    const o = t.orderId ? byId(DB.orders, t.orderId) : null;
    const mins = t.since ? minutesSince(t.since) : 0;
    return '<button class="tb' + (t.shape === "round" ? " round" : "") + '" data-tb="' + t.id + '" data-st="' + t.status + '"' +
      ' style="inset-inline-start:' + t.x + '%;top:' + t.y + '%;width:' + sz.w + 'px;height:' + sz.h + 'px">' +
      (t.status === "occupato" || t.status === "conto" ? '<span class="t">' + mins + "'" + '</span>' : '') +
      '<span class="n">' + esc(t.n) + '</span>' +
      '<span class="s">' + (t.status === "libero" || t.status === "fuori"
          ? t.seats + " " + esc(T("t_seats").toLowerCase())
          : (t.covers || t.seats) + " " + esc(T("c_covers").toLowerCase()) + (o ? "<br>" + eur(orderTotal(o)) : "")) + '</span>' +
      (!t.setupDone && t.status === "libero" ? '<span style="position:absolute;bottom:-6px;font-size:9px;color:var(--violet);font-weight:800">MEP</span>' : '') +
      '</button>';
  }).join("") + '</div>';

  const html =
  '<div class="row" style="margin-bottom:14px">' +
    '<div class="seg">' + DB.rooms.map(r=>
      '<button class="' + (ROOM === r.id ? "on" : "") + '" data-room="' + r.id + '">' + esc(L(r.name)) + '</button>').join("") + '</div>' +
    '<div class="spacer"></div>' +
    '<button class="btn ghost sm" data-mep>' + icon("check",14) + esc(T("t_setup")) + ' (' + setupLeft + ')</button>' +
  '</div>' +
  floor +
  '<div class="legend mt">' + TSTATES.map(s=>
    '<span><i style="border-color:var(' + s.c + ')"></i>' + esc(T(s.t)) + ' &middot; ' +
    all.filter(t=> t.status === s.k).length + '</span>').join("") + '</div>' +

  '<div class="grid g4 mt-l">' +
    stat(T("t_busy"), busy + "/" + all.length, sum(all.filter(t=>t.status==="occupato").map(t=>t.covers)) + " " + T("c_covers").toLowerCase()) +
    stat(T("t_free"), all.filter(t=>t.status==="libero").length, sum(all.filter(t=>t.status==="libero").map(t=>t.seats)) + " " + T("t_seats").toLowerCase()) +
    stat(T("t_clean"), all.filter(t=>t.status==="pulire").length, "da risistemare") +
    stat(T("t_setup"), (all.length - setupLeft) + "/" + all.length, "mise en place fatta") +
  '</div>';

  return {
    title:T("nav_tables"),
    sub:esc(L((DB.rooms.find(r=>r.id===ROOM)||{}).name || "")) + ' &middot; ' + list.length + ' ' + esc(T("nav_tables").toLowerCase()),
    actions:'<button class="btn ghost" data-newtb>' + icon("plus",15) + esc(T("c_new")) + '</button>',
    html:html,
    after:()=>{
      $$("[data-room]").forEach(b=> b.onclick = ()=>{ ROOM = b.getAttribute("data-room"); refresh(); });
      $$("[data-tb]").forEach(b=> b.onclick = ()=>{

      });
      enableDrag();
      $("[data-mep]").onclick = mepSheet;
      $("[data-newtb]").onclick = newTableSheet;
    }
  };
};

/* --- scheda del tavolo --- */
function tableSheet(id){

  const o = orderOf(id);
  const res = DB.reservations.filter(r=> r.tableId === id && r.date === today() && r.status !== "annullata");

    '<div class="row" style="margin-bottom:14px">' +

      (t.since && (t.status==="occupato"||t.status==="conto") ? ' &middot; ' + esc(T("t_since")) + ' ' + minutesSince(t.since) + " min" : '') + '</div></div>' +
    '</div>' +
    (res.length ? '<div class="card" style="margin-bottom:12px"><div class="card-b" style="padding:11px 13px">' +
      res.map(r=> '<div style="font-size:13px"><b>' + esc(r.time) + ' &middot; ' + esc(r.name) + '</b> &middot; ' + r.covers + ' ' + esc(T("c_covers").toLowerCase()) +
      (r.note ? '<div style="color:var(--amber);font-size:12.5px;margin-top:3px">' + icon("warn",12) + ' ' + esc(r.note) + '</div>' : '') + '</div>').join("") +

    (o ? '<div class="card" style="margin-bottom:12px"><div class="card-h" style="padding:10px 13px"><h3>' + esc(T("o_order")) + '</h3>' +
      '<div class="sp"><b>' + eur(orderTotal(o)) + '</b></div></div><div class="card-b flush">' +
      o.lines.map(l=>{ const it = itemById(l.itemId); return '<div class="li" style="padding:7px 13px"><div class="tx"><b>' + l.qty + ' x ' + esc(it ? L(it.name) : "?") + '</b>' +
        (l.note ? '<span style="color:var(--amber)">' + esc(l.note) + '</span>' : '') + '</div><div class="end">' + eur(lineTotal(l)) + '</div></div>'; }).join("") +
      '</div></div>' : '') +
    '<div class="f2">' +
      '<div class="field"><label>' + esc(T("c_covers")) + '</label><input class="inp" type="number" min="0" name="covers" value="' + (t.covers || t.seats) + '"></div>' +
      '<div class="field"><label>' + esc(T("c_waiter")) + '</label><select class="inp" name="waiter"><option value="">-</option>' +
        DB.staff.filter(s=> s.active && (s.role==="cameriere"||s.role==="maitre")).map(s=>
        '<option value="' + s.id + '"' + (t.waiter === s.id ? " selected" : "") + '>' + esc(s.name) + '</option>').join("") + '</select></div>' +
    '</div>' +
    '<div class="field"><label>' + esc(T("c_status")) + '</label><div class="seg" style="display:flex;flex-wrap:wrap">' +
      TSTATES.map(s=> '<button type="button" data-st="' + s.k + '" class="' + (t.status === s.k ? "on" : "") + '">' + esc(T(s.t)) + '</button>').join("") + '</div></div>' +
    '<div class="field"><label>' + esc(T("c_notes")) + '</label><input class="inp" name="note" value="' + esc(t.note) + '"></div>' +
    '<label class="check"><input type="checkbox" name="setupDone"' + (t.setupDone ? " checked" : "") + '><span>' + esc(T("t_setup")) + ' ' + esc(T("c_done").toLowerCase()) + '</span></label>';

  const save1 = (w)=>{
    const f = readForm(w);
    const st = w.dataset.st || t.status;
    const patch = {covers:Number(f.covers)||0, waiter:f.waiter||"", note:f.note||"", setupDone:!!f.setupDone, status:st};
    if(st !== t.status && (st === "occupato" || st === "prenotato")) patch.since = new Date().toISOString();
    if(st === "libero" || st === "fuori"){ patch.covers = 0; patch.waiter = ""; patch.since = null; }
    setTable(id, patch);
    return patch;
  };

  const acts = [{label:T("c_cancel"), cls:"ghost"}];
  if(o){
    acts.push({label:T("o_order"), cls:"", run:(w)=>{ save1(w); orderSheet(o.id); return false; }});
    acts.push({label:T("o_pay"), cls:"ok", run:(w)=>{ save1(w); payOrder(o.id); return false; }});
  }else if(t.status !== "fuori"){
    acts.push({label:T("t_openorder"), cls:"pri", run:(w)=>{ save1(w); openOrderFor(id); return false; }});
  }
  acts.push({label:T("c_save"), cls:o ? "ghost" : "pri", run:(w)=>{ save1(w); refresh(); toast(T("c_save"), "ok"); }});

  modal({title:T("c_table") + " " + t.n, body:body, actions:acts, onOpen:(w)=>{
    w.dataset.st = t.status;
    $$("[data-st]", w).forEach(b=> b.onclick = ()=>{
      w.dataset.st = b.getAttribute("data-st");
      $$("[data-st]", w).forEach(x=> x.classList.toggle("on", x === b));
    });
  }});
}

/* trascinamento dei tavoli sulla piantina */
function enableDrag(){
  const fl = $("#floor"); if(!fl) return;
  let drag = null;
  fl.addEventListener("pointerdown", (e)=>{
    const b = e.target.closest("[data-tb]"); if(!b) return;
    const t = tableById(b.getAttribute("data-tb"));
    drag = {b:b, t:t, sx:e.clientX, sy:e.clientY, moved:false};
  });
  fl.addEventListener("pointermove", (e)=>{
    if(!drag) return;
    if(Math.abs(e.clientX - drag.sx) < 6 && Math.abs(e.clientY - drag.sy) < 6) return;
    drag.moved = true;
    drag.b.setPointerCapture && drag.b.setPointerCapture(e.pointerId);
    const r = fl.getBoundingClientRect();
    const dir = document.documentElement.dir === "rtl" ? -1 : 1;
    let x = ((e.clientX - r.left) / r.width) * 100;
    if(dir === -1) x = 100 - x;
    const y = ((e.clientY - r.top + fl.scrollTop) / r.height) * 100;
    drag.t.x = clamp(x - 3, 0, 92); drag.t.y = clamp(y - 4, 0, 88);
    drag.b.style.insetInlineStart = drag.t.x + "%";
    drag.b.style.top = drag.t.y + "%";
  });
  const stop = ()=>{ if(drag){ if(drag.moved){ save(); drag.b.dataset.moved = "1"; } drag = null; } };
  fl.addEventListener("pointerup", stop);
  fl.addEventListener("pointercancel", stop);
}
</script>

    '</button>';
  }).join("") + '</div>';

  const html =
    '<div class="card" style="margin-bottom:14px;background:linear-gradient(150deg,var(--brand),var(--brand-2));border:0;color:var(--on-brand)">' +
      '<div class="card-b" style="display:flex;align-items:center;gap:13px;padding:14px 16px">' +

        '<div style="min-width:0"><b style="font-size:17px;display:block">' + esc(st.name) + '</b>' +
          '<span style="font-size:12.5px;opacity:.85">' + esc(st.role) + ' &middot; ' +
          esc(isManager(st) ? T("au_mgr") : T("au_staff")) + ' &middot; ' + esc("al monitor da") + ' ' + since + ' min</span></div>' +

<script>

function openOrderFor(tableId){
  const t = tableById(tableId); if(!t) return;
  let o = orderOf(tableId);
  if(!o){
    o = {id:uid("or"), tableId:tableId, type:"sala", covers:t.covers || t.seats,
         waiter:(me() || {}).id || t.waiter || "",
         status:"aperto", opened:new Date().toISOString(), closed:null, date:today(),
         lines:[], pay:null, disc:0, total:null, note:""};
    DB.orders.push(o);
    setTable(tableId, {status:"occupato", orderId:o.id, covers:o.covers, since:t.since || new Date().toISOString()});
  }
  save();
  orderSheet(o.id);
}
