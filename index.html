        '<div class="card"><div class="card-b flush"><div class="list">' +
        (ms.length ? ms.map(m=>
          '<div class="li' + (m.on === false ? " done" : "") + '">' +
          '<span class="badge ' + g.cls + '">' + icon(g.k === "allerta" ? "warn" : "edit", 11) + '</span>' +
          '<div class="tx"><b>' + esc(L(m.name)) + '</b>' +
          '<span>' + LKEYS.filter(k=> m.name && m.name[k]).length + '/6 lingue' +
          (m.price ? ' &middot; +' + eur(m.price) : '') + '</span></div>' +
          '<div class="end">' +
            '<button class="btn sm ' + (m.on === false ? "ghost" : "ok") + '" data-mon="' + m.id + '">' +
              esc(m.on === false ? "spenta" : "attiva") + '</button>' +
            '<button class="btn ico sm ghost" data-med="' + m.id + '">' + icon("edit",12) + '</button>' +
          '</div></div>').join("")
          : '<div class="li"><div class="tx" style="color:var(--txt-3);font-size:13px">' + esc(T("c_none_yet")) + '</div></div>') +
        '</div></div></div>';
    }).join("");

  return {
    title:T("nav_mods"), sub:all.filter(m=> m.on !== false).length + " " + esc("voci in listino"),
    actions:'<button class="btn pri" data-mnw>' + icon("plus",15) + esc(T("c_new")) + '</button>',
    html:html,
    after:()=>{
      $$("[data-mon]").forEach(b=> b.onclick = ()=>{
        const m = modById(b.getAttribute("data-mon"));
        m.on = m.on === false; save(); refresh();
      });
      $$("[data-med]").forEach(b=> b.onclick = ()=> modSheet(b.getAttribute("data-med")));
      $("[data-mnw]").onclick = ()=> modSheet(null);
    }
  };
};

function modSheet(id){
  const m = id ? modById(id) : null;
  const body =
    mlFields("name", m ? m.name : null, T("c_name")) +
    '<div class="f2">' +
      '<div class="field"><label>' + esc("Gruppo") + '</label><select class="inp" name="group">' +
        MOD_GROUPS.map(g=> '<option value="' + g.k + '"' + (m && m.group === g.k ? " selected":"") + '>' + esc(T(g.t)) + '</option>').join("") + '</select></div>' +
      '<div class="field"><label>' + esc("Costo in piu") + '</label><input class="inp" type="number" step="0.5" min="0" name="price" value="' + (m ? m.price : 0) + '"></div>' +
    '</div>';
  const acts = [{label:T("c_cancel"), cls:"ghost"}];
  if(m) acts.push({label:T("c_del"), cls:"dang", run:()=> requireManager("Eliminare una modifica dal listino", ()=>{
    DB.mods = DB.mods.filter(x=> x.id !== id); save(); refresh(); })});
  acts.push({label:T("c_save"), cls:"pri", run:(w)=>{
    const f = readForm(w), name = readML(w, "name");
    if(!name.it){ toast(T("c_name"), "err"); return false; }
    const patch = {name:name, group:f.group, price:Number(f.price) || 0};
    if(m) Object.assign(m, patch);
    else DB.mods.push(Object.assign({id:uid("md"), on:true}, patch));
    save(); refresh(); toast(T("c_save"), "ok");
  }});
  modal({title:m ? L(m.name) : T("c_new") + " " + T("nav_mods").toLowerCase(), size:"wide", body:body, actions:acts});
}
</script>
<script>
/* ============================================================
   PARTE 17 — MAGAZZINO
   ============================================================ */
let STOCKTAB = "giacenze", STOCKZONE = "tutte";
const ZONES = ["tutte","frigo","freezer","dispensa","cantina","bar"];

VIEWS.stock = function(){
  const low = lowStock();
  const list = DB.inv.filter(i=> STOCKZONE === "tutte" || i.zone === STOCKZONE);
  const wasteMonth = DB.moves.filter(m=> m.type === "spreco" && m.date.slice(0,7) === today().slice(0,7));
  const wasteVal = sum(wasteMonth.map(m=>{ const i = invById(m.itemId); return i ? i.cost * m.qty : 0; }));

  const giacenze =
    '<div class="row" style="margin-bottom:12px">' +
      '<div class="seg">' + ZONES.map(z=> '<button class="' + (STOCKZONE===z?"on":"") + '" data-sz="' + z + '">' + esc(z === "tutte" ? T("c_all") : z) + '</button>').join("") + '</div>' +
    '</div>' +
    '<div class="scrollx"><table class="tbl"><thead><tr><th>' + esc(T("c_name")) + '</th><th>' + esc("Reparto") + '</th>' +
      '<th class="r">' + esc(T("s_stock")) + '</th><th style="width:120px">' + esc("Livello") + '</th>' +
      '<th class="r">' + esc(T("s_min")) + '</th><th class="r">' + esc(T("c_cost")) + '</th>' +
      '<th class="r">' + esc("Valore") + '</th><th></th></tr></thead><tbody>' +
      list.map(i=>{
        const crit = i.qty <= i.min, warn2 = i.qty <= i.min * 1.4;
        return '<tr><td><b>' + esc(i.name) + '</b>' + (crit ? ' <span class="badge r">' + esc(T("s_reorder")) + '</span>' : '') + '</td>' +
          '<td style="color:var(--txt-2)">' + esc(i.zone) + '</td>' +
          '<td class="r num"><b>' + num(i.qty,1) + '</b> <span style="color:var(--txt-3)">' + esc(i.unit) + '</span></td>' +
          '<td>' + bar(i.qty, i.par, crit ? "r" : warn2 ? "a" : "g") + '</td>' +
          '<td class="r num" style="color:var(--txt-2)">' + num(i.min,1) + '</td>' +
          '<td class="r num">' + eur(i.cost) + '</td>' +
          '<td class="r num">' + eur(i.qty * i.cost) + '</td>' +
          '<td class="r"><div class="row tight" style="flex-wrap:nowrap;justify-content:flex-end">' +
            '<button class="btn ico sm ghost" data-sin="' + i.id + '" title="' + esc(T("s_in")) + '">' + icon("down",12) + '</button>' +
            '<button class="btn ico sm ghost" data-sout="' + i.id + '" title="' + esc(T("s_out")) + '">' + icon("up",12) + '</button>' +
            '<button class="btn ico sm ghost" data-sed="' + i.id + '">' + icon("edit",12) + '</button>' +
          '</div></td></tr>';
      }).join("") + '</tbody></table></div>';

  const movimenti = DB.moves.length ? '<div class="scrollx"><table class="tbl"><thead><tr>' +
      '<th>' + esc(T("c_date")) + '</th><th>' + esc(T("c_name")) + '</th><th>' + esc("Tipo") + '</th>' +
      '<th class="r">' + esc(T("c_qty")) + '</th><th>' + esc(T("c_notes")) + '</th></tr></thead><tbody>' +
      DB.moves.slice(0,120).map(m=>{ const i = invById(m.itemId);
        const cls = m.type === "carico" ? "g" : m.type === "spreco" ? "r" : m.type === "rettifica" ? "v" : "a";
        return '<tr><td class="num" style="color:var(--txt-2)">' + esc(fmtDate(m.date.slice(0,10),{day:"2-digit",month:"2-digit"})) + ' ' + esc(m.date.slice(11,16)) + '</td>' +
          '<td><b>' + esc(i ? i.name : "?") + '</b></td>' +
          '<td><span class="badge ' + cls + '">' + esc(T(m.type === "carico" ? "s_in" : m.type === "scarico" ? "s_out" : m.type === "spreco" ? "s_waste" : "s_adjust")) + '</span></td>' +
          '<td class="r num">' + num(m.qty,2) + ' ' + esc(i ? i.unit : "") + '</td>' +
          '<td style="color:var(--txt-2)">' + esc(m.note) + '</td></tr>';
      }).join("") + '</tbody></table></div>' : empty("Nessun movimento registrato","stock");

  const riordino = low.length ? '<div class="list">' + low.map(i=>{
      const s = byId(DB.suppliers, i.supp);
      return '<div class="li"><div class="ic" style="background:var(--red-soft);color:var(--red)">' + icon("stock") + '</div>' +
        '<div class="tx"><b>' + esc(i.name) + '</b><span>' + num(i.qty,1) + ' ' + esc(i.unit) + ' ' + esc(T("c_of")) + ' ' + num(i.par,0) + ' &middot; ' + esc(s ? s.name : "-") + '</span></div>' +
        '<div class="end"><b class="num">' + esc("+" + num(i.par - i.qty,1)) + ' ' + esc(i.unit) + '</b>' +
        '<button class="btn sm ghost" data-sin="' + i.id + '">' + esc(T("s_in")) + '</button></div></div>';
    }).join("") + '</div>' : empty("Tutto sopra la scorta minima","check");

  const html =
    '<div class="grid g4">' +
      stat(T("s_value"), eur(stockValue()), DB.inv.length + " articoli") +
      stat(T("s_reorder"), low.length, low.length ? "sotto scorta minima" : "tutto a posto", low.length ? "" : "") +
      stat(T("s_waste") + " " + T("c_month").toLowerCase(), eur(wasteVal), wasteMonth.length + " registrazioni") +
      stat(T("s_movements"), DB.moves.length, "registrati") +
    '</div>' +
    '<div class="tabs mt">' +
      ['giacenze','riordino','movimenti'].map(t=> '<button class="' + (STOCKTAB===t?"on":"") + '" data-st2="' + t + '">' +
        esc(t === "giacenze" ? T("s_stock") : t === "riordino" ? T("s_reorder") : T("s_movements")) + '</button>').join("") + '</div>' +
    '<div class="mt">' + (STOCKTAB === "giacenze" ? giacenze : STOCKTAB === "riordino" ? riordino : movimenti) + '</div>';

  return {
    title:T("nav_stock"), sub:eur(stockValue()) + " " + T("s_value").toLowerCase(),
    actions:'<button class="btn ghost" data-swaste>' + icon("trash",15) + esc(T("s_waste")) + '</button>' +
            '<button class="btn ghost" data-snew>' + icon("plus",15) + esc(T("c_new")) + '</button>' +
            '<button class="btn pri" data-spo>' + icon("supp",15) + esc(T("s_po")) + '</button>',
    html:html,
    after:()=>{
      $$("[data-st2]").forEach(b=> b.onclick = ()=>{ STOCKTAB = b.getAttribute("data-st2"); refresh(); });
      $$("[data-sz]").forEach(b=> b.onclick = ()=>{ STOCKZONE = b.getAttribute("data-sz"); refresh(); });
      $$("[data-sin]").forEach(b=> b.onclick = ()=> moveSheet(b.getAttribute("data-sin"), "carico"));
      $$("[data-sout]").forEach(b=> b.onclick = ()=> moveSheet(b.getAttribute("data-sout"), "scarico"));
      $$("[data-sed]").forEach(b=> b.onclick = ()=> invSheet(b.getAttribute("data-sed")));
      $("[data-snew]").onclick = ()=> invSheet(null);
      $("[data-swaste]").onclick = ()=> moveSheet(null, "spreco");
      $("[data-spo]").onclick = poSheet;
    }
  };
};

function moveSheet(invId, type){
  const body =
    '<div class="field"><label>' + esc("Articolo") + '</label><select class="inp" name="invId">' +
      DB.inv.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(i=>
        '<option value="' + i.id + '"' + (i.id === invId ? " selected":"") + '>' + esc(i.name) + ' (' + num(i.qty,1) + ' ' + esc(i.unit) + ')</option>').join("") + '</select></div>' +
    '<div class="f2">' +
      '<div class="field"><label>' + esc("Tipo") + '</label><select class="inp" name="type">' +
        [["carico","s_in"],["scarico","s_out"],["spreco","s_waste"],["rettifica","s_adjust"]].map(t=>
          '<option value="' + t[0] + '"' + (t[0] === type ? " selected":"") + '>' + esc(T(t[1])) + '</option>').join("") + '</select></div>' +
      '<div class="field"><label>' + esc(T("c_qty")) + '</label><input class="inp" type="number" step="0.1" min="0" name="qty" value="1"></div>' +
    '</div>' +
    '<div class="field"><label>' + esc(T("c_notes")) + '</label><input class="inp" name="note" placeholder="' + esc("bolla 1234, scaduto, rotto, inventario") + '"></div>';
  modal({title:T("s_movements"), size:"slim", body:body, actions:[
    {label:T("c_cancel"), cls:"ghost"},
    {label:T("c_save"), cls:"pri", run:(w)=>{
      const f = readForm(w);
      if(!f.qty && f.type !== "rettifica"){ toast(T("c_qty"), "err"); return false; }
      stockMove(f.invId, f.type, f.qty, f.note);
      refresh(); toast(T("c_save"), "ok");
    }}
  ]});
}

function invSheet(id){
  const i = id ? invById(id) : null;
  const body =
    '<div class="field"><label>' + esc(T("c_name")) + '</label><input class="inp" name="name" value="' + esc(i ? i.name : "") + '"></div>' +
    '<div class="f3">' +
      '<div class="field"><label>' + esc("Unità") + '</label><input class="inp" name="unit" value="' + esc(i ? i.unit : "kg") + '"></div>' +
      '<div class="field"><label>' + esc("Reparto") + '</label><select class="inp" name="zone">' +
        ZONES.filter(z=>z!=="tutte").map(z=> '<option' + (i && i.zone === z ? " selected":"") + '>' + esc(z) + '</option>').join("") + '</select></div>' +
      '<div class="field"><label>' + esc(T("c_cost")) + '</label><input class="inp" type="number" step="0.01" name="cost" value="' + (i ? i.cost : 0) + '"></div>' +
    '</div>' +
    '<div class="f3">' +
      '<div class="field"><label>' + esc(T("s_stock")) + '</label><input class="inp" type="number" step="0.1" name="qty" value="' + (i ? i.qty : 0) + '"></div>' +
      '<div class="field"><label>' + esc(T("s_min")) + '</label><input class="inp" type="number" step="0.1" name="min" value="' + (i ? i.min : 0) + '"></div>' +
      '<div class="field"><label>' + esc(T("s_par")) + '</label><input class="inp" type="number" step="0.1" name="par" value="' + (i ? i.par : 0) + '"></div>' +
    '</div>' +
    '<div class="field"><label>' + esc(T("c_supplier")) + '</label><select class="inp" name="supp">' +
      DB.suppliers.map(s=> '<option value="' + s.id + '"' + (i && i.supp === s.id ? " selected":"") + '>' + esc(s.name) + '</option>').join("") + '</select></div>';
  const acts = [{label:T("c_cancel"), cls:"ghost"}];
  if(i) acts.push({label:T("c_del"), cls:"dang", run:()=>{ DB.inv = DB.inv.filter(x=> x.id !== id); save(); refresh(); }});
  acts.push({label:T("c_save"), cls:"pri", run:(w)=>{
    const f = readForm(w);
    if(!f.name){ toast(T("c_name"), "err"); return false; }
    const patch = {name:f.name, unit:f.unit, zone:f.zone, cost:Number(f.cost)||0,
      qty:Number(f.qty)||0, min:Number(f.min)||0, par:Number(f.par)||0, supp:f.supp};
    if(i) Object.assign(i, patch); else DB.inv.push(Object.assign({id:uid("in"), expiry:null}, patch));
    save(); refresh(); toast(T("c_save"), "ok");
  }});
  modal({title:i ? i.name : T("c_new") + " articolo", body:body, actions:acts});
}
</script>
<script>
/* --- ordine al fornitore, generato da quello che manca --- */
function poSheet(){
  const low = lowStock();
  const bySupp = {};
  low.forEach(i=>{ (bySupp[i.supp] = bySupp[i.supp] || []).push(i); });
  const supIds = Object.keys(bySupp);
  const body = supIds.length ? supIds.map(sid=>{
    const s = byId(DB.suppliers, sid) || {name:"?"};
    return '<div class="card" style="margin-bottom:12px"><div class="card-h" style="padding:10px 13px"><h3>' + esc(s.name) + '</h3>' +
      '<div class="sp"><span class="badge n">' + esc(s.days || "") + '</span>' +
      '<button class="btn sm ghost" data-posend="' + sid + '">' + icon("print",12) + esc(T("c_print")) + '</button></div></div>' +
      '<div class="card-b flush"><div class="list">' + bySupp[sid].map(i=>
        '<div class="li" style="padding:7px 13px"><div class="tx"><b>' + esc(i.name) + '</b>' +
        '<span>' + esc(T("s_stock")) + ' ' + num(i.qty,1) + ' ' + esc(i.unit) + ' &middot; ' + esc(T("s_par")) + ' ' + num(i.par,0) + '</span></div>' +
        '<div class="end"><input class="inp sm num" style="width:88px;text-align:end" data-poq="' + i.id + '" type="number" step="0.5" value="' + num(Math.ceil(i.par - i.qty),1) + '">' +
        '<span style="color:var(--txt-2);font-size:12.5px;min-width:32px">' + esc(i.unit) + '</span></div></div>').join("") + '</div></div></div>';
  }).join("") : empty("Non serve ordinare niente: tutto sopra la scorta minima","check");

  modal({title:T("s_po"), size:"wide", body:body, actions:[
    {label:T("c_close"), cls:"ghost"},
    supIds.length ? {label:"Registra tutto come " + T("s_in").toLowerCase(), cls:"pri", run:(w)=>{
      let n = 0;
      $$("[data-poq]", w).forEach(inp=>{
        const q = Number(inp.value) || 0;
        if(q > 0){ stockMove(inp.getAttribute("data-poq"), "carico", q, "ordine fornitore"); n++; }
      });
      refresh(); toast(n + " articoli caricati", "ok");
    }} : {label:T("c_close"), cls:"pri"}
  ], onOpen:(w)=>{
    $$("[data-posend]", w).forEach(b=> b.onclick = ()=>{
      const sid = b.getAttribute("data-posend");
      const s = byId(DB.suppliers, sid);
      const lines = bySupp[sid].map(i=>{
        const inp = $('[data-poq="' + i.id + '"]', w);
        return {name:i.name, qty:Number(inp.value)||0, unit:i.unit};
      }).filter(l=> l.qty > 0);
      printPO(s, lines);
    });
  }});
}
function printPO(s, lines){
  const b = DB.meta.biz;
  const w = window.open("", "_blank", "width=680,height=860");
  if(!w){ toast("Consenti le finestre popup per stampare","err"); return; }
  w.document.write('<!doctype html><meta charset="utf-8"><title>Ordine ' + esc(s.name) + '</title>' +
    '<style>body{font-family:system-ui,sans-serif;padding:28px;font-size:13px;color:#111}' +
    'h1{font-size:19px;margin:0 0 4px}table{width:100%;border-collapse:collapse;margin-top:18px}' +
    'th,td{border-bottom:1px solid #ddd;padding:7px 4px;text-align:left}th{font-size:11px;text-transform:uppercase;color:#666}' +
    'td:last-child,th:last-child{text-align:right}.h{color:#555;font-size:12px;line-height:1.6}</style>' +
    '<h1>' + esc(T("s_po")) + '</h1>' +
    '<div class="h"><b>' + esc(b.name) + '</b> &middot; ' + esc(b.addr) + ', ' + esc(b.city) + ' &middot; ' + esc(b.phone) + '<br>' +
    'Fornitore: <b>' + esc(s.name) + '</b> &middot; ' + esc(s.contact || "") + ' &middot; ' + esc(s.phone || "") + '<br>' +
    'Data: ' + esc(fmtDate(today())) + ' &middot; Consegna: ' + esc(s.days || "") + '</div>' +
    '<table><thead><tr><th>Articolo</th><th>Quantità</th></tr></thead><tbody>' +
    lines.map(l=> '<tr><td>' + esc(l.name) + '</td><td>' + num(l.qty,1) + ' ' + esc(l.unit) + '</td></tr>').join("") +
    '</tbody></table><p style="margin-top:26px;color:#666;font-size:12px">Firma ricevimento merce: ______________________</p>');
  w.document.close(); setTimeout(()=> w.print(), 260);
}

/* ============================================================
   PARTE 18 — FORNITORI
   ============================================================ */
VIEWS.supp = function(){
  const html = '<div class="grid gauto-l">' + DB.suppliers.map(s=>{
    const items = DB.inv.filter(i=> i.supp === s.id);
    const lows = items.filter(i=> i.qty <= i.min);
    return '<div class="card"><div class="card-h"><h3>' + esc(s.name) + '</h3>' +
      '<div class="sp">' + (lows.length ? '<span class="badge r">' + lows.length + ' ' + esc(T("s_reorder").toLowerCase()) + '</span>' : '<span class="badge g">ok</span>') + '</div></div>' +
      '<div class="card-b">' +
        '<div style="font-size:12.5px;color:var(--txt-2);line-height:1.8">' +
          '<div><b style="color:var(--txt)">' + esc(s.cat) + '</b></div>' +
          '<div>' + esc(s.contact) + ' &middot; ' + esc(s.phone) + '</div>' +
          '<div>' + esc(s.email) + '</div>' +
          '<div>' + esc("Consegne") + ': ' + esc(s.days) + ' &middot; ' + esc("ordini entro") + ' ' + esc(s.cutoff) + '</div>' +
          '<div>' + items.length + ' ' + esc("articoli") + ' &middot; ' + eur(sum(items.map(i=> i.qty*i.cost))) + ' ' + esc("a magazzino") + '</div>' +
        '</div>' +
        '<div class="row mt-s"><a class="btn sm ghost" href="tel:' + esc(s.phone.replace(/\s/g,"")) + '">' + esc(T("c_phone")) + '</a>' +
        '<button class="btn sm ghost" data-se="' + s.id + '">' + icon("edit",12) + esc(T("c_edit")) + '</button></div>' +
      '</div></div>';
  }).join("") + '</div>';
  return {
    title:T("nav_supp"), sub:DB.suppliers.length + " " + T("nav_supp").toLowerCase(),
    actions:'<button class="btn pri" data-sn>' + icon("plus",15) + esc(T("c_new")) + '</button>',
    html:html,
    after:()=>{
      $$("[data-se]").forEach(b=> b.onclick = ()=> suppSheet(b.getAttribute("data-se")));
      $("[data-sn]").onclick = ()=> suppSheet(null);
    }
  };
};
function suppSheet(id){
  const s = id ? byId(DB.suppliers, id) : null;
  const F = (n,l,v,t)=> '<div class="field"><label>' + esc(l) + '</label><input class="inp" name="' + n + '" type="' + (t||"text") + '" value="' + esc(v||"") + '"></div>';
  const body = F("name", T("c_name"), s&&s.name) + F("cat", T("c_category"), s&&s.cat) +
    '<div class="f2">' + F("contact","Referente", s&&s.contact) + F("phone", T("c_phone"), s&&s.phone, "tel") + '</div>' +
    F("email", T("c_email"), s&&s.email, "email") +
    '<div class="f2">' + F("days","Giorni di consegna", s&&s.days) + F("cutoff","Ordini entro", s&&s.cutoff) + '</div>';
  const acts = [{label:T("c_cancel"), cls:"ghost"}];
  if(s) acts.push({label:T("c_del"), cls:"dang", run:()=>{ DB.suppliers = DB.suppliers.filter(x=>x.id!==id); save(); refresh(); }});
  acts.push({label:T("c_save"), cls:"pri", run:(w)=>{
    const f = readForm(w);
    if(!f.name){ toast(T("c_name"),"err"); return false; }
    if(s) Object.assign(s, f); else DB.suppliers.push(Object.assign({id:uid("su")}, f));
    save(); refresh(); toast(T("c_save"),"ok");
  }});
  modal({title:s ? s.name : T("c_new") + " " + T("c_supplier").toLowerCase(), body:body, actions:acts});
}
</script>
<script>
/* ============================================================
   PARTE 19 — ANAGRAFICA PERSONALE
   ============================================================ */
const ROLES = ["direzione","maitre","cameriere","chef","sous chef","cuoco","pizzaiolo","pasticceria","barista","barman","lavapiatti","fattorino"];
const CONTRACTS = [["full","p_full"],["part","p_part"],["extra","p_extra"]];

VIEWS.team = function(){
  const ws = weekStart(today());
  const active = DB.staff.filter(s=> s.active);
  const byContract = CONTRACTS.map(c=> ({k:c[0], t:c[1], n:active.filter(s=> s.contract === c[0]).length}));
  const totH = sum(active.map(s=> s.hweek));
  const cost = weekLabourCost(ws);

  const html =
    '<div class="grid g4">' +
      stat("In organico", active.length, DB.staff.length + " registrati") +
      byContract.map(c=> stat(T(c.t), c.n, pct(active.length ? (c.n/active.length)*100 : 0))).join("") +
    '</div>' +
    '<div class="grid g3 mt">' +
      stat(T("p_hweek"), num(totH,0) + " h", "contrattuali") +
      stat("Ore pianificate", num(sum(active.map(s=> weekHours(s.id, ws))),1) + " h", "questa settimana") +
      stat(T("p_labcost"), eur(cost), "settimana in corso") +
    '</div>' +
    card("",
      '<div class="scrollx"><table class="tbl"><thead><tr><th>' + esc(T("c_name")) + '</th><th>' + esc(T("c_role")) + '</th>' +
      '<th>' + esc(T("p_contract")) + '</th><th class="r">' + esc(T("p_hweek")) + '</th>' +
      '<th class="r">' + esc("Pianificate") + '</th><th class="r">' + esc(T("p_rate")) + '</th>' +
      '<th>' + esc("Lingue") + '</th><th></th></tr></thead><tbody>' +
      DB.staff.map(s=>{
        const ph = weekHours(s.id, ws);
        const over = ph > s.hweek + 0.5;
        return '<tr' + (s.active ? '' : ' style="opacity:.45"') + '><td><div class="row tight" style="flex-wrap:nowrap">' +
          '<span class="avat sm">' + esc(initials(s.name)) + '</span><b>' + esc(s.name) + '</b></div></td>' +
          '<td style="color:var(--txt-2)">' + esc(s.role) + '</td>' +
          '<td><span class="badge ' + (s.contract === "full" ? "b" : s.contract === "part" ? "v" : "n") + '">' +
            esc(T(s.contract === "full" ? "p_full" : s.contract === "part" ? "p_part" : "p_extra")) + '</span></td>' +
          '<td class="r num">' + s.hweek + ' h</td>' +
          '<td class="r num" style="color:var(--' + (over ? "red" : "txt") + ')">' + num(ph,1) + ' h</td>' +
          '<td class="r num">' + eur(s.rate) + '</td>' +
          '<td><div class="row tight">' + (s.langs||[]).map(lk=> flag(lk,11)).join("") + '</div></td>' +
          '<td class="r"><button class="btn ico sm ghost" data-te="' + s.id + '">' + icon("edit",12) + '</button></td></tr>';
      }).join("") + '</tbody></table></div>', '', "mt flush");

  return {
    title:T("nav_team"), sub:active.length + " " + T("c_active").toLowerCase() + " &middot; " + eur(cost) + " " + T("p_labcost").toLowerCase(),
    actions:'<button class="btn ghost" data-go="shifts">' + icon("clock",15) + esc(T("nav_shifts")) + '</button>' +
            '<button class="btn pri" data-tn>' + icon("plus",15) + esc(T("c_new")) + '</button>',
    html:html,
    after:()=>{
      $$("[data-te]").forEach(b=> b.onclick = ()=> staffSheet(b.getAttribute("data-te")));
      $("[data-tn]").onclick = ()=> staffSheet(null);
    }
  };
};

function staffSheet(id){
  /* i codici e i livelli li tocca solo chi ne ha titolo */
  if(!meIsManager()){
    requireManager("Aprire la scheda di una persona: ci sono il codice e il livello di accesso",
      ()=> staffSheet(id));
    return;
  }
  const s = id ? staffById(id) : null;
  const body =
    '<div class="f2">' +
      '<div class="field"><label>' + esc(T("c_name")) + '</label><input class="inp" name="name" value="' + esc(s ? s.name : "") + '"></div>' +
      '<div class="field"><label>' + esc(T("c_role")) + '</label><select class="inp" name="role">' +
        ROLES.map(r=> '<option' + (s && s.role === r ? " selected":"") + '>' + esc(r) + '</option>').join("") + '</select></div>' +
    '</div>' +
    '<div class="f3">' +
      '<div class="field"><label>' + esc(T("p_contract")) + '</label><select class="inp" name="contract">' +
        CONTRACTS.map(c=> '<option value="' + c[0] + '"' + (s && s.contract === c[0] ? " selected":"") + '>' + esc(T(c[1])) + '</option>').join("") + '</select></div>' +
      '<div class="field"><label>' + esc(T("p_hweek")) + '</label><input class="inp" type="number" name="hweek" value="' + (s ? s.hweek : 40) + '"></div>' +
      '<div class="field"><label>' + esc(T("p_rate")) + '</label><input class="inp" type="number" step="0.5" name="rate" value="' + (s ? s.rate : 11) + '"></div>' +
    '</div>' +
    '<div class="f2">' +
      '<div class="field"><label>' + esc(T("c_phone")) + '</label><input class="inp" name="phone" value="' + esc(s ? s.phone : "") + '"></div>' +
      '<div class="field"><label>' + esc("Assunto il") + '</label><input class="inp" type="date" name="hired" value="' + (s ? s.hired : today()) + '"></div>' +
    '</div>' +
    '<div class="f2">' +
      '<div class="field"><label>' + esc(T("au_pin")) + ' ' + esc("(quattro cifre)") + '</label>' +
        '<input class="inp num" name="pin" inputmode="numeric" maxlength="4" value="' + esc(s ? s.pin : "") + '" placeholder="0000"></div>' +
      '<div class="field"><label>' + esc("Livello") + '</label><select class="inp" name="level">' +
        '<option value="operatore"' + (s && s.level === "operatore" ? " selected":"") + '>' + esc(T("au_staff")) + '</option>' +
        '<option value="responsabile"' + (s && s.level === "responsabile" ? " selected":"") + '>' + esc(T("au_mgr")) + ' - ' + esc("accede a tutto") + '</option>' +
      '</select></div>' +
    '</div>' +
    '<div class="field"><label>' + esc("Lingue parlate") + '</label><div class="row tight">' +
      LKEYS.map(lk=> '<label class="check" style="padding:3px 0;margin-inline-end:12px"><input type="checkbox" name="lg_' + lk + '"' +
        (s && (s.langs||[]).includes(lk) ? " checked":"") + '><span style="display:flex;align-items:center;gap:5px;font-size:12.5px">' +
        flag(lk,11) + esc(LANGS[lk].native) + '</span></label>').join("") + '</div></div>' +
    '<div class="field"><label>' + esc(T("c_notes")) + '</label><textarea class="inp" name="notes" style="min-height:56px">' + esc(s ? s.notes : "") + '</textarea></div>' +
    '<label class="check"><input type="checkbox" name="active"' + (!s || s.active ? " checked":"") + '><span>' + esc(T("c_active")) + '</span></label>';
  const acts = [{label:T("c_cancel"), cls:"ghost"}];
  if(s) acts.push({label:T("c_del"), cls:"dang", run:()=> confirmBox("Eliminare " + s.name + "? Anche i suoi turni verranno rimossi.", ()=>{
    DB.staff = DB.staff.filter(x=> x.id !== id);
    DB.shifts = DB.shifts.filter(x=> x.staffId !== id);
    save(); refresh(); }, true)});
  acts.push({label:T("c_save"), cls:"pri", run:(w)=>{
    const f = readForm(w);
    if(!f.name){ toast(T("c_name"),"err"); return false; }
    const langs = LKEYS.filter(lk=> f["lg_" + lk]);
    const pin = String(f.pin || "").replace(/\D/g, "").slice(0, 4);
    if(pin && DB.staff.some(x=> x.pin === pin && (!s || x.id !== s.id))){
      toast("Questo codice è già di un'altra persona", "err"); return false;
    }
    const patch = {name:f.name, role:f.role, contract:f.contract, hweek:Number(f.hweek)||0,
      rate:Number(f.rate)||0, phone:f.phone, hired:f.hired, notes:f.notes, langs:langs, active:!!f.active,
      pin:pin, level:f.level || "operatore"};
    if(s) Object.assign(s, patch); else DB.staff.push(Object.assign({id:uid("st")}, patch));
    save(); refresh(); toast(T("c_save"),"ok");
  }});
  modal({title:s ? s.name : T("c_new") + " " + T("nav_staff").toLowerCase(), size:"wide", body:body, actions:acts});
}
</script>
<script>
/* ============================================================
   PARTE 20 — TURNI, ORARI E PRESENZE
   ============================================================ */
let WEEK = null;
VIEWS.shifts = function(){
  const ws = WEEK || weekStart(today());
  const days = Array.from({length:7}, (_,i)=> addDays(ws,i));
  const staff = DB.staff.filter(s=> s.active);
  const cost = weekLabourCost(ws);
  const totH = sum(staff.map(s=> weekHours(s.id, ws)));
  const d = today();
  const clockToday = DB.clock.filter(c=> c.date === d);

  const planTable =
    '<div class="scrollx"><table class="plan"><thead><tr><th>' + esc(T("nav_staff")) + '</th>' +
      days.map(dd=> '<th' + (dd === d ? ' class="oggi"' : '') + '>' + esc(fmtDate(dd,{weekday:"short"})) + '<br><span style="font-weight:500;opacity:.7">' + esc(fmtDate(dd,{day:"2-digit",month:"2-digit"})) + '</span></th>').join("") +
      '<th class="r">' + esc(T("c_hours")) + '</th></tr></thead><tbody>' +
      staff.map(s=>{
        const h = weekHours(s.id, ws);
        const over = h > s.hweek + 0.5;
        return '<tr><td><div class="row tight" style="flex-wrap:nowrap"><span class="avat sm">' + esc(initials(s.name)) + '</span>' +
          '<div style="min-width:0"><b style="font-size:12.5px;display:block;line-height:1.2">' + esc(s.name) + '</b>' +
          '<span style="font-size:11px;color:var(--txt-2)">' + esc(s.role) + ' &middot; ' + esc(T(s.contract === "full" ? "p_full" : s.contract === "part" ? "p_part" : "p_extra")) + '</span></div></div></td>' +
          days.map(dd=>{
            const sh = DB.shifts.filter(x=> x.staffId === s.id && x.date === dd);
            return '<td' + (dd === d ? ' class="oggi"' : '') + '>' +
              sh.map(x=> '<button class="sh ' + esc(x.role) + '" data-sh="' + x.id + '">' + esc(x.start + "-" + x.end) +
                '<small>' + num(shiftHours(x),1) + ' h' + (x.brk ? " (-" + x.brk + "')" : "") + '</small></button>').join("") +
              '<button class="addsh" data-sha="' + s.id + '|' + dd + '">+</button></td>';
          }).join("") +
          '<td class="r"><b class="num" style="color:var(--' + (over ? "red" : h < s.hweek - 4 ? "amber" : "green") + ')">' + num(h,1) + '</b>' +
          '<div style="font-size:10.5px;color:var(--txt-3)">' + esc(T("c_of")) + ' ' + s.hweek + '</div></td></tr>';
      }).join("") + '</tbody></table></div>';

  const presenze = staff.map(s=>{
    const c = clockToday.find(x=> x.staffId === s.id);
    const inShift = shiftsOf(d).some(x=> x.staffId === s.id);
    if(!inShift && !c) return "";
    return '<div class="li" style="padding-inline:0"><span class="avat">' + esc(initials(s.name)) + '</span>' +
      '<div class="tx"><b>' + esc(s.name) + '</b><span>' + esc(s.role) +
      (c && c.in ? ' &middot; ' + esc(T("p_clockin")) + ' ' + esc(c.in) : '') +
      (c && c.out ? ' &middot; ' + esc(T("p_clockout")) + ' ' + esc(c.out) : '') +
      (c && c.in && c.out ? ' &middot; ' + num(shiftMinutes(c.in, c.out, 0)/60, 1) + ' h' : '') + '</span></div>' +
      '<div class="end">' +
        (!c || !c.in ? '<button class="btn sm ok" data-ci="' + s.id + '">' + esc(T("p_clockin")) + '</button>'
         : !c.out ? '<button class="btn sm warn" data-co="' + s.id + '">' + esc(T("p_clockout")) + '</button>'
         : '<span class="badge g">' + icon("check",11) + '</span>') +
      '</div></div>';
  }).join("");

  const html =
    '<div class="row" style="margin-bottom:14px">' +
      '<button class="btn ico ghost" data-wk="-7">&#8249;</button>' +
      '<b style="font-size:14px">' + esc(fmtDate(ws,{day:"numeric",month:"short"})) + ' - ' + esc(fmtDate(days[6],{day:"numeric",month:"short",year:"numeric"})) + '</b>' +
      '<button class="btn ico ghost" data-wk="7">&#8250;</button>' +
      '<button class="btn ghost sm" data-wk="0">' + esc(T("c_week")) + ' ' + esc(T("c_today").toLowerCase()) + '</button>' +
      '<div class="spacer"></div>' +
      '<span class="badge b">' + num(totH,1) + ' h</span><span class="badge a">' + eur(cost) + '</span>' +
    '</div>' +
    '<div class="grid g4" style="margin-bottom:14px">' +
      stat("Ore pianificate", num(totH,1) + " h", "settimana") +
      stat(T("p_labcost"), eur(cost), "lordo stimato") +
      stat("Turni", DB.shifts.filter(x=> days.includes(x.date)).length, "in settimana") +
      stat("In turno oggi", shiftsOf(d).length, fmtDate(d,{weekday:"long"})) +
    '</div>' +
    planTable +
    '<div class="legend mt"><span><i style="border-color:var(--blue)"></i>Sala</span><span><i style="border-color:var(--red)"></i>Cucina</span>' +
      '<span><i style="border-color:var(--violet)"></i>Bar</span><span><i style="border-color:var(--amber)"></i>Direzione</span></div>' +
    card(T("p_present") + " &middot; " + fmtDate(d,{weekday:"long",day:"numeric",month:"long"}),
      presenze ? '<div class="list">' + presenze + '</div>' : empty("Nessuno in turno oggi","clock"), '', "mt flush");

  return {
    title:T("nav_shifts"), sub:num(totH,1) + " h &middot; " + eur(cost),
    actions:'<button class="btn ghost" data-copyw>' + icon("cal",15) + esc("Copia settimana") + '</button>' +
            '<button class="btn ghost" onclick="window.print()">' + icon("print",15) + esc(T("c_print")) + '</button>',
    html:html,
    after:()=>{
      $$("[data-wk]").forEach(b=> b.onclick = ()=>{
        const v = Number(b.getAttribute("data-wk"));
        WEEK = v === 0 ? weekStart(today()) : addDays(ws, v);
        refresh();
      });
      $$("[data-sh]").forEach(b=> b.onclick = ()=> shiftSheet(b.getAttribute("data-sh")));
      $$("[data-sha]").forEach(b=> b.onclick = ()=>{
        const [sid, dd] = b.getAttribute("data-sha").split("|");
        shiftSheet(null, sid, dd);
      });
      $$("[data-ci]").forEach(b=> b.onclick = ()=>{
        DB.clock.push({id:uid("cl"), staffId:b.getAttribute("data-ci"), date:d, in:nowHM(), out:null});
        save(); refresh(); toast(T("p_clockin"), "ok");
      });
      $$("[data-co]").forEach(b=> b.onclick = ()=>{
        const c = DB.clock.find(x=> x.date === d && x.staffId === b.getAttribute("data-co") && !x.out);
        if(c){ c.out = nowHM(); save(); refresh(); toast(T("p_clockout"), "ok"); }
      });
      $("[data-copyw]").onclick = ()=> confirmBox("Copiare i turni di questa settimana su quella successiva?", ()=>{
        const next = addDays(ws, 7);
        DB.shifts.filter(x=> days.includes(x.date)).forEach(x=>{
          const off = days.indexOf(x.date);
          DB.shifts.push(Object.assign({}, x, {id:uid("sh"), date:addDays(next, off)}));
        });
        save(); WEEK = next; refresh(); toast("Settimana copiata", "ok");
      });
    }
  };
};

function shiftSheet(id, staffId, date){
  const s = id ? byId(DB.shifts, id) : null;
  const body =
    '<div class="f2">' +
      '<div class="field"><label>' + esc(T("nav_staff")) + '</label><select class="inp" name="staffId">' +
        DB.staff.filter(x=> x.active).map(x=> '<option value="' + x.id + '"' + ((s ? s.staffId : staffId) === x.id ? " selected":"") + '>' + esc(x.name) + '</option>').join("") + '</select></div>' +
      '<div class="field"><label>' + esc(T("c_date")) + '</label><input class="inp" type="date" name="date" value="' + (s ? s.date : date) + '"></div>' +
    '</div>' +
    '<div class="f3">' +
      '<div class="field"><label>' + esc(T("p_clockin")) + '</label><input class="inp" type="time" name="start" value="' + (s ? s.start : "18:30") + '"></div>' +
      '<div class="field"><label>' + esc(T("p_clockout")) + '</label><input class="inp" type="time" name="end" value="' + (s ? s.end : "23:30") + '"></div>' +
      '<div class="field"><label>' + esc(T("p_break")) + ' (min)</label><input class="inp" type="number" name="brk" value="' + (s ? s.brk : 30) + '"></div>' +
    '</div>' +
    '<div class="field"><label>' + esc("Reparto") + '</label><select class="inp" name="role">' +
      ["sala","cucina","bar","direzione","riposo"].map(r=> '<option' + (s && s.role === r ? " selected":"") + '>' + esc(r) + '</option>').join("") + '</select></div>' +
    '<div class="field"><label>' + esc(T("c_notes")) + '</label><input class="inp" name="note" value="' + esc(s ? s.note : "") + '"></div>';
  const acts = [{label:T("c_cancel"), cls:"ghost"}];
  if(s) acts.push({label:T("c_del"), cls:"dang", run:()=>{ DB.shifts = DB.shifts.filter(x=> x.id !== id); save(); refresh(); }});
  acts.push({label:T("c_save"), cls:"pri", run:(w)=>{
    const f = readForm(w);
    const patch = {staffId:f.staffId, date:f.date, start:f.start, end:f.end, brk:Number(f.brk)||0, role:f.role, note:f.note};
    if(s) Object.assign(s, patch); else DB.shifts.push(Object.assign({id:uid("sh")}, patch));
    save(); refresh(); toast(T("c_save"),"ok");
  }});
  modal({title:T("p_shift"), size:"slim", body:body, actions:acts});
}
</script>
<script>
/* ============================================================
   PARTE 21 — COMPORTAMENTO E SEQUENZA DI SERVIZIO
   ============================================================ */
let CONDTAB = "conduct", CONDLANG = null;
const CONDSETS = {
  conduct:{t:"nav_conduct", ic:"heart", data:()=> SEED_CONDUCT,
    sub:{it:"Le regole valide per tutti, sala e cucina. Si leggono al primo giorno e si ripassano al briefing.",
         en:"Rules for everyone, floor and kitchen. Read on day one, revisited at the briefing.",
         fr:"Regles pour tous, salle et cuisine.", es:"Reglas para todos, sala y cocina.",
         de:"Regeln fur alle, Service und Kuche.", ar:"قواعد للجميع في القاعة والمطبخ."}},
  service:{t:"Sequenza di servizio", ic:"table", data:()=> SEED_SERVICE,
    sub:{it:"I passaggi del servizio perfetto, dall'accoglienza al saluto finale.",
         en:"The steps of perfect service, from welcome to farewell.",
         fr:"Les etapes du service parfait.", es:"Los pasos del servicio perfecto.",
         de:"Die Schritte des perfekten Service.", ar:"خطوات الخدمة المثالية من الترحيب إلى الوداع."}},
  mise:{t:"t_setup", ic:"check", data:()=> SEED_MISE,
    sub:{it:"Come si sistema un tavolo, ogni giorno prima del servizio.",
         en:"How a table is set, every day before service.",
         fr:"Comment dresser une table chaque jour.", es:"Como se monta una mesa cada dia.",
         de:"Wie ein Tisch taglich eingedeckt wird.", ar:"كيفية تجهيز الطاولة كل يوم قبل الخدمة."}},
  open:{t:"Apertura", ic:"sun", data:()=> SEED_OPEN,
    sub:{it:"Cosa si fa prima di aprire le porte.", en:"What to do before opening the doors.",
         fr:"Avant d'ouvrir les portes.", es:"Antes de abrir las puertas.",
         de:"Vor dem Offnen der Turen.", ar:"ما يجب فعله قبل فتح الأبواب."}},
  close:{t:"Chiusura", ic:"clock", data:()=> SEED_CLOSE,
    sub:{it:"Cosa si fa quando esce l'ultimo ospite.", en:"What to do when the last guest leaves.",
         fr:"Quand le dernier client part.", es:"Cuando sale el ultimo cliente.",
         de:"Wenn der letzte Gast geht.", ar:"عندما يغادر آخر ضيف."}}
};

VIEWS.conduct = function(){
  const set = CONDSETS[CONDTAB];
  const lk = CONDLANG || LANG;
  const rows = set.data();
  const prev = LANG; LANG = lk;
  const listHtml = '<ol class="list" dir="' + LANGS[lk].dir + '">' + rows.map((r,i)=>
    '<li class="li"><span class="avat sm" style="background:var(--brand-soft);color:var(--brand)">' + (i+1) + '</span>' +
    '<div class="tx"><b style="font-weight:550;font-size:14px;white-space:normal">' + esc(L(r)) + '</b></div></li>').join("") + '</ol>';
  const subTxt = set.sub[lk] || set.sub.it;
  LANG = prev;

  const html =
    '<div class="tabs" style="margin-bottom:14px">' + Object.keys(CONDSETS).map(k=>
      '<button class="' + (CONDTAB === k ? "on":"") + '" data-ct="' + k + '">' +
      esc(CONDSETS[k].t.startsWith("nav_") || CONDSETS[k].t.startsWith("t_") ? T(CONDSETS[k].t) : CONDSETS[k].t) + '</button>').join("") + '</div>' +
    '<div class="row" style="margin-bottom:14px">' +
      LKEYS.map(k=> '<button class="btn sm ' + (k === lk ? "pri" : "ghost") + '" data-cl="' + k + '">' +
        flag(k,12) + '<span style="margin-inline-start:6px">' + esc(LANGS[k].code) + '</span></button>').join("") +
      '<div class="spacer"></div>' +
      '<span class="badge n">' + rows.length + ' ' + esc("punti") + '</span>' +
    '</div>' +
    '<p style="font-size:14px;color:var(--txt-2);margin-bottom:14px;max-width:720px" dir="' + LANGS[lk].dir + '">' + esc(subTxt) + '</p>' +
    card("", listHtml, '', "flush") +
    '<div class="card mt" style="background:var(--brand-soft);border-color:transparent"><div class="card-b">' +
      '<b style="font-size:13.5px;color:var(--brand)">' + esc("Come si usa") + '</b>' +
      '<p style="font-size:13.5px;color:var(--txt-2);margin-top:6px;line-height:1.65">' +
      esc("Stampa la lista nella lingua del tuo collaboratore e appendila nello spogliatoio. Al briefing del giorno si ripassano due punti, non tutti: così restano in testa. Chi entra nuovo firma la lista il primo giorno.") +
      '</p></div></div>';

  return {
    title:CONDTAB === "conduct" ? T("nav_conduct") : CONDTAB === "mise" ? T("t_setup") : set.t,
    sub:LANGS[lk].native + " &middot; " + rows.length + " punti",
    actions:'<button class="btn ghost" data-cprint>' + icon("print",15) + esc(T("c_print")) + '</button>' +
            '<button class="btn pri" data-go="briefing">' + icon("brief",15) + esc(T("nav_briefing")) + '</button>',
    html:html,
    after:()=>{
      $$("[data-ct]").forEach(b=> b.onclick = ()=>{ CONDTAB = b.getAttribute("data-ct"); refresh(); });
      $$("[data-cl]").forEach(b=> b.onclick = ()=>{ CONDLANG = b.getAttribute("data-cl"); refresh(); });
      $("[data-cprint]").onclick = ()=> printRules(CONDTAB, lk);
    }
  };
};

function printRules(setKey, lk){
  const set = CONDSETS[setKey];
  const prev = LANG; LANG = lk;
  const rows = set.data().map((r,i)=> '<li><b>' + (i+1) + '.</b> ' + esc(L(r)) + '</li>').join("");

  const sub = set.sub[lk] || set.sub.it;

  const w = window.open("", "_blank", "width=760,height=980");

    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+Arabic:wght@400;600&display=swap">' +
    '<style>body{font-family:Inter,"Noto Sans Arabic",system-ui,sans-serif;padding:26mm 22mm;color:#111;font-size:14px;line-height:1.6}' +
    'h1{font-size:26px;margin:0 0 4px}p.s{color:#666;margin:0 0 22px;font-size:14px}' +
    'ol{list-style:none;padding:0;counter-reset:n}li{padding:9px 0;border-bottom:1px solid #eee}' +
    'li b{color:#B4451F;margin-inline-end:7px}.f{margin-top:28px;font-size:12px;color:#777;border-top:1px solid #ddd;padding-top:12px}' +
    '@page{size:A4;margin:0}</style>' +
    '<div dir="' + LANGS[lk].dir + '"><h1>' + esc(title) + '</h1><p class="s">' + esc(DB.meta.biz.name) + ' &middot; ' + esc(sub) + '</p>' +
    '<ol>' + rows + '</ol>' +
    '<div class="f">' + esc("Letto e compreso") + ': ______________________  ' + esc(T("c_date")) + ': ____/____/________</div></div>');
  w.document.close(); setTimeout(()=> w.print(), 400);
}
</script>
<script>
/* ============================================================
   PARTE 22 — HOTEL PARTNER
   ============================================================ */
function hoTotal(h){
  const hotel = hotelById(h.hotelId);
  const gross = sum((h.lines||[]).map(l=>{ const it = itemById(l.itemId); return it ? it.price * l.qty : 0; }));
  const disc = hotel ? (hotel.disc || 0) : 0;
  return gross * (1 - disc/100);
}
const HO_STATES = ["confermato","in preparazione","pronto","in consegna","consegnato"];

VIEWS.hotels = function(){
  const d = today();
  const html = '<div class="grid gauto-l">' + DB.hotels.map(h=>{
    const orders = DB.hotelOrders.filter(o=> o.hotelId === h.id);
    const month = orders.filter(o=> o.date.slice(0,7) === d.slice(0,7));
    return '<div class="card"><div class="card-h"><h3>' + esc(h.name) + '</h3>' +
      '<div class="sp"><span class="badge n">' + esc("*".repeat(h.stars)) + '</span>' +
      (h.active ? '<span class="badge g">' + esc(T("c_active")) + '</span>' : '<span class="badge n">off</span>') + '</div></div>' +
      '<div class="card-b">' +
        '<div style="font-size:12.5px;color:var(--txt-2);line-height:1.8">' +
          '<div>' + icon("hotel",12) + ' ' + esc(h.addr) + ' &middot; <b style="color:var(--txt)">' + num(h.dist,1) + ' km</b></div>' +
          '<div>' + esc(h.rooms) + ' ' + esc(T("h_rooms").toLowerCase()) + ' &middot; ' + esc(h.contact) + '</div>' +
          '<div>' + esc(h.phone) + '</div>' +
          '<div>' + esc(T("h_slot")) + ': <b style="color:var(--txt)">' + esc(h.slot) + '</b></div>' +
        '</div>' +
        '<div style="margin-top:10px;padding:9px 11px;background:var(--fill-3);border-radius:var(--r-s);font-size:12.5px;line-height:1.55">' +
          '<b>' + esc(T("h_agree")) + '</b><br>' + esc(h.agreement) + '</div>' +
        '<div class="grid g2 mt-s" style="gap:8px">' +
          '<div><div class="lbl" style="margin:0">' + esc("Ordini") + ' ' + esc(T("c_month").toLowerCase()) + '</div><b class="num">' + month.length + '</b></div>' +
          '<div><div class="lbl" style="margin:0">' + esc("Fatturato") + '</div><b class="num">' + eur(sum(month.map(hoTotal))) + '</b></div>' +
        '</div>' +
        '<div class="row mt-s"><button class="btn sm pri" data-hno="' + h.id + '">' + icon("plus",12) + esc("Ordine") + '</button>' +
          '<a class="btn sm ghost" href="tel:' + esc(h.phone.replace(/\s/g,"")) + '">' + esc(T("c_phone")) + '</a>' +
          '<button class="btn sm ghost" data-hed="' + h.id + '">' + icon("edit",12) + '</button></div>' +
      '</div></div>';
  }).join("") + '</div>';

  return {
    title:T("nav_hotel"), sub:DB.hotels.length + " " + esc("hotel convenzionati vicino al locale"),
    actions:'<button class="btn ghost" data-go="break">' + icon("coffee",15) + esc(T("nav_break")) + '</button>' +
            '<button class="btn pri" data-hnew>' + icon("plus",15) + esc(T("c_new")) + '</button>',
    html:html,
    after:()=>{
      $$("[data-hed]").forEach(b=> b.onclick = ()=> hotelSheet(b.getAttribute("data-hed")));
      $$("[data-hno]").forEach(b=> b.onclick = ()=> hotelOrderSheet(null, b.getAttribute("data-hno")));
      $("[data-hnew]").onclick = ()=> hotelSheet(null);
    }
  };
};

function hotelSheet(id){
  const h = id ? hotelById(id) : null;
  const F = (n,l,v,t,st)=> '<div class="field"><label>' + esc(l) + '</label><input class="inp" name="' + n + '" type="' + (t||"text") + '"' + (st||"") + ' value="' + esc(v==null?"":v) + '"></div>';
  const body =
    '<div class="f2">' + F("name", T("c_name"), h&&h.name) + F("addr","Indirizzo", h&&h.addr) + '</div>' +
    '<div class="f3">' + F("stars","Stelle", h?h.stars:3,"number") + F("rooms", T("h_rooms"), h?h.rooms:20,"number") +
      F("dist", T("h_dist") + " (km)", h?h.dist:0.5,"number",' step="0.1"') + '</div>' +
    '<div class="f2">' + F("contact","Referente", h&&h.contact) + F("phone", T("c_phone"), h&&h.phone,"tel") + '</div>' +
    '<div class="f2">' + F("email", T("c_email"), h&&h.email,"email") + F("slot", T("h_slot"), h&&h.slot) + '</div>' +
    F("disc","Sconto convenzione (%)", h?h.disc:10,"number") +
    '<div class="field"><label>' + esc(T("h_agree")) + '</label><textarea class="inp" name="agreement">' + esc(h?h.agreement:"") + '</textarea></div>' +
    '<label class="check"><input type="checkbox" name="active"' + (!h || h.active ? " checked":"") + '><span>' + esc(T("c_active")) + '</span></label>';
  const acts = [{label:T("c_cancel"), cls:"ghost"}];
  if(h) acts.push({label:T("c_del"), cls:"dang", run:()=>{ DB.hotels = DB.hotels.filter(x=>x.id!==id); save(); refresh(); }});
  acts.push({label:T("c_save"), cls:"pri", run:(w)=>{
    const f = readForm(w);
    if(!f.name){ toast(T("c_name"),"err"); return false; }
    const patch = {name:f.name, addr:f.addr, stars:Number(f.stars)||3, rooms:Number(f.rooms)||0,
      dist:Number(f.dist)||0, contact:f.contact, phone:f.phone, email:f.email, slot:f.slot,
      disc:Number(f.disc)||0, agreement:f.agreement, active:!!f.active};
    if(h) Object.assign(h, patch); else DB.hotels.push(Object.assign({id:uid("ho")}, patch));
    save(); refresh(); toast(T("c_save"),"ok");
  }});
  modal({title:h ? h.name : T("c_new") + " hotel", size:"wide", body:body, actions:acts});
}
</script>
<script>
/* ============================================================
   PARTE 23 — COLAZIONI PER GLI HOTEL
   ============================================================ */
let BRKDAY = null;
VIEWS.break = function(){
  const d = BRKDAY || today();
  const list = DB.hotelOrders.filter(o=> o.date === d && o.type === "colazione")
    .sort((a,b)=> (a.slot||"").localeCompare(b.slot||""));
  /* totale da produrre in cucina: somma per articolo */
  const prod = {};
  list.filter(o=> o.status !== "consegnato").forEach(o=> (o.lines||[]).forEach(l=>{ prod[l.itemId] = (prod[l.itemId]||0) + l.qty; }));
  const prodArr = Object.keys(prod).map(k=> ({id:k, q:prod[k]})).sort((a,b)=> b.q - a.q);
  const rooms = sum(list.map(o=> o.rooms || 0));

  const html =
    '<div class="row" style="margin-bottom:14px">' +
      '<button class="btn ico ghost" data-bd="-1">&#8249;</button>' +
      '<input class="inp" type="date" id="bk2-date" value="' + d + '" style="width:auto">' +
      '<button class="btn ico ghost" data-bd="1">&#8250;</button>' +
      '<button class="btn ghost sm" data-bd="today">' + esc(T("c_today")) + '</button>' +
    '</div>' +
    '<div class="grid g4">' +
      stat("Consegne", list.length, fmtDate(d,{weekday:"long",day:"numeric",month:"long"})) +
      stat(T("h_rooms"), rooms, "camere servite") +
      stat("Da preparare", list.filter(o=> o.status !== "consegnato").length, "ancora aperte") +
      stat("Valore", eur(sum(list.map(hoTotal))), "netto convenzione") +
    '</div>' +
    (prodArr.length ? card("Da produrre in cucina",
      '<div class="row tight">' + prodArr.map(p=>{ const it = itemById(p.id);
        return '<span class="badge brand" style="font-size:13px;padding:6px 12px">' + p.q + ' x ' + esc(it ? L(it.name) : "?") + '</span>'; }).join("") +
      '</div>', '<button class="btn sm ghost" data-bprint>' + icon("print",12) + esc(T("c_print")) + '</button>', "mt") : "") +
    card("",
      list.length ? '<div class="list">' + list.map(o=>{
        const h = hotelById(o.hotelId);
        const stIdx = HO_STATES.indexOf(o.status);
        return '<div class="li"><div class="avat" style="background:var(--amber-soft);color:var(--amber)">' + esc((o.slot||"").replace(":","")) + '</div>' +
          '<div class="tx"><b>' + esc(h ? h.name : "?") + '</b>' +
          '<span>' + (o.rooms ? o.rooms + ' ' + esc(T("h_rooms").toLowerCase()) + ' &middot; ' : '') +
            (o.lines||[]).map(l=>{ const it = itemById(l.itemId); return l.qty + " " + (it ? L(it.name) : "?"); }).join(", ") + '</span>' +
          (o.note ? '<span style="color:var(--amber)">' + icon("warn",11) + ' ' + esc(o.note) + '</span>' : '') + '</div>' +
          '<div class="end"><b class="num">' + eur(hoTotal(o)) + '</b>' +
            '<span class="badge ' + (o.status === "consegnato" ? "g" : stIdx >= 2 ? "a" : "b") + '">' + esc(o.status) + '</span>' +
            (o.status !== "consegnato" ? '<button class="btn sm ok" data-badv="' + o.id + '">&#8250;</button>' : '') +
            '<button class="btn ico sm ghost" data-bddt="' + o.id + '" title="' + esc(T("h_ddt")) + '">' + icon("print",12) + '</button>' +
            '<button class="btn ico sm ghost" data-bed="' + o.id + '">' + icon("edit",12) + '</button></div></div>';
      }).join("") + '</div>' : empty("Nessuna colazione per questo giorno","coffee"), '', "mt flush");

  return {
    title:T("nav_break"), sub:list.length + " " + esc("consegne") + " &middot; " + rooms + " " + T("h_rooms").toLowerCase(),
    actions:'<button class="btn ghost" data-brep>' + icon("cal",15) + esc("Ripeti ieri") + '</button>' +
            '<button class="btn pri" data-bnew>' + icon("plus",15) + esc(T("c_new")) + '</button>',
    html:html,
    after:()=>{
      $("#bk2-date").onchange = (e)=>{ BRKDAY = e.target.value; refresh(); };
      $$("[data-bd]").forEach(b=> b.onclick = ()=>{
        const v = b.getAttribute("data-bd");
        BRKDAY = v === "today" ? today() : addDays(d, Number(v)); refresh();
      });
      $$("[data-bed]").forEach(b=> b.onclick = ()=> hotelOrderSheet(b.getAttribute("data-bed")));
      $$("[data-bddt]").forEach(b=> b.onclick = ()=> printDDT(byId(DB.hotelOrders, b.getAttribute("data-bddt"))));
      $$("[data-badv]").forEach(b=> b.onclick = ()=>{
        const o = byId(DB.hotelOrders, b.getAttribute("data-badv"));
        const i = HO_STATES.indexOf(o.status);
        o.status = HO_STATES[Math.min(HO_STATES.length-1, i+1)];
        save(); refresh(); toast(o.status, "ok");
      });
      $("[data-bnew]").onclick = ()=> hotelOrderSheet(null, null, d, "colazione");
      const bp = $("[data-bprint]"); if(bp) bp.onclick = ()=> printProduction(d, prodArr);
      $("[data-brep]").onclick = ()=>{
        const prev = addDays(d,-1);
        const src = DB.hotelOrders.filter(o=> o.date === prev && o.type === "colazione");
        if(!src.length){ toast("Ieri non c'erano colazioni","warn"); return; }
        src.forEach(o=> DB.hotelOrders.push(Object.assign({}, o, {id:uid("ho"), date:d, status:"confermato",
          lines:o.lines.map(l=> Object.assign({}, l))})));
        save(); refresh(); toast(src.length + " ordini copiati da ieri", "ok");
      };
    }
  };
};

function hotelOrderSheet(id, hotelId, date, type){
  const o = id ? byId(DB.hotelOrders, id) : null;
  const cur = o || {hotelId:hotelId || DB.hotels[0].id, date:date || today(), slot:"07:30",
    type:type || "colazione", rooms:0, status:"confermato", lines:[], driver:"", note:""};
  const lines = (cur.lines || []).map(l=> Object.assign({}, l));

  const draw = ()=>
    '<div class="f3">' +
      '<div class="field"><label>Hotel</label><select class="inp" name="hotelId">' +
        DB.hotels.map(h=> '<option value="' + h.id + '"' + (cur.hotelId === h.id ? " selected":"") + '>' + esc(h.name) + '</option>').join("") + '</select></div>' +
      '<div class="field"><label>' + esc(T("c_date")) + '</label><input class="inp" type="date" name="date" value="' + cur.date + '"></div>' +
      '<div class="field"><label>' + esc(T("h_slot")) + '</label><input class="inp" type="time" name="slot" value="' + esc(cur.slot) + '"></div>' +
    '</div>' +
    '<div class="f3">' +
      '<div class="field"><label>Tipo</label><select class="inp" name="type">' +
        ['colazione','asporto'].map(t=> '<option value="' + t + '"' + (cur.type === t ? " selected":"") + '>' + esc(t) + '</option>').join("") + '</select></div>' +
      '<div class="field"><label>' + esc(T("h_rooms")) + '</label><input class="inp" type="number" name="rooms" value="' + (cur.rooms||0) + '"></div>' +
      '<div class="field"><label>' + esc(T("h_driver")) + '</label><select class="inp" name="driver"><option value="">-</option>' +
        DB.staff.filter(s=> s.active).map(s=> '<option value="' + s.id + '"' + (cur.driver === s.id ? " selected":"") + '>' + esc(s.name) + '</option>').join("") + '</select></div>' +
    '</div>' +
    '<div class="lbl">Righe ordine</div>' +
    '<div class="card" style="margin-bottom:12px"><div class="card-b flush"><div class="list">' +
      (lines.length ? lines.map((l,ix)=>{ const it = itemById(l.itemId);
        return '<div class="li" style="padding:7px 12px"><div class="tx"><b>' + esc(it ? L(it.name) : "?") + '</b>' +
          '<span>' + eur(it ? it.price : 0) + ' x ' + l.qty + '</span></div>' +
          '<div class="end"><input class="inp sm num" style="width:74px;text-align:end" data-hq="' + ix + '" type="number" min="0" value="' + l.qty + '">' +
          '<button class="btn ico sm dang" data-hrm="' + ix + '">' + icon("trash",12) + '</button></div></div>';
      }).join("") : '<div class="li"><div class="tx" style="color:var(--txt-3);font-size:13px">' + esc("Aggiungi le righe") + '</div></div>') +
    '</div></div></div>' +
    '<div class="row" style="margin-bottom:12px">' +
      '<select class="inp" id="ho-it" style="flex:2">' + DB.items.map(i=> '<option value="' + i.id + '">' + esc(L(i.name)) + ' (' + eur(i.price) + ')</option>').join("") + '</select>' +
      '<input class="inp" id="ho-q" type="number" min="1" value="1" style="width:88px">' +
      '<button class="btn pri" id="ho-add">' + esc(T("c_add")) + '</button></div>' +
    '<div class="field"><label>' + esc(T("c_status")) + '</label><select class="inp" name="status">' +
      HO_STATES.map(s=> '<option' + (cur.status === s ? " selected":"") + '>' + esc(s) + '</option>').join("") + '</select></div>' +
    '<div class="field"><label>' + esc(T("c_notes")) + '</label><input class="inp" name="note" value="' + esc(cur.note||"") + '"></div>';

  const wire = (w)=>{
    $("#ho-add", w).onclick = ()=>{
      const itemId = $("#ho-it", w).value, q = Number($("#ho-q", w).value) || 1;
      const ex = lines.find(l=> l.itemId === itemId);
      if(ex) ex.qty += q; else lines.push({itemId:itemId, qty:q});
      $(".modal-b", w).innerHTML = draw(); wire(w);
    };
    $$("[data-hq]", w).forEach(inp=> inp.onchange = ()=>{
      lines[Number(inp.getAttribute("data-hq"))].qty = Number(inp.value) || 0;
    });
    $$("[data-hrm]", w).forEach(b=> b.onclick = ()=>{
      lines.splice(Number(b.getAttribute("data-hrm")), 1);
      $(".modal-b", w).innerHTML = draw(); wire(w);
    });
  };
  const acts = [{label:T("c_cancel"), cls:"ghost"}];
  if(o) acts.push({label:T("c_del"), cls:"dang", run:()=>{ DB.hotelOrders = DB.hotelOrders.filter(x=> x.id !== id); save(); refresh(); }});
  acts.push({label:T("c_save"), cls:"pri", run:(w)=>{
    const f = readForm(w);
    const patch = {hotelId:f.hotelId, date:f.date, slot:f.slot, type:f.type, rooms:Number(f.rooms)||0,
      driver:f.driver, status:f.status, note:f.note, lines:lines.filter(l=> l.qty > 0)};
    if(o) Object.assign(o, patch); else DB.hotelOrders.push(Object.assign({id:uid("ho")}, patch));
    BRKDAY = f.date; save(); refresh(); toast(T("c_save"),"ok");
  }});
  modal({title:o ? "Ordine hotel" : T("c_new") + " ordine hotel", size:"wide", body:draw(), actions:acts, onOpen:wire});
}
</script>
<script>
/* --- bolla di consegna e foglio di produzione --- */
