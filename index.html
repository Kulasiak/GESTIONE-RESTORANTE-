    wire(w);
  };
  const wire = (w)=>{
    renderPicker(w, (itemId)=>{
      const it = itemById(itemId); if(!it) return;
      const ex = o.lines.find(l=> l.itemId === itemId && !l.note && l.status === "nuovo");
      if(ex) ex.qty++;
      else o.lines.push({id:uid("ln"), itemId:itemId, qty:1, price:it.price, course:defaultCourse(it), note:"", mods:[], status:"nuovo"});
      save(); refreshBody(w);
    });
    /* togliere o ridurre qualcosa che la cucina sta gia facendo passa dal responsabile */
    const guarded = (l, what, act)=>{
      if(l.status === "nuovo"){ act(); return; }
      requireManager(what, (mgr)=>{ act(); logChange(o, l, what, mgr); });
    };
    $$("[data-mq]", w).forEach(b=> b.onclick = ()=>{
      const l = o.lines.find(x=> x.id === b.getAttribute("data-mq")); if(!l) return;
      const d = Number(b.getAttribute("data-d"));
      const run = ()=>{
        l.qty += d;
        if(l.qty <= 0) o.lines = o.lines.filter(x=> x.id !== l.id);
        save(); refreshBody(w);
      };
      if(d < 0){ const it = itemById(l.itemId);
        guarded(l, "Togliere una porzione di " + (it ? L(it.name) : "?"), run);
      }else run();
    });
    $$("[data-rm]", w).forEach(b=> b.onclick = ()=>{
      const l = o.lines.find(x=> x.id === b.getAttribute("data-rm")); if(!l) return;
      const it = itemById(l.itemId);
      guarded(l, "Cancellare " + (it ? L(it.name) : "?") + " dalla comanda", ()=>{
        o.lines = o.lines.filter(x=> x.id !== l.id);
        save(); refreshBody(w);
      });
    });
    $$("[data-md-line]", w).forEach(b=> b.onclick = ()=>{
      const l = o.lines.find(x=> x.id === b.getAttribute("data-md-line")); if(!l) return;
      const it = itemById(l.itemId);
      const apply = ()=> modsSheet(l, L(it ? it.name : ""), (res)=>{
        if(res){ l.mods = res.mods; l.note = res.note; save(); }
        orderSheet(orderId);
      });
      if(l.status === "nuovo") apply();
      else requireManager("Cambiare le modifiche su un piatto già in cucina", apply);
    });
  };

  modal({title:T("o_order") + " " + orderLabel(o), size:"xwide", body:draw(), actions:[
    {label:T("c_close"), cls:"ghost", run:()=> refresh()},
    {label:T("o_note_line"), cls:"ghost", run:(w)=>{ lineNoteSheet(o.id); return false; }},
    {label:T("o_send"), cls:"pri", run:()=>{
      let n = 0;
      o.lines.forEach(l=>{ if(l.status === "nuovo"){ l.status = "lavorazione"; l.sentAt = new Date().toISOString(); n++; } });
      o.status = "in corso"; save(); refresh();
      toast(n ? n + " piatti mandati in cucina" : "Niente di nuovo da mandare", n ? "ok" : "warn");
    }},
    {label:T("o_pay"), cls:"ok", run:()=>{ payOrder(o.id); return false; }}
  ], onOpen:wire});
}
</script>
<script>
/* --- le modifiche di una riga: si tocca, non si scrive --- */
function modsSheet(line, title, onSave){
  const sel = (line.mods || []).slice();
  const body = MOD_GROUPS.map(g=>{
    const ms = (DB.mods || []).filter(m=> m.group === g.k && m.on !== false);
    if(!ms.length) return "";
    return '<div class="lbl" style="margin-top:12px">' + esc(T(g.t)) + '</div>' +
      '<div class="row tight">' + ms.map(m=>
        '<button type="button" class="btn sm ' + (sel.includes(m.id) ? "pri" : "ghost") + '" data-md="' + m.id + '">' +
        esc(L(m.name)) + (m.price ? ' <span style="opacity:.75">+' + eur(m.price) + '</span>' : '') + '</button>').join("") + '</div>';
  }).join("") +
  '<div class="field mt-l"><label>' + esc(T("md_free")) + '</label>' +
    '<input class="inp" name="note" value="' + esc(line.note || "") + '" placeholder="' + esc("solo se non basta quello che c'è sopra") + '"></div>';

  /* si chiude prima di richiamare chi ci ha aperti: cosi, se quello riapre
     la comanda, non gliela si richiude subito sotto il naso */
  const done = (res)=>{ closeModal(); onSave(res); return false; };
  modal({title:title || T("md_add"), size:"wide", body:body, actions:[
    {label:T("c_cancel"), cls:"ghost", run:()=> done(null)},
    {label:T("c_save"), cls:"pri", run:(w)=>{
      const f = readForm(w);
      return done({mods:sel.slice(), note:(f.note || "").trim()});
    }}
  ], onOpen:(w)=>{
    $$("[data-md]", w).forEach(b=> b.onclick = ()=>{
      const id = b.getAttribute("data-md");
      const i = sel.indexOf(id);
      if(i >= 0) sel.splice(i, 1); else sel.push(id);
      b.className = "btn sm " + (sel.includes(id) ? "pri" : "ghost");
    });
  }});
}

/** Le modifiche come le vede la sala: pastiglie colorate sotto al nome. */
function modChips(l, small){
  const out = (l.mods || []).map(id=>{
    const m = modById(id); if(!m) return "";
    const g = MOD_GROUPS.find(x=> x.k === m.group) || {cls:"n"};
    return '<span class="badge ' + g.cls + '" style="font-size:' + (small ? "10" : "10.5") + 'px;padding:2px 7px">' +
      esc(L(m.name)) + (m.price ? " +" + eur(m.price) : "") + '</span>';
  }).join("");
  const note = l.note ? '<span class="badge a" style="font-size:' + (small ? "10" : "10.5") + 'px;padding:2px 7px">' +
    icon("warn",9) + " " + esc(l.note) + '</span>' : "";
  return (out || note) ? '<span class="row tight" style="gap:4px;margin-top:3px">' + out + note + '</span>' : "";
}

/* --- note e portata riga per riga --- */
function lineNoteSheet(orderId){
  const o = byId(DB.orders, orderId); if(!o || !o.lines.length){ toast("Comanda vuota","warn"); return; }
  const body = o.lines.map(l=>{
    const it = itemById(l.itemId);
    return '<div class="card" style="margin-bottom:9px"><div class="card-b" style="padding:11px 13px">' +
      '<b style="font-size:13.5px">' + l.qty + ' x ' + esc(it ? L(it.name) : "?") + '</b>' +
      '<div class="f2 mt-s">' +
        '<div><div class="lbl">' + esc(T("o_course")) + '</div><select class="inp sm" name="c_' + l.id + '">' +
          COURSES.map(c=> '<option value="' + c.k + '"' + (l.course === c.k ? " selected":"") + '>' + esc(T(c.t)) + '</option>').join("") + '</select></div>' +
        '<div><div class="lbl">' + esc(T("o_note_line")) + '</div><input class="inp sm" name="n_' + l.id + '" value="' + esc(l.note || "") + '" placeholder="' + esc("senza glutine, ben cotto, no cipolla...") + '"></div>' +
      '</div></div></div>';
  }).join("");
  modal({title:T("o_note_line"), size:"wide", body:body, actions:[
    {label:T("c_cancel"), cls:"ghost", run:()=>{ orderSheet(orderId); return false; }},
    {label:T("c_save"), cls:"pri", run:(w)=>{
      const f = readForm(w);
      o.lines.forEach(l=>{ l.course = f["c_" + l.id] || l.course; l.note = (f["n_" + l.id] || "").trim(); });
      save(); orderSheet(orderId); return false;
    }}
  ]});
}

/* --- incasso e chiusura conto --- */
function payOrder(orderId){
  const o = byId(DB.orders, orderId); if(!o) return;
  const tot = orderTotal(o);
  const body =
    '<div style="text-align:center;padding:8px 0 16px">' +
      '<div style="font-size:12px;color:var(--txt-2);font-weight:600;text-transform:uppercase;letter-spacing:.05em">' + esc(T("c_total")) + '</div>' +
      '<div class="num" style="font-size:40px;font-weight:800;letter-spacing:-.03em" id="pay-tot">' + eur(tot) + '</div>' +
      '<div style="font-size:13px;color:var(--txt-2)">' + esc(orderLabel(o)) + ' &middot; ' + o.covers + ' ' + esc(T("c_covers").toLowerCase()) + '</div>' +
    '</div>' +
    '<div class="f2">' +
      '<div class="field"><label>' + esc(T("o_disc")) + ' (' + esc("euro") + ')</label><input class="inp" type="number" step="0.5" min="0" name="disc" value="' + (o.disc || 0) + '"></div>' +
      '<div class="field"><label>' + esc("Diviso per") + '</label><input class="inp" type="number" min="1" name="split" value="1"></div>' +
    '</div>' +
    '<div id="pay-split" style="text-align:center;font-size:13.5px;color:var(--txt-2);margin-bottom:12px"></div>' +
    '<div class="field"><label>' + esc("Pagamento") + '</label><div class="seg" style="width:100%;display:flex">' +
      '<button type="button" data-pay="contanti" class="on" style="flex:1">' + esc(T("o_cash")) + '</button>' +
      '<button type="button" data-pay="carta" style="flex:1">' + esc(T("o_card")) + '</button>' +
      '<button type="button" data-pay="hotel" style="flex:1">Hotel</button>' +
      '<button type="button" data-pay="offerto" style="flex:1">' + esc("Offerto") + '</button>' +
    '</div></div>' +
    '<div class="field"><label>' + esc(T("c_notes")) + '</label><input class="inp" name="note" value="' + esc(o.note || "") + '"></div>';

  modal({title:T("o_pay"), size:"slim", body:body, actions:[
    {label:T("c_cancel"), cls:"ghost"},
    {label:T("c_print"), cls:"ghost", run:(w)=>{ printBill(o); return false; }},
    {label:T("c_confirm"), cls:"ok", run:(w)=>{
      const f = readForm(w);
      const disc = Number(f.disc) || 0;
      /* lo sconto tocca l'incasso: lo autorizza il responsabile */
      if(disc > 0 && !meIsManager()){
        requireManager("Sconto di " + eur(disc) + " su " + orderLabel(o), (mgr)=>{
          logChange(o, null, "Sconto " + eur(disc), mgr);
          $$("[data-pay]", w).forEach(x=>{});
          closePay(w, disc);
        });
        return false;
      }
      o.disc = disc;
      o.note = f.note || "";
      closePay(w, disc);
    }}
  ], onOpen:(w)=>{
    w.dataset.pay = "contanti";
    w.dataset.orderId = o.id;
    $$("[data-pay]", w).forEach(b=> b.onclick = ()=>{
      w.dataset.pay = b.getAttribute("data-pay");
      $$("[data-pay]", w).forEach(x=> x.classList.toggle("on", x === b));
    });
    const upd = ()=>{
      const f = readForm(w);
      const t = Math.max(0, orderSubtotal(o) + (o.type==="sala"? o.covers*DB.meta.biz.cover : 0) - (Number(f.disc)||0));
      $("#pay-tot", w).textContent = eur(t);
      const n = Math.max(1, Number(f.split) || 1);
      $("#pay-split", w).textContent = n > 1 ? (T("o_split") + ": " + n + " x " + eur(t/n)) : "";
    };
    $$("input", w).forEach(i=> i.oninput = upd);
    upd();
  }});
}

/** Chiude il conto e libera il tavolo. */
function closePay(w, disc){
  const o = byId(DB.orders, w.dataset.orderId);
  if(!o) return;
  o.disc = disc || 0;
  o.pay = w.dataset.pay || "contanti";
  o.total = orderTotal(o);
  o.status = "chiuso";
  o.closed = new Date().toISOString();
  o.date = today();
  o.waiter = o.waiter || (me() || {}).id || "";
  o.lines.forEach(l=>{ l.status = "servito"; const it = itemById(l.itemId); if(it) it.sold = (it.sold||0) + l.qty; });
  if(o.tableId) freeTable(o.tableId);
  save(); closeModal(); refresh();
  toast(T("o_pay") + " " + eur(o.total), "ok");
}

function printBill(o){
  const rows = o.lines.map(l=>{ const it = itemById(l.itemId);
    return '<tr><td>' + l.qty + '</td><td>' + esc(it ? L(it.name) : "?") + '</td><td style="text-align:right">' + eur(lineTotal(l)) + '</td></tr>'; }).join("");
  const b = DB.meta.biz;
  const w = window.open("", "_blank", "width=420,height=680");
  if(!w){ toast("Consenti le finestre popup per stampare","err"); return; }
  w.document.write('<!doctype html><meta charset="utf-8"><title>' + esc(b.name) + '</title>' +
    '<style>body{font-family:ui-monospace,Menlo,monospace;font-size:12px;padding:16px;max-width:320px}' +
    'h1{font-size:15px;text-align:center;margin:0 0 2px}p{margin:2px 0;text-align:center;font-size:11px}' +
    'table{width:100%;border-collapse:collapse;margin-top:12px}td{padding:3px 0;vertical-align:top}' +
    'tfoot td{border-top:1px dashed #000;padding-top:6px;font-weight:700;font-size:14px}' +
    '.f{margin-top:14px;text-align:center;font-size:10.5px;border-top:1px dashed #000;padding-top:8px}</style>' +
    '<h1>' + esc(b.name) + '</h1><p>' + esc(b.addr) + ', ' + esc(b.city) + '</p><p>' + esc(b.phone) + '</p>' +
    '<p>' + esc(fmtDate(today())) + ' ' + nowHM() + ' &middot; ' + esc(orderLabel(o)) + ' &middot; ' + o.covers + ' cop.</p>' +
    '<table><tbody>' + rows +
    (o.type === "sala" && o.covers ? '<tr><td>' + o.covers + '</td><td>' + esc(T("o_cover")) + '</td><td style="text-align:right">' + eur(o.covers*b.cover) + '</td></tr>' : '') +
    (o.disc ? '<tr><td></td><td>' + esc(T("o_disc")) + '</td><td style="text-align:right">-' + eur(o.disc) + '</td></tr>' : '') +
    '</tbody><tfoot><tr><td colspan="2">' + esc(T("c_total")) + '</td><td style="text-align:right">' + eur(orderTotal(o)) + '</td></tr></tfoot></table>' +
    '<div class="f">' + esc("Documento interno, non fiscale") + '<br>' + esc(b.vat) + '<br>Wi-Fi: ' + esc(b.wifi) + '</div>');
  w.document.close(); setTimeout(()=> w.print(), 260);
}
</script>
<script>
/* --- elenco comande --- */
VIEWS.orders = function(){
  const open = openOrders();
  const closedToday = closedOn(today());
  const rows = (arr, isOpen)=> arr.length ? '<div class="list">' + arr.map(o=>{
    const late = isOpen && minutesSince(o.opened) > 75;
    return '<div class="li"><div class="ic" style="' + (late ? "background:var(--red-soft);color:var(--red)" : "") + '">' + icon(o.type==="sala"?"table":o.type==="hotel"?"hotel":"bag") + '</div>' +
      '<div class="tx"><b>' + esc(orderLabel(o)) + '</b><span>' + o.lines.length + ' righe &middot; ' + o.covers + ' ' + esc(T("c_covers").toLowerCase()) +
      (isOpen ? ' &middot; ' + minutesSince(o.opened) + " min" : ' &middot; ' + esc(T(o.pay === "carta" ? "o_card" : o.pay === "contanti" ? "o_cash" : "c_total"))) + '</span></div>' +
      '<div class="end"><b class="num">' + eur(o.total != null ? o.total : orderTotal(o)) + '</b>' +
      (isOpen ? '<button class="btn sm pri" data-oo="' + o.id + '">' + esc(T("c_open")) + '</button>' +
                '<button class="btn sm ok" data-op="' + o.id + '">' + esc(T("o_pay")) + '</button>'
              : '<button class="btn sm ghost" data-ob="' + o.id + '">' + icon("print",12) + '</button>') +
      '</div></div>';
  }).join("") + '</div>' : empty("Nessuna comanda", "order");

  const html =
    '<div class="grid g4">' +
      stat(T("c_open"), open.length, eur(sum(open.map(orderTotal)))) +
      stat("Chiuse oggi", closedToday.length, eur(revenueOn(today()))) +
      stat(T("r_avg"), eur(closedToday.length ? revenueOn(today())/closedToday.length : 0), "per conto") +
      stat(T("c_covers"), coversOn(today()), "serviti oggi") +
    '</div>' +
    card(T("c_open"), rows(open, true), '', "mt flush") +
    card("Chiuse oggi", rows(closedToday.slice().reverse(), false), '', "mt flush");

  return {
    title:T("nav_orders"), sub:fmtDate(today()),
    actions:'<button class="btn ghost" data-new-away>' + icon("bag",15) + esc(T("nav_away")) + '</button>' +
            '<button class="btn pri" data-go="tables">' + icon("table",15) + esc(T("nav_tables")) + '</button>',
    html:html,
    after:()=>{
      $$("[data-oo]").forEach(b=> b.onclick = ()=> orderSheet(b.getAttribute("data-oo")));
      $$("[data-op]").forEach(b=> b.onclick = ()=> payOrder(b.getAttribute("data-op")));
      $$("[data-ob]").forEach(b=> b.onclick = ()=> printBill(byId(DB.orders, b.getAttribute("data-ob"))));
      $("[data-new-away]").onclick = newAwayOrder;
    }
  };
};

function newAwayOrder(){
  const o = {id:uid("or"), tableId:null, type:"asporto", covers:0, waiter:"", status:"aperto",
    opened:new Date().toISOString(), closed:null, date:today(), lines:[], pay:null, disc:0, total:null, note:""};
  DB.orders.push(o); save(); orderSheet(o.id);
}

/* ============================================================
   PARTE 11 — PRENOTAZIONI
   ============================================================ */
let BOOKDAY = null;
VIEWS.book = function(){
  const d = BOOKDAY || today();
  const list = DB.reservations.filter(r=> r.date === d).sort((a,b)=> a.time.localeCompare(b.time));
  const cov = sum(list.filter(r=> r.status !== "annullata").map(r=> r.covers));
  const lunch = list.filter(r=> hm2min(r.time) < 1020);
  const dinner = list.filter(r=> hm2min(r.time) >= 1020);

  const block = (arr, label)=> '<div class="course">' + esc(label) + ' &middot; ' + arr.length + '</div>' +
    (arr.length ? arr.map(r=>{
      const t = tableById(r.tableId);
      return '<div class="li"><div class="avat">' + esc(r.time.replace(":","")) + '</div>' +
        '<div class="tx"><b>' + esc(r.name) + (r.status === "annullata" ? ' <span class="badge r">' + esc("annullata") + '</span>' : '') + '</b>' +
        '<span>' + r.covers + ' ' + esc(T("c_covers").toLowerCase()) + (t ? ' &middot; ' + esc(T("c_table")) + ' ' + esc(t.n) : ' &middot; ' + esc("senza tavolo")) +
        (r.phone ? ' &middot; ' + esc(r.phone) : '') + '</span>' +
        (r.note ? '<span style="color:var(--amber)">' + icon("warn",11) + ' ' + esc(r.note) + '</span>' : '') + '</div>' +
        '<div class="end">' +
          (t && r.status !== "annullata" ? '<button class="btn sm ok" data-arr="' + r.id + '">' + esc(T("t_seat_guests")) + '</button>' : '') +
          '<button class="btn ico sm ghost" data-be="' + r.id + '">' + icon("edit",12) + '</button></div></div>';
    }).join("") : '<div class="li"><div class="tx" style="color:var(--txt-3);font-size:13px">' + esc(T("c_none_yet")) + '</div></div>');

  const html =
    '<div class="row" style="margin-bottom:14px">' +
      '<button class="btn ico ghost" data-dd="-1">&#8249;</button>' +
      '<input class="inp" type="date" id="bk-date" value="' + d + '" style="width:auto">' +
      '<button class="btn ico ghost" data-dd="1">&#8250;</button>' +
      '<button class="btn ghost sm" data-dd="today">' + esc(T("c_today")) + '</button>' +
    '</div>' +
    '<div class="grid g3">' +
      stat(T("nav_book"), list.filter(r=>r.status!=="annullata").length, fmtDate(d,{weekday:"long",day:"numeric",month:"long"})) +
      stat(T("c_covers"), cov, "prenotati") +
      stat("Posti liberi", Math.max(0, sum(DB.tables.map(t=>t.seats)) - cov), "in totale " + sum(DB.tables.map(t=>t.seats))) +
    '</div>' +
    card("", block(lunch, T("p_lunch")) + block(dinner, T("p_dinner")), '', "mt flush");

  return {
    title:T("nav_book"), sub:fmtDate(d,{weekday:"long",day:"numeric",month:"long",year:"numeric"}),
    actions:'<button class="btn pri" data-nb>' + icon("plus",15) + esc(T("c_new")) + '</button>',
    html:html,
    after:()=>{
      $("#bk-date").onchange = (e)=>{ BOOKDAY = e.target.value; refresh(); };
      $$("[data-dd]").forEach(b=> b.onclick = ()=>{
        const v = b.getAttribute("data-dd");
        BOOKDAY = v === "today" ? today() : addDays(d, Number(v));
        refresh();
      });
      $("[data-nb]").onclick = ()=> bookSheet(null, d);
      $$("[data-be]").forEach(b=> b.onclick = ()=> bookSheet(b.getAttribute("data-be")));
      $$("[data-arr]").forEach(b=> b.onclick = ()=>{
        const r = byId(DB.reservations, b.getAttribute("data-arr"));
        setTable(r.tableId, {status:"occupato", covers:r.covers, since:new Date().toISOString()});
        r.status = "arrivata"; save(); openOrderFor(r.tableId);
      });
    }
  };
};

function bookSheet(id, day){
  const r = id ? byId(DB.reservations, id) : null;
  const body =
    '<div class="f2">' +
      '<div class="field"><label>' + esc(T("c_name")) + '</label><input class="inp" name="name" value="' + esc(r ? r.name : "") + '"></div>' +
      '<div class="field"><label>' + esc(T("c_phone")) + '</label><input class="inp" name="phone" value="' + esc(r ? r.phone : "") + '"></div>' +
    '</div>' +
    '<div class="f3">' +
      '<div class="field"><label>' + esc(T("c_date")) + '</label><input class="inp" type="date" name="date" value="' + (r ? r.date : (day || today())) + '"></div>' +
      '<div class="field"><label>' + esc(T("c_time")) + '</label><input class="inp" type="time" name="time" value="' + (r ? r.time : "20:00") + '"></div>' +
      '<div class="field"><label>' + esc(T("c_covers")) + '</label><input class="inp" type="number" min="1" name="covers" value="' + (r ? r.covers : 2) + '"></div>' +
    '</div>' +
    '<div class="field"><label>' + esc(T("c_table")) + '</label><select class="inp" name="tableId"><option value="">' + esc("Da assegnare") + '</option>' +
      DB.rooms.map(rm=> '<optgroup label="' + esc(L(rm.name)) + '">' + DB.tables.filter(t=> t.room === rm.id).map(t=>
        '<option value="' + t.id + '"' + (r && r.tableId === t.id ? " selected":"") + '>' + esc(t.n) + ' (' + t.seats + ')</option>').join("") + '</optgroup>').join("") +
    '</select></div>' +
    '<div class="field"><label>' + esc(T("c_notes")) + '</label><input class="inp" name="note" value="' + esc(r ? r.note : "") + '" placeholder="' + esc("allergie, seggiolone, compleanno, sedia a rotelle...") + '"></div>';
  const acts = [{label:T("c_cancel"), cls:"ghost"}];
  if(r) acts.push({label:T("c_del"), cls:"dang", run:()=>{ DB.reservations = DB.reservations.filter(x=> x.id !== id); save(); refresh(); }});
  acts.push({label:T("c_save"), cls:"pri", run:(w)=>{
    const f = readForm(w);
    if(!f.name){ toast(T("c_name"), "err"); return false; }
    if(r) Object.assign(r, {name:f.name, phone:f.phone, date:f.date, time:f.time, covers:Number(f.covers)||1, tableId:f.tableId, note:f.note});
    else DB.reservations.push({id:uid("bk"), name:f.name, phone:f.phone, date:f.date, time:f.time,
      covers:Number(f.covers)||1, tableId:f.tableId, note:f.note, status:"confermata", source:"manuale"});
    if(f.tableId && f.date === today()) setTable(f.tableId, {status:"prenotato"});
    BOOKDAY = f.date; save(); refresh(); toast(T("c_save"), "ok");
  }});
  modal({title:r ? T("c_edit") : T("c_new") + " " + T("nav_book").toLowerCase(), body:body, actions:acts});
}
</script>
<script>
/* ============================================================
   PARTE 12 — MONITOR CUCINA
   ============================================================ */
const STATIONS = ["tutte","freddo","primi","caldo","pizza","gastronomia","pasticceria","bar"];
let KSTATION = "tutte", KTIMER = null;

VIEWS.kds = function(){
  const tickets = openOrders().map(o=>{
    const lines = o.lines.filter(l=> (l.status === "lavorazione" || l.status === "pronto") &&
      (KSTATION === "tutte" || (itemById(l.itemId) || {}).station === KSTATION));
    return {o:o, lines:lines};
  }).filter(t=> t.lines.length);

  /* conteggio complessivo per piatto: quanti ne servono adesso */
  const allday = {};
  tickets.forEach(t=> t.lines.forEach(l=>{ if(l.status !== "pronto") allday[l.itemId] = (allday[l.itemId] || 0) + l.qty; }));
  const alldayArr = Object.keys(allday).map(k=> ({id:k, q:allday[k]})).sort((a,b)=> b.q - a.q);

  const html =
    '<div class="row" style="margin-bottom:14px">' +
      '<div class="seg">' + STATIONS.map(s=>
        '<button class="' + (KSTATION === s ? "on":"") + '" data-ks="' + s + '">' + esc(s === "tutte" ? T("c_all") : s) + '</button>').join("") + '</div>' +
      '<div class="spacer"></div>' +
      '<span class="badge b">' + tickets.length + ' ' + esc("comande") + '</span>' +
      '<span class="badge a">' + sum(alldayArr.map(a=>a.q)) + ' ' + esc("piatti") + '</span>' +
    '</div>' +
    (alldayArr.length ? card(T("k_allday"),
      '<div class="row tight">' + alldayArr.map(a=>{
        const it = itemById(a.id);
        return '<span class="badge brand" style="font-size:12.5px;padding:5px 11px">' + a.q + ' x ' + esc(it ? L(it.name) : "?") + '</span>';
      }).join("") + '</div>', '', "") : '') +
    '<div class="kds mt">' + (tickets.length ? tickets.map(t=>{
      const mins = minutesSince(t.o.lines.filter(l=>l.sentAt).map(l=>l.sentAt).sort()[0] || t.o.opened);
      const allReady = t.lines.every(l=> l.status === "pronto");
      const cls = allReady ? "pronto" : mins > 22 ? "tardi" : mins > 12 ? "lavorazione" : "nuovo";
      return '<div class="tik ' + cls + '">' +
        '<div class="tik-h"><b>' + esc(orderLabel(t.o)) + '</b>' +
          '<span class="badge n">' + t.o.covers + ' cop.</span>' +
          '<span class="tm' + (mins > 22 ? " late" : "") + '">' + mins + "'" + '</span></div>' +
        '<ul>' + COURSES.map(c=>{
          const ls = t.lines.filter(l=> l.course === c.k);
          if(!ls.length) return "";
          return '<li class="course" style="padding:2px 12px;cursor:default">' + esc(T(c.t)) + '</li>' +
            ls.map(l=>{ const it = itemById(l.itemId);
              const mods = (l.mods || []).map(id=>{ const m = modById(id); if(!m) return "";
                return '<em class="' + (m.group === "allerta" ? "alert" : "") + '">' +
                  (m.group === "allerta" ? icon("warn",10) + " " : "") + esc(L(m.name)) + '</em>';
              }).join("");
              return '<li data-kl="' + l.id + '" data-ko="' + t.o.id + '" class="' + (l.status === "pronto" ? "done" : "") + '">' +
                '<span class="q">' + l.qty + '</span><span>' + esc(it ? L(it.name) : "?") + mods +
                (l.note ? '<em>' + icon("warn",10) + ' ' + esc(l.note) + '</em>' : '') + '</span></li>';
            }).join("");
        }).join("") + '</ul>' +
        '<div class="tik-f">' +
          '<button class="btn sm ok" style="flex:1" data-kr="' + t.o.id + '">' + icon("check",13) + esc(T("k_bump")) + '</button>' +
          '<button class="btn sm ghost" data-kv="' + t.o.id + '">' + esc(T("k_served")) + '</button>' +
        '</div></div>';
    }).join("") : '<div style="grid-column:1/-1">' + empty("Nessuna comanda in cucina. Le comande arrivano quando la sala le manda.","kds") + '</div>') + '</div>';

  return {
    title:T("nav_kds"), sub:esc(nowHM()) + ' &middot; ' + esc(KSTATION === "tutte" ? T("c_all") : KSTATION),
    actions:'<button class="btn ghost" data-go="prep">' + icon("prep",15) + esc(T("nav_prep")) + '</button>' +
            '<button class="btn ghost" data-so>' + icon("warn",15) + esc(T("k_sold")) + '</button>',
    html:html,
    after:()=>{
      $$("[data-ks]").forEach(b=> b.onclick = ()=>{ KSTATION = b.getAttribute("data-ks"); refresh(); });
      $$("[data-kl]").forEach(b=> b.onclick = ()=>{
        const o = byId(DB.orders, b.getAttribute("data-ko"));
        const l = o.lines.find(x=> x.id === b.getAttribute("data-kl"));
        l.status = l.status === "pronto" ? "lavorazione" : "pronto";
        save(); refresh();
      });
      $$("[data-kr]").forEach(b=> b.onclick = ()=>{
        const o = byId(DB.orders, b.getAttribute("data-kr"));
        o.lines.forEach(l=>{ if(l.status === "lavorazione") l.status = "pronto"; });
        save(); refresh(); toast(T("k_ready"), "ok");
      });
      $$("[data-kv]").forEach(b=> b.onclick = ()=>{
        const o = byId(DB.orders, b.getAttribute("data-kv"));
        o.lines.forEach(l=>{ if(l.status === "pronto" || l.status === "lavorazione") l.status = "servito"; });
        save(); refresh();
      });
      $("[data-so]").onclick = soldOutSheet;
      clearInterval(KTIMER);
      KTIMER = setInterval(()=>{ if(VIEW === "kds") refresh(); }, 30000);
    }
  };
};

/* --- esauriti: quello che la cucina non ha più --- */
function soldOutSheet(){
  const body = '<p style="font-size:13.5px;color:var(--txt-2);margin-bottom:12px">' +
      esc("Tocca un piatto per toglierlo dal menu: sparisce subito dalla comanda e dallo schermo LED.") + '</p>' +
    DB.cats.slice().sort((a,b)=>a.order-b.order).map(c=>{
      const items = DB.items.filter(i=> i.cat === c.id);
      if(!items.length) return "";
      return '<div class="course" style="margin:8px 0 5px">' + esc(L(c.name)) + '</div>' +
        '<div class="row tight">' + items.map(i=>
          '<button class="btn sm ' + (i.available ? "ghost" : "dang") + '" data-sx="' + i.id + '">' +
          (i.available ? "" : icon("x",12)) + esc(L(i.name)) + '</button>').join("") + '</div>';
    }).join("");
  modal({title:T("k_sold"), size:"wide", body:body, actions:[{label:T("c_close"), cls:"pri", run:()=> refresh()}], onOpen:(w)=>{
    $$("[data-sx]", w).forEach(b=> b.onclick = ()=>{
      const i = itemById(b.getAttribute("data-sx"));
      i.available = !i.available; save();
      b.className = "btn sm " + (i.available ? "ghost" : "dang");
      b.innerHTML = (i.available ? "" : icon("x",12)) + esc(L(i.name));
    });
  }});
}
</script>
<script>
/* ============================================================
   PARTE 13 — SCHEDE PIATTO (ricette e food cost)
   ============================================================ */
function recipeOf(itemId){ return DB.recipes.find(r=> r.itemId === itemId) || null; }
function recipeCost(r){ return r ? sum(r.lines.map(l=>{ const inv = invById(l.invId); return inv ? inv.cost * (Number(l.qty)||0) : 0; })) : 0; }
function itemCost(i){ const r = recipeOf(i.id); return r && r.lines.length ? recipeCost(r) : (i.cost || 0); }
function itemMargin(i){ const c = itemCost(i); return i.price ? ((i.price - c) / i.price) * 100 : 0; }

VIEWS.recipes = function(){
  const items = DB.items.slice().sort((a,b)=> itemMargin(a) - itemMargin(b));
  const avgFc = items.length ? sum(items.map(i=> i.price ? (itemCost(i)/i.price)*100 : 0)) / items.length : 0;

  const html =
    '<div class="grid g3">' +
      stat(T("m_foodcost") + " medio", pct(avgFc), avgFc > 33 ? "sopra il 33 per cento" : "sotto controllo", avgFc > 33 ? "" : "") +
      stat("Schede compilate", DB.recipes.length + "/" + DB.items.length, "ricette con ingredienti") +
      stat("Margine peggiore", items.length ? pct(itemMargin(items[0])) : "-", items.length ? L(items[0].name) : "") +
    '</div>' +
    card(T("nav_recipes"),
      '<div class="scrollx"><table class="tbl"><thead><tr>' +
      '<th>' + esc(T("c_name")) + '</th><th>' + esc(T("c_category")) + '</th>' +
      '<th class="r">' + esc(T("c_price")) + '</th><th class="r">' + esc(T("c_cost")) + '</th>' +
      '<th class="r">' + esc(T("m_foodcost")) + '</th><th class="r">' + esc(T("m_margin")) + '</th><th></th></tr></thead><tbody>' +
      DB.items.slice().sort((a,b)=>{
        const ca = catById(a.cat), cb = catById(b.cat);
        return ((ca&&ca.order)||0) - ((cb&&cb.order)||0) || L(a.name).localeCompare(L(b.name));
      }).map(i=>{
        const c = itemCost(i), fc = i.price ? (c/i.price)*100 : 0, m = itemMargin(i);
        const r = recipeOf(i.id);
        return '<tr class="clik" data-ri="' + i.id + '"><td><b>' + esc(L(i.name)) + '</b>' +
          (r ? ' <span class="badge g" style="font-size:10px">' + r.lines.length + ' ing.</span>' : '') +
          (i.available ? '' : ' <span class="badge r" style="font-size:10px">' + esc(T("k_sold")) + '</span>') + '</td>' +
          '<td style="color:var(--txt-2)">' + esc(L((catById(i.cat)||{}).name || "")) + '</td>' +
          '<td class="r num">' + eur(i.price) + '</td><td class="r num">' + eur(c) + '</td>' +
          '<td class="r num" style="color:var(--' + (fc > 35 ? "red" : fc > 28 ? "amber" : "green") + ')">' + pct(fc) + '</td>' +
          '<td class="r num">' + pct(m) + '</td>' +
          '<td class="r"><button class="btn ico sm ghost" data-ri2="' + i.id + '">' + icon("edit",12) + '</button></td></tr>';
      }).join("") + '</tbody></table></div>', '', "mt flush");

  return {
    title:T("nav_recipes"), sub:"Costo piatto, food cost e margine",
    actions:'<button class="btn ghost" onclick="window.print()">' + icon("print",15) + esc(T("c_print")) + '</button>',
    html:html,
    after:()=>{ $$("[data-ri],[data-ri2]").forEach(b=> b.onclick = (e)=>{ e.stopPropagation(); recipeSheet(b.getAttribute("data-ri") || b.getAttribute("data-ri2")); }); }
  };
};

function recipeSheet(itemId){
  const it = itemById(itemId); if(!it) return;
  let r = recipeOf(itemId);
  if(!r){ r = {id:uid("rc"), itemId:itemId, yield:1, lines:[], method:"", plating:""}; DB.recipes.push(r); }

  const draw = ()=>{
    const cost = recipeCost(r) || it.cost;
    const fc = it.price ? (cost/it.price)*100 : 0;
    return '<div class="grid g3" style="margin-bottom:14px">' +
        stat(T("c_price"), eur(it.price)) + stat(T("c_cost"), eur(cost)) +
        stat(T("m_foodcost"), pct(fc), pct(100-fc) + " " + T("m_margin").toLowerCase()) +
      '</div>' +
      '<div class="lbl">' + esc("Ingredienti per " + (r.yield || 1) + " porzioni") + '</div>' +
      '<div class="card" style="margin-bottom:12px"><div class="card-b flush"><div class="list" id="rc-list">' +
        (r.lines.length ? r.lines.map((l,ix)=>{
          const inv = invById(l.invId);
          return '<div class="li" style="padding:7px 12px"><div class="tx"><b>' + esc(inv ? inv.name : "?") + '</b>' +
            '<span>' + num(l.qty,3) + ' ' + esc(inv ? inv.unit : "") + ' &middot; ' + eur(inv ? inv.cost * l.qty : 0) + '</span></div>' +
            '<div class="end"><button class="btn ico sm dang" data-rl="' + ix + '">' + icon("trash",12) + '</button></div></div>';
        }).join("") : '<div class="li"><div class="tx" style="color:var(--txt-3);font-size:13px">' + esc("Nessun ingrediente") + '</div></div>') +
      '</div></div></div>' +
      '<div class="row" style="margin-bottom:14px">' +
        '<select class="inp" id="rc-inv" style="flex:2">' + DB.inv.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(i=>
          '<option value="' + i.id + '">' + esc(i.name) + ' (' + esc(i.unit) + ')</option>').join("") + '</select>' +
        '<input class="inp" id="rc-q" type="number" step="0.001" min="0" value="0.1" style="flex:1">' +
        '<button class="btn pri" id="rc-add">' + esc(T("c_add")) + '</button>' +
      '</div>' +
      '<div class="field"><label>' + esc("Procedimento") + '</label><textarea class="inp" name="method" placeholder="' + esc("Passaggi, tempi e temperature") + '">' + esc(r.method) + '</textarea></div>' +
      '<div class="field"><label>' + esc("Impiattamento") + '</label><textarea class="inp" name="plating" style="min-height:56px" placeholder="' + esc("Come va nel piatto, guarnizione, temperatura di servizio") + '">' + esc(r.plating) + '</textarea></div>' +
      '<div class="field"><label>' + esc(T("m_allerg")) + '</label><input class="inp" name="allerg" value="' + esc((it.allerg||[]).join(", ")) + '"></div>';
  };
  const wire = (w)=>{
    $("#rc-add", w).onclick = ()=>{
      const invId = $("#rc-inv", w).value, q = Number($("#rc-q", w).value) || 0;
      if(!q) return;
      const ex = r.lines.find(l=> l.invId === invId);
      if(ex) ex.qty += q; else r.lines.push({invId:invId, qty:q});
      save(); $(".modal-b", w).innerHTML = draw(); wire(w);
    };
    $$("[data-rl]", w).forEach(b=> b.onclick = ()=>{
      r.lines.splice(Number(b.getAttribute("data-rl")), 1);
      save(); $(".modal-b", w).innerHTML = draw(); wire(w);
    });
  };
  modal({title:L(it.name), size:"wide", body:draw(), actions:[
    {label:T("c_close"), cls:"ghost", run:()=> refresh()},
    {label:T("c_save"), cls:"pri", run:(w)=>{
      const f = readForm(w);
      r.method = f.method || ""; r.plating = f.plating || "";
      it.allerg = (f.allerg || "").split(",").map(x=> x.trim()).filter(Boolean);
      it.cost = recipeCost(r) || it.cost;
      save(); refresh(); toast(T("c_save"), "ok");
    }}
  ], onOpen:wire});
}
</script>
<script>
/* ============================================================
   PARTE 14 — PREPARAZIONI E HACCP
   ============================================================ */
VIEWS.prep = function(){
  const d = today();
  DB.prep = DB.prep || [];
  const list = DB.prep.filter(p=> p.date === d);
  /* suggerimenti automatici: piatti del giorno e articoli sotto scorta */
  const sug = [];
  specials().forEach(i=> sug.push({txt:"Preparare " + L(i.name) + " (piatto del giorno)", station:i.station}));
  lowStock().slice(0,6).forEach(i=> sug.push({txt:"Controllare " + i.name + ": restano " + num(i.qty,1) + " " + i.unit, station:"magazzino"}));

  const html =
    '<div class="grid g3">' +
      stat("Da fare", list.filter(p=> !p.done).length, "preparazioni") +
      stat(T("c_done"), list.filter(p=> p.done).length + "/" + list.length, fmtDate(d)) +
      stat(T("m_special"), specials().length, "in carta oggi") +
    '</div>' +
    '<div class="grid g2 mt">' +
      card(T("nav_prep") + " " + fmtDate(d,{day:"numeric",month:"short"}),
        (list.length ? '<div class="list">' + list.map(p=>
          '<div class="li ' + (p.done ? "done" : "") + '" style="padding-inline:0">' +
          '<label class="check" style="padding:0"><input type="checkbox" data-pk="' + p.id + '"' + (p.done ? " checked":"") + '></label>' +
          '<div class="tx"><b>' + esc(p.txt) + '</b><span>' + esc(p.station || "") + (p.by ? ' &middot; ' + esc(staffName(p.by)) : '') + '</span></div>' +
          '<div class="end"><button class="btn ico sm dang" data-pd="' + p.id + '">' + icon("trash",12) + '</button></div></div>'
        ).join("") + '</div>' : empty("Aggiungi le preparazioni del giorno","prep")) +
        '<div class="row mt"><input class="inp" id="pp-txt" placeholder="' + esc("Es. sugo per 40 porzioni, tagliare verdure, pane per la sera") + '" style="flex:1">' +
        '<select class="inp" id="pp-st" style="width:auto">' + STATIONS.filter(s=>s!=="tutte").map(s=> '<option>' + esc(s) + '</option>').join("") + '</select>' +
        '<button class="btn pri" id="pp-add">' + icon("plus",14) + '</button></div>', '', "flush") +

      card("Suggeriti dal sistema",
        sug.length ? '<div class="list">' + sug.map((s,i)=>
          '<div class="li" style="padding-inline:0"><div class="ic">' + icon("prep") + '</div>' +
          '<div class="tx"><b style="font-weight:550">' + esc(s.txt) + '</b><span>' + esc(s.station) + '</span></div>' +
          '<div class="end"><button class="btn sm ghost" data-ps="' + i + '">' + esc(T("c_add")) + '</button></div></div>'
        ).join("") + '</div>' : empty("Niente da segnalare","check"), '', "flush") +
    '</div>';

  return {
    title:T("nav_prep"), sub:fmtDate(d,{weekday:"long",day:"numeric",month:"long"}),
    actions:'<button class="btn ghost" onclick="window.print()">' + icon("print",15) + esc(T("c_print")) + '</button>',
    html:html,
    after:()=>{
      const add = (txt, station)=>{ DB.prep.push({id:uid("pp"), date:d, txt:txt, station:station, done:false, by:null}); save(); refresh(); };
      $("#pp-add").onclick = ()=>{ const v = $("#pp-txt").value.trim(); if(v) add(v, $("#pp-st").value); };
      $("#pp-txt").onkeydown = (e)=>{ if(e.key === "Enter"){ const v = e.target.value.trim(); if(v) add(v, $("#pp-st").value); } };
      $$("[data-ps]").forEach(b=> b.onclick = ()=>{ const s = sug[Number(b.getAttribute("data-ps"))]; add(s.txt, s.station); });
      $$("[data-pk]").forEach(b=> b.onchange = ()=>{ const p = DB.prep.find(x=> x.id === b.getAttribute("data-pk")); p.done = b.checked; save(); refresh(); });
      $$("[data-pd]").forEach(b=> b.onclick = ()=>{ DB.prep = DB.prep.filter(x=> x.id !== b.getAttribute("data-pd")); save(); refresh(); });
    }
  };
};

VIEWS.haccp = function(){
  const d = today();
  const log = DB.haccpLog.filter(l=> l.date === d);
  const val = (pid)=>{ const e = log.find(l=> l.pointId === pid); return e ? e.value : ""; };
  const who = (pid)=>{ const e = log.find(l=> l.pointId === pid); return e ? e.by : ""; };

  const html =
    '<p style="font-size:13.5px;color:var(--txt-2);margin-bottom:14px">' +
      esc("Registro giornaliero dei punti di controllo. Va compilato all'apertura e alla chiusura: è il documento che chiede l'ASL.") + '</p>' +
    card("Controlli di oggi &middot; " + fmtDate(d),
      '<div class="scrollx"><table class="tbl"><thead><tr><th>' + esc("Punto di controllo") + '</th><th>' + esc("Limite") + '</th>' +
      '<th>' + esc("Frequenza") + '</th><th style="width:130px">' + esc("Rilevato") + '</th><th>' + esc("Da") + '</th><th></th></tr></thead><tbody>' +
      DB.haccp.map(p=>
        '<tr><td><b>' + esc(L(p.name)) + '</b></td><td class="num" style="color:var(--txt-2)">' + esc(p.limit) + '</td>' +
        '<td style="color:var(--txt-2)">' + esc(p.freq) + '</td>' +
        '<td><input class="inp sm" data-hp="' + p.id + '" value="' + esc(val(p.id)) + '" placeholder="+3 C"></td>' +
        '<td style="color:var(--txt-2)">' + esc(who(p.id) ? staffName(who(p.id)) : "-") + '</td>' +
        '<td class="r">' + (val(p.id) ? '<span class="badge g">' + icon("check",11) + '</span>' : '<span class="badge n">-</span>') + '</td></tr>'
      ).join("") + '</tbody></table></div>', '', "flush") +
    '<div class="row mt">' +
      '<select class="inp" id="hc-by" style="width:auto">' + DB.staff.filter(s=>s.active).map(s=> '<option value="' + s.id + '">' + esc(s.name) + '</option>').join("") + '</select>' +
      '<button class="btn pri" id="hc-save">' + icon("check",15) + esc(T("c_save")) + '</button>' +
      '<div class="spacer"></div><button class="btn ghost" onclick="window.print()">' + icon("print",15) + esc(T("c_print")) + '</button>' +
    '</div>' +
    card("Registro ultimi giorni",
      (()=>{ const days = [...new Set(DB.haccpLog.map(l=> l.date))].sort().reverse().slice(0,8);
        return days.length ? '<div class="list">' + days.map(dd=>{
          const n = DB.haccpLog.filter(l=> l.date === dd).length;
          return '<div class="li" style="padding-inline:0"><div class="ic">' + icon("haccp") + '</div>' +
            '<div class="tx"><b>' + esc(fmtDate(dd,{weekday:"long",day:"numeric",month:"long"})) + '</b><span>' + n + '/' + DB.haccp.length + ' ' + esc("controlli registrati") + '</span></div>' +
            '<div class="end"><span class="badge ' + (n >= DB.haccp.length ? "g" : "a") + '">' + pct((n/DB.haccp.length)*100) + '</span></div></div>';
        }).join("") + '</div>' : empty("Nessuna registrazione","haccp"); })(), '', "mt flush");

  return {

function printMenuSheet(){
  let cur = LANG;
  const body =
    '<div class="row" style="margin-bottom:14px" id="mp-langs">' +
      LKEYS.map(lk=> '<button class="btn ' + (lk === cur ? "pri" : "ghost") + ' sm" data-ml="' + lk + '">' +

    {label:T("c_print"), cls:"pri", run:(w)=>{ printMenus([w.dataset.ml || cur], {photos:$("#mp-ph", w).checked}); return false; }}
  ], onOpen:(w)=>{
    w.dataset.ml = cur;
    const draw = ()=> $("#mp-prev", w).innerHTML = menuHTML(w.dataset.ml, {photos:$("#mp-ph", w).checked});
    $$("[data-ml]", w).forEach(b=> b.onclick = ()=>{
      w.dataset.ml = b.getAttribute("data-ml");

      draw();
    });
    $("#mp-ph", w).onchange = draw;
  }});
}

function printMenus(langs, opts){
  const w = window.open("", "_blank", "width=820,height=1000");
  if(!w){ toast("Consenti le finestre popup per stampare","err"); return; }
  const css = Array.from(document.styleSheets).map(ss=>{
    try{ return Array.from(ss.cssRules).map(r=> r.cssText).join("\n"); }catch(e){ return ""; }
  }).join("\n");
  w.document.write('<!doctype html><meta charset="utf-8"><title>' + esc(DB.meta.biz.name) + '</title>' +
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Noto+Sans+Arabic:wght@400;600&display=swap">' +
    '<style>' + css + '\nbody{background:#fff;padding:0;margin:0}' +
    '.sheet{box-shadow:none;margin:0 auto;padding:24mm 20mm;max-width:210mm;break-after:page}' +
    '@page{size:A4;margin:0}</style>' +
    langs.map(lk=> menuHTML(lk, opts)).join(""));
  w.document.close();
  setTimeout(()=> w.print(), 700);
}
